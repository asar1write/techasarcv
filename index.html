    /* ==================================================
       2. ULTRA-SMOOTH, FAST, & ELEGANT ANIMATIONS

    @keyframes smoothSlideRight { 0% { opacity: 0; transform: translateX(35px); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes smoothSlideLeft { 0% { opacity: 0; transform: translateX(-35px); } 100% { opacity: 1; transform: translateX(0); } }
    @keyframes elegantFadeIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes elegantFadeOut { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-15px); } }
    @keyframes bootUpScale { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .anim-next { animation: smoothSlideRight 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards; will-change: transform, opacity; }
    .anim-prev { animation: smoothSlideLeft 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards; will-change: transform, opacity; }
    .elegant-entry { animation: elegantFadeIn 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; will-change: transform, opacity; }
    .elegant-exit { pointer-events: none; animation: elegantFadeOut 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; will-change: transform, opacity; }
    .zoom-transition { transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .bootup-anim { animation: bootUpScale 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards; will-change: transform, opacity; }

    /* Custom Scrollbar for dropdown */
    .custom-scrollbar::-webkit-scrollbar { width: 4px !important; display: block !important; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

    /* Background Blobs */
    @keyframes blobFloat1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }
    @keyframes blobFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-20px, 20px) scale(0.95); } }
    .blob-1 { animation: blobFloat1 12s ease-in-out infinite; will-change: transform; }
    .blob-2 { animation: blobFloat2 15s ease-in-out infinite; will-change: transform; }

    .stagger-entry { opacity: 0; animation: elegantFadeIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; will-change: transform, opacity; }
    .d-0 { animation-delay: 0ms; } .d-1 { animation-delay: 60ms; } .d-2 { animation-delay: 120ms; } .d-3 { animation-delay: 180ms; }

    @media (prefers-reduced-motion: reduce) {
      .elegant-exit, .elegant-entry, .anim-next, .anim-prev, .bootup-anim { animation: none !important; opacity: 1 !important; transform: none !important; }
    }

    .cv-page-canvas { width: 794px; min-height: 1123px; box-sizing: border-box; background-color: #ffffff; }
    #cv-print-container { display: none; }

    body.is-printing {

        color: #000000 !important;
        overflow: visible !important;

    }
    body.is-printing #cv-print-container {

        width: 100% !important;
        visibility: visible !important;
    }

        const parts = path.split('.'); let current = obj;
        for (let i = 0; i < parts.length - 1; i++) { if (!current[parts[i]]) current[parts[i]] = {}; current = current[parts[i]]; }
        current[parts[parts.length - 1]] = value;
    }

    function showUIAlert(title, msg, isConfirm = false, callback = null) {
        document.getElementById('custom-alert-title').innerText = title;
        document.getElementById('custom-alert-msg').innerText = msg;
        const actions = document.getElementById('custom-alert-actions');
        alertCallback = callback;

    async function loginWithGoogle() {
        if (!window.auth || !window.GoogleAuthProvider) return;
        const provider = new window.GoogleAuthProvider();
        try { 
            await window.signInWithPopup(window.auth, provider); 
        } 
        catch (error) { 
            if(error.code === 'auth/popup-blocked') {
                showUIAlert("POPUP BLOCKED", "Please allow popups in your browser to login with Google.", false);
            } else {
                showUIAlert("LOGIN FAILED", "Network or browser error. Please try again.", false); 
            }

    function filterGlobalDropdown(val) {
        const query = val.toUpperCase();
        const items = document.querySelectorAll('.dropdown-item');
        let hasVisible = false;
        items.forEach(el => {
            const txt = el.innerText.toUpperCase();
            if(txt.includes(query)) {
                el.style.display = 'flex';
                hasVisible = true;
            } else {
                el.style.display = 'none';
            }
        });
        
        let noRes = document.getElementById('no-results-msg');
        if(!hasVisible) {
            if(!noRes) {
                noRes = document.createElement('div');
                noRes.id = 'no-results-msg';
                noRes.className = 'text-zinc-500 text-xs text-center py-6 font-bold uppercase';
                noRes.innerText = 'NO MATCHES FOUND';
                document.getElementById('global-dropdown-list').appendChild(noRes);
            }
        } else {
            if(noRes) noRes.remove();
        }
    }

    function openGlobalDropdown(e, fieldPath, optionsStr, placeholder) {
        const rect = e.currentTarget.getBoundingClientRect();
        dropdownOriginX = (rect.left + rect.width / 2) - (window.innerWidth / 2);
        dropdownOriginY = (rect.top + rect.height / 2) - (window.innerHeight / 2);

        const options = JSON.parse(decodeURIComponent(optionsStr));
        const list = document.getElementById('global-dropdown-list');
        const currentVal = getNested(cvData, fieldPath);
        
        document.getElementById('global-dropdown-title').innerText = placeholder;
        
        const searchInput = document.getElementById('global-dropdown-search');
        if(searchInput) searchInput.value = '';

        list.innerHTML = options.map(opt => `
            <div onclick="selectGlobalDropdown('${fieldPath}', '${opt.val}', '${opt.label}')" class="dropdown-item px-4 py-3.5 rounded-xl text-[13px] font-bold uppercase cursor-pointer transition-all flex items-center justify-between ${currentVal === opt.val ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'hover:bg-zinc-800/80 text-zinc-300 bg-zinc-900/30'}">
                <span>${opt.label}</span>
                ${currentVal === opt.val ? `<svg class="w-4 h-4 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>` : ''}
            </div>
        `).join('');

        const modal = document.getElementById('global-dropdown-modal');
        const box = document.getElementById('global-dropdown-box');
        
        // FREEZE LAYOUT HEIGHT TO PREVENT KEYBOARD JUMP BUG
        modal.style.height = window.innerHeight + 'px';
        document.body.style.overflow = 'hidden';
        
        box.style.transition = 'none';
        modal.style.transition = 'none';
        box.style.transform = `translate(${dropdownOriginX}px, ${dropdownOriginY}px) scale(0)`;
        box.style.opacity = '0';
        modal.style.opacity = '0';

        modal.classList.remove('hidden');
        modal.classList.add('flex', 'items-center', 'justify-center'); 
        
        requestAnimationFrame(() => {
            box.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease';
            modal.style.transition = 'opacity 0.35s ease';
            
            box.style.transform = `translate(0px, 0px) scale(1)`;
            box.style.opacity = '1';
            modal.style.opacity = '1';
        });
    }

    function closeGlobalDropdown(e, force = false) {
        if(!force && e && e.target.id !== 'global-dropdown-modal') return; 
        
        const modal = document.getElementById('global-dropdown-modal');
        const box = document.getElementById('global-dropdown-box');
        
        box.style.transform = `translate(${dropdownOriginX}px, ${dropdownOriginY}px) scale(0)`;
        box.style.opacity = '0';
        modal.style.opacity = '0';
        
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'items-center', 'justify-center');
            modal.style.height = '';
            document.body.style.overflow = '';
        }, 350); 
    }

    function processPassportPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Failed to read image"));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image"));
          img.onload = () => {
            const targetW = 413, targetH = 531;
            const targetAspect = targetW / targetH;
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            let sx = 0, sy = 0, sw = srcW, sh = srcH;
            if (srcW / srcH > targetAspect) { sw = srcH * targetAspect; sx = (srcW - sw) / 2; } 
            else { sh = srcW / targetAspect; sy = Math.max(0, (srcH - sh) * 0.22); }
            const canvas = document.createElement('canvas');
            canvas.width = targetW; canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return resolve(ev.target.result);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, targetW, targetH);
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatText(str, tCase) {
      if (!str) return '';
      let cleanStr = escapeHtml(str);
      if (tCase === 'capitalize') {
          return cleanStr.toLowerCase().replace(/(^\w|\s\w)/g, m => m.toUpperCase());
      }
      return cleanStr.toUpperCase();
    }

    function renderApp() {
      const container = document.getElementById('main-view-container');
      const scrollArea = document.getElementById('editor-scroll-area');
      const currentScroll = scrollArea ? scrollArea.scrollTop : 0;

      if (justLoggedIn && currentUser && !appStarted) {
          renderBootupSplash(container);
          return;
      }

      if (!appStarted) {
        renderWelcomeScreen(container);
        return;
      }

      if (activeView === 'preview') {
        renderPreviewView(container);
      } else {
        renderEditorView(container);
      }
      
      if (!isNavigating && !enteringEditor) {
        requestAnimationFrame(() => {
          const newScroll = document.getElementById('editor-scroll-area');
          if(newScroll) newScroll.scrollTop = currentScroll;
        });
      }
      isNavigating = false;
    }

    function goToHome() {
      const container = document.getElementById('main-view-container');
      if (container) container.classList.add('elegant-exit');
      setTimeout(() => {
        appStarted = false;
        enteringEditor = false;
        isNavigating = true;
        renderApp();
      }, 250);
    }

        if (!currentUser) return showUIAlert("LOGIN REQUIRED", "PLEASE LOGIN WITH GOOGLE TO CREATE A CV!", false);
        createNewCV();
    }

    function handleHistoryClick() {
        if (!currentUser) return showUIAlert("LOGIN REQUIRED", "PLEASE LOGIN WITH GOOGLE TO VIEW HISTORY!", false);
        openHistory();
    }

      cvData = JSON.parse(JSON.stringify(defaultCVData));
      currentCvId = Date.now().toString();
      localStorage.setItem('techasar_current_cv_id', currentCvId);
      saveState();
      
      const card = document.getElementById('welcome-container');
      if (card) card.classList.add('elegant-exit');
      
      setTimeout(() => {
        appStarted = true;
        enteringEditor = true;
        isNavigating = true;
        currentPage = 1;
        activeView = 'editor';
        renderApp();
      }, 300); 
    }

      modal.classList.add('flex');
    }

    function closeHistory() {
      const modal = document.getElementById('cv-history-modal');
      modal.classList.add('hidden');

    async function renderHistoryList() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12 opacity-80">
           <div class="w-8 h-8 border-[3px] border-zinc-800 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
           <div class="text-zinc-500 text-xs font-bold uppercase tracking-widest">FETCHING HISTORY...</div>
        </div>
      `;
      
      if (!currentUser || !window.db) return;

      try {
          const querySnapshot = await window.getDocs(window.collection(window.db, `users/${currentUser.uid}/cvs`));
          let hist = [];
          querySnapshot.forEach((doc) => { hist.push(doc.data()); });
          hist.sort((a,b) => b.timestamp - a.timestamp);

          if (hist.length === 0) {
            container.innerHTML = '<div class="text-zinc-500 text-sm text-center py-8 font-bold uppercase">NO CVS FOUND IN HISTORY.</div>';
            return;
          }
          
          container.innerHTML = hist.map(h => `
            <div class="flex items-center justify-between p-3 bg-[#181826] border border-zinc-700/80 hover:border-zinc-600 rounded-xl mb-2 transition-all">
              <div class="flex flex-col flex-1 min-w-0 cursor-pointer py-1" onclick="loadCVFromHistory(event, '${h.id}')">
                <span class="text-zinc-100 font-bold text-sm truncate uppercase">${escapeHtml(h.name)}</span>
                <span class="text-zinc-500 text-[11px] mt-0.5 font-bold uppercase">${h.date || 'SAVED RECENTLY'}</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-3">
                <button type="button" onclick="loadCVFromHistory(event, '${h.id}')" class="p-2 bg-indigo-600/20 hover:bg-indigo-600/40 rounded-lg text-indigo-400 active:scale-95 transition-all" title="Edit">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                </button>
                <button type="button" onclick="printFromHistory(event, '${h.id}')" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-bold active:scale-95 transition-transform shadow-sm uppercase w-[80px] justify-center">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
                  <span>PRINT</span>
                </button>
                <button type="button" onclick="deleteFromHistory(event, '${h.id}')" class="p-2 bg-zinc-800/80 hover:bg-zinc-700 rounded-lg text-zinc-400 hover:text-red-400 active:scale-95 transition-all" title="Delete">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>
          `).join('');
      } catch(e) {
          container.innerHTML = '<div class="text-red-400 text-sm text-center py-8 font-bold uppercase">ERROR LOADING HISTORY.</div>';
      }
    }

    async function loadCVFromHistory(e, id) {
      if(e) e.stopPropagation();
      if(!currentUser || !window.db) return;
      try {
          const docSnap = await window.getDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
          if(docSnap.exists()){
             cvData = JSON.parse(JSON.stringify(docSnap.data().data));
             currentCvId = id;
             localStorage.setItem('techasar_current_cv_id', currentCvId);
             saveState();
             closeHistory();
             appStarted = true;
             enteringEditor = true;
             isNavigating = true;
             currentPage = 1;
             activeView = 'editor';
             renderApp();
          }
      } catch(e) {}
    }

    async function printFromHistory(e, id) {
      if(e) e.stopPropagation();
      if(!currentUser || !window.db) return;
      
      const btn = e.currentTarget;
      const ogHTML = btn.innerHTML;
      btn.innerHTML = `<div class="w-3.5 h-3.5 border-[2px] border-white/30 border-t-white rounded-full animate-spin"></div>`;
      
      try {
          const docSnap = await window.getDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
          if(docSnap.exists()){
             const tempOldData = cvData;
             cvData = JSON.parse(JSON.stringify(docSnap.data().data));
             
             cvData.personal = cvData.personal || {};
             cvData.details = cvData.details || {};
             cvData.footer = cvData.footer || {};
             
             requestAnimationFrame(() => {
                 triggerPrint(() => {
                    cvData = tempOldData;
                    if(activeView === 'preview') renderApp();
                 });
             });
          }
      } catch(err) {
          showUIAlert("ERROR", "Failed to load CV for printing.", false);
      }
      btn.innerHTML = ogHTML;
    }

    function deleteFromHistory(e, id) {
        if(e) e.stopPropagation();
        showUIAlert("DELETE CV?", "ARE YOU SURE YOU WANT TO DELETE THIS CV FROM HISTORY?", true, async (res) => {
            if(res) {
                try {
                    await window.deleteDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
                    if (currentCvId === id) {
                      cvData = JSON.parse(JSON.stringify(defaultCVData));
                      currentCvId = null;
                      localStorage.removeItem('techasar_current_cv_id');
                      saveState();
                    }
                    renderHistoryList();
                } catch(e) {}
            }
        });
    }

                  <button type="button" onclick="appendHobby('MUSIC')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95">+ MUSIC</button>
                  <button type="button" onclick="appendHobby('LISTENING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95">+ LISTENING</button>
                  <button type="button" onclick="appendHobby('GAMING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95">+ GAMING</button>
                  <button type="button" onclick="appendHobby('EDITING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95">+ EDITING</button>
                  <button type="button" onclick="appendHobby('READING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95">+ READING</button>
                  <button type="button" onclick="appendHobby('TRAVELING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95">+ TRAVELING</button>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 7) {
        stepContentHTML = `
          <div class="space-y-3.5">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-2.5">
              <label class="block text-xs font-bold text-zinc-200 uppercase tracking-wider">DECLARATION STATEMENT</label>
              <textarea id="declaration-input" rows="4" oninput="cvData.declaration = this.value; saveState(); autoResizeTextarea(this);" placeholder="WRITE YOUR DECLARATION HERE..." class="uppercase w-full min-h-[110px] bg-[#181826] border border-zinc-700/80 rounded-xl p-3 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500 leading-relaxed resize-none">${escapeHtml(cvData.declaration)}</textarea>
              <div class="pt-2 border-t border-zinc-800">
                <span class="text-[11px] font-bold text-zinc-400 block mb-1.5 uppercase">QUICK TEMPLATE:</span>
                <button type="button" onclick="setDeclarationPreset('I HEREBY DECLARE THAT ALL THE INFORMATION MENTIONED ABOVE IS TRUE TO THE BEST OF MY KNOWLEDGE. IF YOU GIVE ME A CHANCE, I ASSURE MY HARD WORK, DEDICATION AND SINCERITY')" class="w-full text-left text-[11.5px] font-bold bg-[#181826] hover:bg-[#1f1f32] p-2.5 rounded-xl border border-zinc-700/70 text-zinc-300 uppercase active:scale-[0.99] transition-all">"I HEREBY DECLARE THAT ALL THE INFORMATION..."</button>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 8) {
        let dateInputVal = '';
        if (cvData.footer.date && cvData.footer.date.includes('/')) {
            const parts = cvData.footer.date.split('/');
            if(parts.length === 3) dateInputVal = `${parts[2]}-${parts[1]}-${parts[0]}`;
        } else { dateInputVal = cvData.footer.date; }

        stepContentHTML = `
          <div class="space-y-3.5">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-4">
              <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2 mb-3">SIGN-OFF DETAILS</h3>
                <div class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">DATE</label>
                    <div class="date-wrapper">
                      <input type="date" value="${dateInputVal}" oninput="const d = this.value; if(d){ const parts = d.split('-'); cvData.footer.date = parts[2]+'/'+parts[1]+'/'+parts[0]; } else { cvData.footer.date = ''; } saveState();" class="uppercase w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">PLACE</label>
                    <input type="text" value="${escapeHtml(cvData.footer.place)}" oninput="cvData.footer.place = this.value; saveState();" class="uppercase w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">SIGNATURE NAME</label>
                    <input type="text" value="${escapeHtml(cvData.footer.signName)}" oninput="cvData.footer.signName = this.value; saveState();" class="uppercase w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 9) {
        stepContentHTML = `
          <div class="space-y-3.5">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-4">
              <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2 mb-3">DOCUMENT SETTINGS</h3>
                <div class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">DOCUMENT TITLE</label>
                    ${createCustomDropdown('documentTitle', [{label: 'CURRICULUM VITAE', val: 'CURRICULUM VITAE'}, {label: 'RESUME', val: 'RESUME'}], 'SELECT TITLE')}
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">DOCUMENT FONT</label>
                    ${createCustomDropdown('font', [{label: 'TIMES NEW ROMAN', val: 'Times New Roman'}, {label: 'ARIAL', val: 'Arial'}, {label: 'CALIBRI', val: 'Calibri'}, {label: 'ALGERIAN', val: 'Algerian'}], 'SELECT FONT')}
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">TEXT WEIGHT</label>
                    ${createCustomDropdown('fontWeight', [{label: 'BOLD TEXT', val: 'bold'}, {label: 'NORMAL TEXT', val: 'normal'}], 'SELECT TEXT WEIGHT')}
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase">TEXT CASE</label>
                    ${createCustomDropdown('textCase', [{label: 'UPPERCASE (ALL CAPITAL)', val: 'uppercase'}, {label: 'PROPER CASE (FIRST LETTER CAPITAL)', val: 'capitalize'}], 'SELECT TEXT CASE')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden relative">
          <div class="h-14 px-3 bg-[#11111c] border-b border-zinc-800/80 flex items-center justify-between shrink-0 sticky top-0 z-30 shadow-sm relative">
            <button type="button" onclick="goToHome()" class="p-2 rounded-xl border border-zinc-800 bg-[#181826] text-zinc-400 hover:text-white active:scale-95 transition-all relative z-10">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <span class="absolute inset-0 flex items-center justify-center pointer-events-none text-[15px] font-black text-zinc-100 tracking-widest uppercase">
                STEP ${currentPage}/${TOTAL_STEPS}
            </span>
            <button type="button" onclick="openResetDialog()" class="p-2 rounded-xl border border-zinc-800 bg-[#181826] text-zinc-400 hover:text-red-400 active:scale-95 transition-all relative z-10">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>
            </button>
          </div>
          
          <div id="editor-scroll-area" class="flex-1 overflow-y-auto px-3.5 py-4 pb-28 w-full overflow-x-hidden relative scroll-smooth bg-[#08080e]">
            <div class="${animClass} w-full">${stepContentHTML}</div>
          </div>
          <div class="absolute bottom-0 left-0 right-0 z-30 bg-[#0c0c16]/95 backdrop-blur-md border-t border-zinc-800 px-4 py-2.5 flex items-center justify-between gap-2.5 pb-[max(10px,env(safe-area-inset-bottom))]">
            <button type="button" ${currentPage === 1 ? 'disabled' : ''} onclick="goPrevStep()" class="flex items-center gap-1 px-3.5 py-2 rounded-xl bg-[#181826] disabled:opacity-30 text-zinc-300 text-xs font-bold uppercase border border-zinc-700/60 active:scale-95 shrink-0 transition-transform">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg>
              <span>PREV</span>
            </button>
            <button type="button" onclick="openPreview()" class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700/80 text-xs font-bold uppercase active:scale-95 shadow-sm transition-transform">
              <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              <span>PREVIEW CV</span>
            </button>
            <button type="button" onclick="goNextStep()" class="flex items-center gap-1 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase active:scale-95 shadow-md shadow-indigo-600/30 shrink-0 transition-transform">
              <span>${currentPage === TOTAL_STEPS ? 'REVIEW' : 'NEXT'}</span>
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6" /></svg>
            </button>
          </div>
        </div>
      `;

      requestAnimationFrame(() => { container.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el)); });
    }

    function renderPreviewView(container) {
      const scaledW = Math.round(794 * previewZoom);
      const scaledH = Math.round(1123 * previewZoom);

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden bg-[#06060a] elegant-entry">
          <div class="bg-[#0e0e18] border-b border-zinc-800 px-3 py-2 flex items-center justify-between gap-2 z-20 shrink-0">
            <button type="button" onclick="closePreview()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-100 text-xs font-bold uppercase border border-zinc-700 active:scale-95">
              <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg>
              <span>EDIT</span>
            </button>
            <div class="flex items-center gap-1 bg-[#141422] p-1 rounded-lg border border-zinc-800">
              <button type="button" onclick="zoomPreview(-0.1)" class="w-6 h-6 flex items-center justify-center text-zinc-400 active:scale-90"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg></button>
              <span class="text-[11px] font-bold text-zinc-300 min-w-9 text-center tabular-nums">${Math.round(previewZoom * 100)}%</span>
              <button type="button" onclick="zoomPreview(0.1)" class="w-6 h-6 flex items-center justify-center text-zinc-400 active:scale-90"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg></button>
              <button type="button" onclick="fitPreviewWidth()" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase text-indigo-400 bg-indigo-500/10 active:scale-90">FIT</button>
            </div>
            <button type="button" onclick="handleDirectPrint()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-100 text-xs font-bold uppercase border border-zinc-700 active:scale-95 shadow-sm">
              <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
              <span>PRINT</span>
            </button>
          </div>
          <div id="preview-viewport-container" class="flex-1 overflow-y-auto overflow-x-auto p-2 sm:p-6 pb-20 flex flex-col items-center relative" style="background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px), linear-gradient(to bottom, #090a10, #040407); background-size: 20px 20px, 100% 100%;">
            <div class="relative my-auto shrink-0 bg-white zoom-transition" style="width: ${scaledW}px; height: ${scaledH}px; min-height: ${scaledH}px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 15px 35px -5px rgba(0, 0, 0, 0.85);">
              <div style="width: 794px; min-height: 1123px; transform: scale(${previewZoom}); transform-origin: top left; position: absolute; top: 0; left: 0;" class="zoom-transition">
                ${getDocumentHTML('cv-screen-preview-node', false)}
              </div>
            </div>
          </div>
          <div class="fixed bottom-3 left-4 right-4 z-30 flex items-center justify-between gap-3 bg-[#10101c]/95 backdrop-blur-lg px-3 py-2 rounded-2xl border border-zinc-800 shadow-2xl">
            <button type="button" onclick="closePreview()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-bold uppercase active:scale-95">
              <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
              <span>EDIT DETAILS</span>
            </button>
            <button type="button" onclick="handleDirectPrint()" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase active:scale-95 shadow-lg shadow-emerald-600/30 transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
              <span>PRINT CV</span>
            </button>
          </div>
        </div>
      `;
    }

    function goNextStep() {
      if (currentPage < TOTAL_STEPS) {
        animDirection = 'next';
        currentPage++;
        isNavigating = true;
        renderApp();
        requestAnimationFrame(() => {
           const scrollArea = document.getElementById('editor-scroll-area');
           if(scrollArea) scrollArea.scrollTop = 0;
        });
      } else {
        openPreview();
      }
    }

    function goPrevStep() {
      if (currentPage > 1) {
        animDirection = 'prev';
        currentPage--;
        isNavigating = true;
        renderApp();
        requestAnimationFrame(() => {
           const scrollArea = document.getElementById('editor-scroll-area');
           if(scrollArea) scrollArea.scrollTop = 0;
        });
      }
    }

    function openPreview() {
      activeView = 'preview';
      fitPreviewWidth();
      renderApp();
    }

    function closePreview() {
      activeView = 'editor';
      isNavigating = true;
      renderApp();
    }

    function fitPreviewWidth() {
      const container = document.getElementById('preview-viewport-container');
      const w = container ? container.clientWidth - 16 : window.innerWidth - 16;
      previewZoom = Number(Math.max(0.35, Math.min(1.1, w / 794)).toFixed(2));
      if (activeView === 'preview') renderApp();
    }

    function zoomPreview(delta) {
      previewZoom = Number(Math.max(0.35, Math.min(1.4, previewZoom + delta)).toFixed(2));
      renderApp();
    }

    function handleDirectPrint() {
      triggerPrint();
    }

    function openResetDialog() {
      const m = document.getElementById('reset-modal');
      if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
    }

    function closeResetDialog() {
      const m = document.getElementById('reset-modal');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
    }

    function confirmReset() {
      cvData = JSON.parse(JSON.stringify(defaultCVData));
      appStarted = false; 
      currentPage = 1;
      activeView = 'editor';
      currentCvId = null;
      localStorage.removeItem('techasar_current_cv_id');
      saveState();
      closeResetDialog();
      renderApp();
    }

    window.addEventListener('resize', () => { if (activeView === 'preview') fitPreviewWidth(); });
    document.addEventListener('DOMContentLoaded', () => { renderApp(); });
  </script>
</body>
</html>
