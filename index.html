<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
  <title>TECH ASAR CV</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/algerian">

  <style>
    /* ===================================================
       CENTRALIZED BUTTERY-SMOOTH MOTION ARCHITECTURE
       =================================================== */
    :root {
      --motion-fast: 160ms;
      --motion-normal: 260ms; 
      --motion-page: 320ms;
      
      /* Premium Easings */
      --ease-standard: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-bouncy: cubic-bezier(0.34, 1.15, 0.64, 1);
      --ease-subtle: cubic-bezier(0.25, 1, 0.2, 1);
      
      --slide-offset: 24px;
      --slide-y-offset: 14px;
    }

    html, body {
      background-color: #08080e !important;
      color: #f4f4f5;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      overscroll-behavior: none; 
      -webkit-user-select: none;
      user-select: none;
    }

    @font-face {
      font-family: 'Algerian';
      font-style: normal;
      font-weight: 400;
      src: local('Algerian'), url('https://fonts.cdnfonts.com/s/137771/vertopal.com_vertopal.com_ALGER.woff') format('woff');
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    input, textarea {
      -webkit-user-select: auto;
      user-select: auto;
      transition: background-color var(--motion-normal) ease, border-color var(--motion-normal) ease, box-shadow var(--motion-normal) ease;
    }

    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    *::-webkit-scrollbar, ::-webkit-scrollbar, .hide-scroll::-webkit-scrollbar { display: none !important; width: 0px !important; height: 0px !important; background: transparent !important; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; overscroll-behavior-y: none; }

    .font-algerian { font-family: 'Algerian', 'Times New Roman', serif !important; }

    /* --- CROSSFADE APP ENTRY --- */
    @keyframes appCrossfade {
        0% { transform: scale(0.96); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .trigger-app-entry {
        animation: appCrossfade 0.4s var(--ease-standard) forwards !important;
    }

    /* --- STAGGERED SLIDE UP ENTRY --- */
    @keyframes smoothSlideUp {
        0% { opacity: 0; transform: translate3d(0, 16px, 0); }
        100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .animate-entry > * { opacity: 0; animation: smoothSlideUp 0.38s var(--ease-subtle) forwards; will-change: transform, opacity; }
    .animate-entry > *:nth-child(1) { animation-delay: 0.04s; }
    .animate-entry > *:nth-child(2) { animation-delay: 0.08s; }
    .animate-entry > *:nth-child(3) { animation-delay: 0.12s; }
    .animate-entry > *:nth-child(4) { animation-delay: 0.16s; }
    .animate-entry > *:nth-child(5) { animation-delay: 0.20s; }
    .animate-entry > *:nth-child(6) { animation-delay: 0.24s; }
    .animate-entry > *:nth-child(7) { animation-delay: 0.28s; }
    .animate-entry > *:nth-child(8) { animation-delay: 0.32s; }

    /* --- STRICT HORIZONTAL & VIEW TRANSITIONS --- */
    .app-layer {
      will-change: transform, opacity;
      background-color: #08080e;
    }

    .layer-enter-nav-next { animation: pageSlideInRight var(--motion-page) var(--ease-standard) forwards; }
    .layer-exit-nav-next { animation: pageSlideOutLeft var(--motion-page) var(--ease-standard) forwards; pointer-events: none; }
    .layer-enter-nav-prev { animation: pageSlideInLeft var(--motion-page) var(--ease-standard) forwards; }
    .layer-exit-nav-prev { animation: pageSlideOutRight var(--motion-page) var(--ease-standard) forwards; pointer-events: none; }
    .layer-enter-enter-editor { animation: pageFadeUpIn var(--motion-page) var(--ease-standard) forwards; }
    .layer-exit-enter-editor { animation: pageFadeUpOut var(--motion-page) var(--ease-standard) forwards; pointer-events: none; }
    .layer-enter-exit-home { animation: pageFadeDownIn var(--motion-page) var(--ease-standard) forwards; }
    .layer-exit-exit-home { animation: pageFadeDownOut var(--motion-page) var(--ease-standard) forwards; pointer-events: none; }
    .layer-enter-enter-preview { animation: fadeScaleIn var(--motion-page) var(--ease-standard) forwards; }
    .layer-exit-enter-preview { animation: editorFadeOut var(--motion-page) var(--ease-standard) forwards; pointer-events: none; }
    .layer-enter-exit-preview { animation: editorFadeIn var(--motion-page) var(--ease-standard) forwards; }
    .layer-exit-exit-preview { animation: fadeScaleOut var(--motion-page) var(--ease-standard) forwards; pointer-events: none; }

    @keyframes pageSlideInRight { 0% { opacity: 0; transform: translate3d(var(--slide-offset), 0, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    @keyframes pageSlideOutLeft { 0% { opacity: 1; transform: translate3d(0, 0, 0); } 100% { opacity: 0; transform: translate3d(calc(var(--slide-offset) * -1), 0, 0); } }
    @keyframes pageSlideInLeft { 0% { opacity: 0; transform: translate3d(calc(var(--slide-offset) * -1), 0, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    @keyframes pageSlideOutRight { 0% { opacity: 1; transform: translate3d(0, 0, 0); } 100% { opacity: 0; transform: translate3d(var(--slide-offset), 0, 0); } }
    @keyframes pageFadeUpIn { 0% { opacity: 0; transform: translate3d(0, var(--slide-y-offset), 0) scale(0.985); } 100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
    @keyframes pageFadeUpOut { 0% { opacity: 1; transform: translate3d(0, 0, 0); } 100% { opacity: 0; transform: translate3d(0, -10px, 0); } }
    @keyframes pageFadeDownIn { 0% { opacity: 0; transform: translate3d(0, -12px, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    @keyframes pageFadeDownOut { 0% { opacity: 1; transform: translate3d(0, 0, 0); } 100% { opacity: 0; transform: translate3d(0, 12px, 0); } }
    @keyframes fadeScaleIn { 0% { opacity: 0; transform: translate3d(0, var(--slide-y-offset), 0) scale(0.985); } 100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
    @keyframes fadeScaleOut { 0% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } 100% { opacity: 0; transform: translate3d(0, var(--slide-y-offset), 0) scale(0.985); } }
    @keyframes editorFadeOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.985); } }
    @keyframes editorFadeIn { 0% { opacity: 0; transform: scale(0.985); } 100% { opacity: 1; transform: scale(1); } }

    /* ===================================================
       ORIGIN-AWARE DYNAMIC MODAL PHYSICS
       =================================================== */
    .modal-backdrop { opacity: 0; display: none; }
    .modal-box { opacity: 0; transform: scale(0.3); }

    .modal-enter-backdrop { animation: modalFadeIn 0.3s ease forwards; }
    .modal-exit-backdrop { animation: modalFadeOut 0.28s ease forwards; pointer-events: none; }
    .modal-enter-box { animation: originPopIn 0.35s var(--ease-bouncy) forwards; }
    .modal-exit-box { animation: originPopOut 0.28s var(--ease-standard) forwards; pointer-events: none; }

    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalFadeOut { from { opacity: 1; } to { opacity: 0; } }
    
    @keyframes originPopIn {
        from { opacity: 0; transform: translate3d(var(--start-x), var(--start-y), 0) scale(0.3); }
        to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes originPopOut {
        from { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        to { opacity: 0; transform: translate3d(var(--start-x), var(--start-y), 0) scale(0.3); }
    }

    /* --- ANIMATED SVG TICK-BOX --- */
    .tick-box { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ease-standard); pointer-events: none; }
    .tick-box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 0.28s ease 0.08s; }
    .tick-box.ticked { background: #4f46e5; border-color: #4f46e5; transform: scale(1.08) translate3d(0,0,0); }
    .tick-box.ticked svg { stroke-dashoffset: 0; }

    /* --- STAGGERED LISTS & ROWS --- */
    .stagger-item { opacity: 0; animation: staggerSlideIn var(--motion-normal) var(--ease-standard) forwards; }
    @keyframes staggerSlideIn { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
    .search-hide { animation: searchFadeOut var(--motion-fast) var(--ease-standard) forwards; }
    @keyframes searchFadeOut { from { opacity: 1; transform: translate3d(0, 0, 0); } to { opacity: 0; transform: translate3d(0, -4px, 0); } }
    
    .list-item-enter { animation: itemEnter var(--motion-normal) var(--ease-standard) forwards; }
    .list-item-exit { animation: itemExit var(--motion-fast) var(--ease-standard) forwards; pointer-events: none; }
    @keyframes itemEnter { from { opacity: 0; transform: translate3d(0, 8px, 0) scale(0.985); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
    @keyframes itemExit { from { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } to { opacity: 0; transform: translate3d(12px, 0, 0) scale(0.98); } }

    /* --- NATIVE PRESS FEEDBACK --- */
    .btn-pressable { 
      transition: transform var(--motion-fast) var(--ease-standard), opacity var(--motion-fast) ease, background-color var(--motion-fast) ease, border-color var(--motion-fast) ease !important; 
      will-change: transform, opacity; 
    }
    .btn-pressable.is-pressed:not(:disabled) { transform: scale(0.96) !important; opacity: 0.94 !important; box-shadow: none !important; }
    .btn-pressable.fab-press.is-pressed:not(:disabled) { transform: scale(0.93) !important; }
    .btn-pressable.hold-pressed:not(:disabled) { transform: scale(0.95) !important; opacity: 0.94 !important; }

    /* --- DROPDOWN ARROW ROTATION --- */
    .dropdown-arrow { transition: transform var(--motion-normal) var(--ease-standard); }
    .dropdown-arrow.is-active { transform: rotate(180deg); }

    .custom-scrollbar::-webkit-scrollbar { width: 4px !important; display: block !important; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

    @keyframes blobFloat1 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(20px, -20px, 0) scale(1.05); } }
    @keyframes blobFloat2 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-20px, 20px, 0) scale(0.95); } }
    .blob-1 { animation: blobFloat1 12s ease-in-out infinite; }
    .blob-2 { animation: blobFloat2 15s ease-in-out infinite; }

    .cv-page-canvas { width: 794px; min-height: 1123px; box-sizing: border-box; background-color: #ffffff; text-transform: none !important; }
    #cv-print-container { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }

    /* --- PRINT PROTECTION: NO ANIMATION/TRANSFORM --- */
    body.is-printing { background-color: #ffffff !important; color: #000000 !important; overflow: hidden !important; }
    body.is-printing > *:not(#cv-print-container) { display: none !important; }
    body.is-printing #cv-print-container { display: block !important; position: static !important; width: 100% !important; visibility: visible !important; }

    @media print {
      @page { size: A4 portrait; margin: 0 !important; }
      *, *::before, *::after { 
          -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; 
          box-sizing: border-box !important; 
          animation: none !important; transition: none !important; transform: none !important; 
          opacity: 1 !important; visibility: visible !important;
      }
      html, body { width: 210mm !important; height: 297mm !important; margin: 0 !important; padding: 0 !important; background: #ffffff !important; color: #000000 !important; overflow: hidden !important; text-transform: none !important; }
      body > *:not(#cv-print-container) { display: none !important; }
      #cv-print-container { display: block !important; position: absolute !important; top: 0 !important; left: 0 !important; width: 210mm !important; height: 297mm !important; max-height: 297mm !important; margin: 0 !important; padding: 0 !important; background: #ffffff !important; color: #000000 !important; box-sizing: border-box !important; overflow: hidden !important; page-break-after: avoid !important; page-break-inside: avoid !important; page-break-before: avoid !important; z-index: 999999 !important; visibility: visible !important; text-transform: none !important; }
    }
  </style>
</head>
<body class="bg-[#08080e] text-zinc-100 antialiased selection:bg-indigo-500 selection:text-white overflow-x-hidden font-sans font-bold min-h-screen">

  <!-- UNIFIED ORIGIN-TO-ORIGIN MODAL OVERLAYS -->

      <div class="w-10 h-10 rounded-full bg-amber-500/15 text-amber-400 flex items-center justify-center mx-auto"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg></div>
      <div>

        <button type="button" onclick="confirmReset()" class="btn-pressable py-2 px-3 rounded-full bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase shadow-lg shadow-red-600/30">RESET</button>
      </div>
    </div>
  </div>

  <div id="cv-history-modal" class="modal-backdrop fixed inset-0 z-[110] bg-black/70 backdrop-blur-md hidden justify-center items-center px-4" onclick="closeModalCenter()">
    <div id="cv-history-box" class="modal-box bg-[#141424]/95 backdrop-blur-2xl border border-white/10 rounded-3xl w-[92vw] max-w-md shadow-2xl flex flex-col overflow-hidden max-h-[80vh] hide-scroll" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between p-4 border-b border-white/[0.08] bg-white/[0.03]">
         <div class="flex items-center gap-2"><svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg><h3 class="font-bold text-zinc-100 text-sm uppercase">CV HISTORY</h3></div>
         <button type="button" onclick="closeModalCenter()" class="btn-pressable fab-press text-zinc-400 hover:text-white p-1.5 rounded-full hover:bg-white/[0.08]"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>

    <div id="xy-box-dropdown" class="modal-box bg-[#141424]/95 backdrop-blur-2xl border border-white/10 rounded-3xl flex flex-col overflow-hidden shadow-2xl w-[90vw] max-w-[340px] hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between p-3.5 border-b border-white/[0.08] bg-white/[0.03]">
         <span id="global-dropdown-title" class="text-[13px] font-bold text-zinc-100 uppercase tracking-wider">SELECT</span>
         <button type="button" onclick="closeModalCenter()" class="btn-pressable fab-press p-1.5 rounded-full text-zinc-400 hover:text-white bg-white/[0.06]"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>

  <div id="cv-print-container"></div>

  <script>
    const STORAGE_KEY = 'techasar_cv_final_v29';
    const HISTORY_KEY = 'techasar_cv_history_v29';
    
    // TRANSITION STATE MACHINE
    let isTransitioning = false;
    let transitionToken = 0;
    
    // MODAL ORIGIN CONTROLLER STATE
    let activeModalOverlay = null;
    let activeModalBox = null;
    let alertCallback = null;
    let activeArrowNode = null;

    function normalizeCVData(data) {
        if (!data) return JSON.parse(JSON.stringify(defaultCVData));
        const normalized = JSON.parse(JSON.stringify(defaultCVData));
        function deepMerge(target, source) {
            for (const key of Object.keys(source)) {
                if (source[key] instanceof Object && !Array.isArray(source[key])) {
                    target[key] = deepMerge(target[key] || {}, source[key]);
                } else if (Array.isArray(source[key])) {
                    target[key] = [...source[key]];
                } else {
                    target[key] = source[key];
                }
            }
            return target;
        }
        return deepMerge(normalized, data);
    }

        touchStartY = e.changedTouches[0].screenY;

    document.addEventListener('touchend', e => {

        if (e.target.closest('input, textarea, select, button, .modal-backdrop, .dropdown-item')) return;
        
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;
        
        if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) goNextStep();

    // --- ACCURATE ORIGIN-BASED POPUP CONTROLLER ---
    function openModalCenter(overlayId, boxId, callerEl = null) {
        if(isTransitioning) return;
        clearAllPressStates();
        
        const overlay = document.getElementById(overlayId);
        const box = document.getElementById(boxId);
        if(!overlay || !box) return;

        if (overlayId === 'xy-modal-overlay') {
            ['xy-box-dropdown', 'xy-box-steps', 'xy-box-custom-input'].forEach(id => {
                const b = document.getElementById(id); if(b) b.classList.add('hidden');
            });
            box.classList.remove('hidden');
        }

        activeModalOverlay = overlay;
        activeModalBox = box;
        
        if (callerEl && callerEl.getBoundingClientRect) {
            const rect = callerEl.getBoundingClientRect();
            const centerX = rect.left + (rect.width / 2);
            const centerY = rect.top + (rect.height / 2);
            const deltaX = centerX - (window.innerWidth / 2);
            const deltaY = centerY - (window.innerHeight / 2);
            box.style.setProperty('--start-x', deltaX + 'px');
            box.style.setProperty('--start-y', deltaY + 'px');
        } else {
            box.style.setProperty('--start-x', '0px');
            box.style.setProperty('--start-y', '25px');
        }
        
        if (callerEl) {
            activeArrowNode = callerEl.querySelector('.dropdown-arrow');
            if(activeArrowNode) activeArrowNode.classList.add('is-active');
        }

        overlay.classList.remove('hidden');
        overlay.style.display = 'flex';

        overlay.classList.remove('modal-exit-backdrop');
        box.classList.remove('modal-exit-box');
        
        overlay.classList.add('modal-enter-backdrop');
        box.classList.add('modal-enter-box');
    }

    function closeModalCenter(callback) {
        if (!activeModalOverlay || !activeModalBox) {
            if (callback) callback();
            return;
        }

        const overlay = activeModalOverlay;
        const box = activeModalBox;

        if(activeArrowNode) {
            activeArrowNode.classList.remove('is-active');
            activeArrowNode = null;
        }

        overlay.classList.remove('modal-enter-backdrop');
        box.classList.remove('modal-enter-box');
        overlay.classList.add('modal-exit-backdrop');
        box.classList.add('modal-exit-box');

        activeModalOverlay = null;
        activeModalBox = null;

        setTimeout(() => {
            overlay.classList.remove('modal-exit-backdrop');
            box.classList.remove('modal-exit-box');
            overlay.style.display = 'none';
            overlay.classList.add('hidden');
            if (callback) callback();
        }, 280); 
    }

    // Step Selector (Long Press on Prev Button)
    let pressTimer; let isPressing = false; let didLongPress = false;
    
    function startPress(e) {
        if(currentPage === 1 || isTransitioning || activeModalOverlay) return;
        isPressing = true; didLongPress = false; 
        const btn = e.currentTarget;
        btn.classList.add('hold-pressed');
        
        pressTimer = setTimeout(() => { 
            if(isPressing) { 
                didLongPress = true; 
                btn.classList.remove('hold-pressed');
                btn.classList.remove('is-pressed');
                openStepSelector(btn); 
            } 
        }, 450);
    }
    
    function endPress(e) {
        isPressing = false; clearTimeout(pressTimer);
        const btn = e.currentTarget;
        if (btn) {
            btn.classList.remove('hold-pressed');
            btn.classList.remove('is-pressed');
        }
        if(!didLongPress && !isTransitioning && !activeModalOverlay) { goPrevStep(); }
    }
    
    function cancelPress(e) { 
        isPressing = false; clearTimeout(pressTimer); 
        if (e && e.currentTarget) {
            e.currentTarget.classList.remove('hold-pressed');
            e.currentTarget.classList.remove('is-pressed');
        }

    function jumpToStep(n) {

    function parseDateParts(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return { dd: '', mm: '', yyyy: '' };
      if (dateStr.includes('/')) { const p = dateStr.split('/'); return { dd: p[0] || '', mm: p[1] || '', yyyy: p[2] || '' }; } 
      else if (dateStr.includes('-')) { const p = dateStr.split('-'); if (p[0] && p[0].length === 4) return { dd: p[2] || '', mm: p[1] || '', yyyy: p[0] || '' }; else return { dd: p[0] || '', mm: p[1] || '', yyyy: p[2] || '' }; }
      return { dd: '', mm: '', yyyy: '' };
    }
    
    function onDateTripleInput(prefix, part, inputEl) { inputEl.value = inputEl.value.replace(/\D/g, ''); const val = inputEl.value; if (part === 'dd' && val.length === 2) { document.getElementById(`${prefix}-mm`)?.focus(); } else if (part === 'mm' && val.length === 2) { document.getElementById(`${prefix}-yyyy`)?.focus(); } updateCompositeDate(prefix); }
    function onDateTripleKeydown(prefix, part, e) { if (e.key === 'Backspace' && (!e.target.value || e.target.value.length === 0)) { if (part === 'yyyy') { document.getElementById(`${prefix}-mm`)?.focus(); } else if (part === 'mm') { document.getElementById(`${prefix}-dd`)?.focus(); } } }
    function updateCompositeDate(prefix) { const dd = document.getElementById(`${prefix}-dd`)?.value || ''; const mm = document.getElementById(`${prefix}-mm`)?.value || ''; const yyyy = document.getElementById(`${prefix}-yyyy`)?.value || ''; const formatted = (dd || mm || yyyy) ? `${dd}/${mm}/${yyyy}` : ''; if (prefix === 'dob') cvData.details.dob = formatted; else if (prefix === 'date') cvData.footer.date = formatted; saveState(); }
    function setTodayDate() { const now = new Date(); const dd = String(now.getDate()).padStart(2, '0'); const mm = String(now.getMonth() + 1).padStart(2, '0'); const yyyy = String(now.getFullYear()); document.getElementById('date-dd').value = dd; document.getElementById('date-mm').value = mm; document.getElementById('date-yyyy').value = yyyy; cvData.footer.date = `${dd}/${mm}/${yyyy}`; saveState(); }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cvData)); 
        if (currentCvId) {
            localStorage.setItem('techasar_current_cv_id', currentCvId);
            
            let history = [];
            try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) {}
            
            const idx = history.findIndex(h => h.id === currentCvId);
            const title = cvData.personal.name.trim().toUpperCase() || "UNTITLED CV";
            const historyItem = {
                id: currentCvId,
                name: title,
                data: cvData,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: Date.now()
            };
            
            if (idx >= 0) history[idx] = historyItem;
            else history.push(historyItem);
            
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }
      } catch(e) {}
    }

    function processPassportPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onerror = () => reject(new Error("Failed to read image"));
        reader.onload = (ev) => {
          const img = new Image(); img.onerror = () => reject(new Error("Invalid image"));
          img.onload = () => {
            const targetW = 413, targetH = 531; const targetAspect = targetW / targetH; const srcW = img.naturalWidth || img.width; const srcH = img.naturalHeight || img.height; let sx = 0, sy = 0, sw = srcW, sh = srcH;
            if (srcW / srcH > targetAspect) { sw = srcH * targetAspect; sx = (srcW - sw) / 2; } else { sh = srcW / targetAspect; sy = Math.max(0, (srcH - sh) * 0.22); }
            const canvas = document.createElement('canvas'); canvas.width = targetW; canvas.height = targetH; const ctx = canvas.getContext('2d'); if (!ctx) return resolve(ev.target.result);
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, targetW, targetH); ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function loadCVFromHistory(e, id) {
      if (e) e.stopPropagation(); 
      if (isTransitioning) return;
      try { 
          const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          const item = hist.find(h => h.id === id);
          if (item) { 
              cvData = normalizeCVData(JSON.parse(JSON.stringify(item.data))); 
              currentCvId = id; 
              localStorage.setItem('techasar_current_cv_id', currentCvId); 
              saveState(); 
              closeModalCenter(() => {
                  appStarted = true; 
                  currentPage = 1; 
                  activeView = 'editor'; 
                  renderAppLayer('enter-editor');
              });
          }
      } catch(e) {}
    }

    function printFromHistory(e, id) {
      if (e) e.stopPropagation(); 
      if (isTransitioning) return;
      
      const btn = e.currentTarget; 
      const ogHTML = btn.innerHTML; 
      btn.innerHTML = `<div class="w-3.5 h-3.5 border-[2px] border-white/30 border-t-white rounded-full animate-spin"></div>`;
      
      try { 
          const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          const item = hist.find(h => h.id === id);
          if (item){ 
              const tempOldData = cvData; 
              cvData = normalizeCVData(JSON.parse(JSON.stringify(item.data))); 
              
              requestAnimationFrame(() => { 
                  triggerPrint(() => { 
                      cvData = tempOldData; 
                      if (activeView === 'preview') renderAppLayer('none'); 
                  }); 
              }); 
          }
      } catch(err) { 
          showUIAlert("ERROR", "Failed to load CV for printing.", false); 
      }
      btn.innerHTML = ogHTML;
    }
    
    function deleteFromHistory(e, id) {
        if (e) e.stopPropagation(); 
        if(isTransitioning) return;
        
        showUIAlert("DELETE CV?", "ARE YOU SURE YOU WANT TO DELETE THIS CV FROM HISTORY?", true, (res) => { 
            if (res) { 
                try { 
                    let hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                    hist = hist.filter(h => h.id !== id);
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
                    
                    if (currentCvId === id) { 
                        cvData = JSON.parse(JSON.stringify(defaultCVData)); 
                        currentCvId = null; 
                        localStorage.removeItem('techasar_current_cv_id'); 
                        saveState(); 
                    } 
                    renderHistoryList(); 
                } catch(e) {} 
            } 
        }, e.currentTarget);
    }

            <button type="button" onclick="openPreview()" title="PREVIEW CV" class="btn-pressable fab-press w-12 h-12 rounded-full flex items-center justify-center bg-[#18182a]/95 border border-emerald-500/30 text-emerald-400 hover:text-emerald-300 shadow-xl shadow-emerald-500/20 backdrop-blur-xl"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg></button>
            
            <button type="button" onclick="goNextStep()" title="${currentPage === TOTAL_STEPS ? 'REVIEW CV' : 'NEXT STEP'}" class="btn-pressable fab-press w-12 h-12 rounded-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white shadow-xl shadow-indigo-600/40 backdrop-blur-xl">
              ${currentPage === TOTAL_STEPS ? '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12" /></svg>' : '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6" /></svg>'}
            </button>
          </div>
        </div>
      `;
    }

    function getPreviewViewHTML() {
      fitPreviewWidth();
      const scaledW = Math.round(794 * previewZoom); const scaledH = Math.round(1123 * previewZoom);
      return `
        <div class="h-14 px-4 flex items-center justify-between shrink-0 bg-transparent z-20">
          <button type="button" onclick="closePreview()" title="BACK TO EDIT" class="btn-pressable fab-press w-10 h-10 flex items-center justify-center rounded-full text-zinc-300 hover:text-white bg-[#141424]/80 border border-white/10 backdrop-blur-xl shadow-lg"><svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg></button>
          <div class="px-4 py-1.5 rounded-full bg-[#141424]/80 border border-white/10 backdrop-blur-xl shadow-lg"><span class="text-xs font-black text-zinc-200 tracking-wider">A4 PREVIEW</span></div>
          <button type="button" onclick="handleDirectPrint()" title="PRINT CV" class="btn-pressable fab-press w-10 h-10 flex items-center justify-center rounded-full text-emerald-400 bg-emerald-500/15 border border-emerald-500/30 backdrop-blur-xl shadow-lg"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg></button>
        </div>
        <div id="preview-viewport-container" class="flex-1 overflow-y-auto overflow-x-auto p-2 sm:p-6 pb-24 flex flex-col items-center relative hide-scroll" style="background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px), linear-gradient(to bottom, #090a10, #040407); background-size: 20px 20px, 100% 100%;">
          <div class="relative my-auto shrink-0 bg-white" style="width: ${scaledW}px; height: ${scaledH}px; min-height: ${scaledH}px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 15px 35px -5px rgba(0, 0, 0, 0.85);">
            <div style="width: 794px; min-height: 1123px; transform: scale(${previewZoom}); transform-origin: top left; position: absolute; top: 0; left: 0;">${getDocumentHTML('cv-screen-preview-node', false)}</div>
          </div>
        </div>
        <div class="absolute bottom-4 left-0 right-0 z-30 pointer-events-none flex justify-center items-center pb-[max(0px,env(safe-area-inset-bottom))]">
          <div class="pointer-events-auto flex items-center justify-between px-6 max-w-xs w-full">
            <button type="button" onclick="closePreview()" title="EDIT DETAILS" class="btn-pressable fab-press w-12 h-12 rounded-full flex items-center justify-center bg-[#141424]/90 border border-white/10 text-zinc-300 hover:text-white shadow-xl backdrop-blur-xl"><svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg></button>
            <button type="button" onclick="handleDirectPrint()" title="PRINT CV" class="btn-pressable fab-press w-14 h-14 rounded-full flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 text-white shadow-2xl shadow-emerald-600/40 backdrop-blur-xl"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg></button>
          </div>
        </div>
      `;
    }

    // STRICT LAYER NAVIGATION MANAGER
    function renderAppLayer(transitionType = 'none') {
      if (isTransitioning) return;
      
      const container = document.getElementById('main-view-container');
      if (!container) return;

      clearAllPressStates();

      const isTransition = transitionType !== 'none';
      let newHTML = '';
      if (!appStarted) newHTML = getWelcomeScreenHTML();
      else if (activeView === 'preview') newHTML = getPreviewViewHTML();
      else newHTML = getEditorViewHTML(isTransition);

      const oldLayer = container.lastElementChild;

      if (!isTransition || !oldLayer) {
         container.innerHTML = `<div class="app-layer w-full h-full flex flex-col absolute inset-0 z-10">${newHTML}</div>`;
         const newLayer = container.lastElementChild;
         requestAnimationFrame(() => { 
             newLayer.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el));
             const scrollArea = newLayer.querySelector('#editor-scroll-area');
             if(scrollArea && oldLayer && oldLayer.querySelector('#editor-scroll-area')) {
                 scrollArea.scrollTop = oldLayer.querySelector('#editor-scroll-area').scrollTop;
             }
         });
         return;
      }

      isTransitioning = true;
      const currentToken = ++transitionToken;

      const newLayer = document.createElement('div');
      newLayer.className = `app-layer w-full h-full flex flex-col absolute inset-0 z-10 layer-enter-${transitionType}`;
      newLayer.innerHTML = newHTML;
      container.appendChild(newLayer);
      
      if (oldLayer) {
          oldLayer.classList.add(`layer-exit-${transitionType}`);
          oldLayer.style.zIndex = '0';
      }

      requestAnimationFrame(() => {
          newLayer.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el));
          const scrollArea = newLayer.querySelector('#editor-scroll-area');
          if (scrollArea && transitionType.startsWith('nav-')) { scrollArea.scrollTop = 0; }
      });

      setTimeout(() => {
          if (currentToken === transitionToken && isTransitioning) {
              if (oldLayer && oldLayer.parentNode === container) { container.removeChild(oldLayer); }
              newLayer.className = 'app-layer w-full h-full flex flex-col absolute inset-0 z-10'; 
              isTransitioning = false;
          }
      }, 340); 
    }

    function goToHome() { 
        if(isTransitioning) return;
        appStarted = false; activeView = 'editor'; 
        renderAppLayer('exit-home'); 
    }

    function goNextStep() { 
        if (isTransitioning) return;
        if (currentPage < TOTAL_STEPS) { 
            currentPage++; renderAppLayer('nav-next'); 
        } else { 
            openPreview(); 
        } 
    }

    function goPrevStep() { 
        if (isTransitioning) return;
        if (currentPage > 1) { 
            currentPage--; renderAppLayer('nav-prev'); 
        } 
    }

    function openPreview() { 
        if(isTransitioning) return;
        activeView = 'preview'; renderAppLayer('enter-preview'); 
    }
    
    function closePreview() { 
        if(isTransitioning) return;
        activeView = 'editor'; renderAppLayer('exit-preview'); 
    }
    
    function handleDirectPrint() {
        if(isTransitioning) return;
        triggerPrint();
    }

    // Resize Debouncing
    let resizeTimer;
    function fitPreviewWidth() { const container = document.getElementById('preview-viewport-container'); const w = container ? container.clientWidth - 24 : window.innerWidth - 24; previewZoom = Number(Math.max(0.32, Math.min(1.0, w / 794)).toFixed(2)); }
    window.addEventListener('resize', () => { 
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (activeView === 'preview' && !isTransitioning) { fitPreviewWidth(); renderAppLayer('none'); }
        }, 150);
    });
  </script>
</body>
</html>
