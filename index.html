<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TECH ASAR CV BUILDER</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Algerian & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/algerian">

  <style>
    @font-face {
      font-family: 'Algerian';
      font-style: normal;
      font-weight: 400;
      src: local('Algerian'), url('https://fonts.cdnfonts.com/s/137771/vertopal.com_vertopal.com_ALGER.woff') format('woff');
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar,
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }

    .font-algerian {
      font-family: 'Algerian', 'Times New Roman', serif !important;
    }

    /* GLOBAL APP UI STYLES (Capital and Bold) */
    #app-root, #picker-modal, #app-toast {
      text-transform: uppercase;
    }
    #app-root input, #app-root textarea, #app-root select, #app-root button,
    #picker-modal input, #picker-modal button {
      font-weight: 700 !important;
      text-transform: uppercase;
    }
    #app-root input::placeholder, #app-root textarea::placeholder, #picker-modal input::placeholder {
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.7;
    }

    /* ULTRA-SMOOTH ANDROID-LIKE ANIMATIONS */
    @keyframes slideInRightSmooth {
      0% { opacity: 0; transform: translate3d(24px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes slideInLeftSmooth {
      0% { opacity: 0; transform: translate3d(-24px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    
    @keyframes popInOrigin {
      0% { opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.3); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes popOutOrigin {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.3); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .anim-next { animation: slideInRightSmooth 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .anim-prev { animation: slideInLeftSmooth 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .anim-pop-in-origin { animation: popInOrigin 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards; }
    .anim-pop-out-origin { animation: popOutOrigin 0.25s cubic-bezier(0.3, 0, 0.8, 0.2) forwards; }
    .anim-fade { animation: fadeIn 0.2s ease-out forwards; }

    .step-1-noscroll {
      height: calc(100dvh - 170px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    /* Print Setup */
    #cv-print-container { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0mm !important; }
      html, body {
        width: 210mm !important; height: 297mm !important; margin: 0 !important;
        padding: 0 !important; background: #ffffff !important; color: #000000 !important;
      }
      #app-root, .no-print, #picker-modal, #app-toast { display: none !important; }
      #cv-print-container {
        display: block !important; position: static !important;
        width: 210mm !important; height: 297mm !important;
        padding: 4mm !important; background: #ffffff !important;
      }
      #cv-print-container * {
        text-transform: none;
      }
    }
  </style>
</head>
<body class="bg-[#08080e] text-zinc-100 antialiased overflow-hidden font-sans select-none font-bold">

  <!-- MODERN APP TOAST NOTIFICATION (Replaces alert box) -->
  <div id="app-toast" class="fixed top-[-100%] left-1/2 -translate-x-1/2 z-[9999] transition-all duration-300 pointer-events-none flex items-center justify-center w-full px-4">
    <div class="bg-red-600/95 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-2xl font-bold text-xs tracking-wider border border-red-500 flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span id="app-toast-msg" class="truncate mt-0.5">MESSAGE</span>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-root" class="h-[100dvh] w-full flex flex-col relative overflow-hidden">
    <!-- Content Injected via JS -->
  </div>

  <!-- POPUP PICKER MODAL -->
  <div id="picker-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-5 pb-10">
    <div id="picker-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closePicker()"></div>
    <div id="picker-box" class="relative w-full max-w-sm bg-[#11111c] border border-zinc-700 rounded-3xl shadow-2xl flex flex-col max-h-[70vh] opacity-0 transition-all duration-300">
      <div class="px-5 py-4 border-b border-zinc-800 flex flex-col gap-3 shrink-0">
        <div class="flex justify-between items-center">
          <h3 id="picker-title" class="font-bold text-zinc-100 text-sm tracking-wide uppercase">Select Location</h3>
          <button onclick="closePicker()" class="p-2 rounded-full bg-zinc-800/80 text-zinc-300 active:scale-90 transition-all">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="relative">
          <input type="text" id="picker-search" oninput="filterPickerList(this.value)" placeholder="SEARCH OR TYPE CUSTOM..." class="w-full bg-[#181826] border border-zinc-600 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-400 font-bold" />
        </div>
      </div>
      <div id="picker-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Items Injected Here -->
      </div>
    </div>
  </div>

  <div id="cv-print-container"></div>

  <script>
    const HISTORY_KEY = 'techasar_cv_history_v4';
    
    // Comprehensive India States & UTs
    const indianStates = [
      "Andaman and Nicobar Islands", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", 
      "Dadra & Nagar Haveli and Daman & Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu and Kashmir", 
      "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "Madhya Pradesh", "Maharashtra", "Manipur", 
      "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", 
      "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"
    ];

    // All 75 UP Districts
    const upDistricts = [
      "Agra", "Aligarh", "Ambedkar Nagar", "Amethi", "Amroha", "Auraiya", "Ayodhya", "Azamgarh", "Baghpat", "Bahraich", 
      "Ballia", "Balrampur", "Banda", "Barabanki", "Bareilly", "Basti", "Bhadohi", "Bijnor", "Budaun", "Bulandshahr", 
      "Chandauli", "Chitrakoot", "Deoria", "Etah", "Etawah", "Farrukhabad", "Fatehpur", "Firozabad", "Gautam Buddha Nagar", 
      "Ghaziabad", "Ghazipur", "Gonda", "Gorakhpur", "Hamirpur", "Hapur", "Hardoi", "Hathras", "Jalaun", "Jaunpur", "Jhansi", 
      "Kannauj", "Kanpur Dehat", "Kanpur Nagar", "Kasganj", "Kaushambi", "Kheri", "Kushinagar", "Lalitpur", "Lucknow", 
      "Maharajganj", "Mahoba", "Mainpuri", "Mathura", "Mau", "Meerut", "Mirzapur", "Moradabad", "Muzaffarnagar", "Pilibhit", 
      "Pratapgarh", "Prayagraj", "Raebareli", "Rampur", "Saharanpur", "Sambhal", "Sant Kabir Nagar", "Shahjahanpur", "Shamli", 
      "Shravasti", "Siddharthnagar", "Sitapur", "Sonbhadra", "Sultanpur", "Unnao", "Varanasi"
    ];

    // Targeted sample Tehsils/Blocks. User can search/add custom for missing ones.
    const specificLocations = {
      "Uttar Pradesh": {
        "Pilibhit": { 
          "Puranpur": ["Puranpur Block", "Gajraula", "Madhotanda", "Sherpur"], 
          "Bisalpur": ["Bilsanda", "Barkhera"],
          "Pilibhit": ["Amariya", "Lalaurikhera", "Marauri"],
          "Kalinagar": ["Kalinagar Block"]
        },
        "Bareilly": { 
          "Baheri": ["Baheri Block", "Richha"], 
          "Nawabganj": ["Bhadpura"],
          "Bareilly": ["Bhojipura", "Bithiri Chainpur", "Kyara", "Fatehganj"]
        }
      }
    };

    function getDistricts(state) {
      if (state === "Uttar Pradesh") return upDistricts;
      return []; 
    }
    function getTehsils(state, dist) {
      if (specificLocations[state] && specificLocations[state][dist]) return Object.keys(specificLocations[state][dist]);
      return [];
    }
    function getBlocks(state, dist, tehsil) {
      if (specificLocations[state] && specificLocations[state][dist] && specificLocations[state][dist][tehsil]) {
        return specificLocations[state][dist][tehsil];
      }
      return [];
    }

    const defaultCVData = {
      id: null, lastModified: null, font: "Times New Roman",
      personal: { photo: "", name: "", villagePost: "", state: "", district: "", tehsil: "", block: "", mobile: "", email: "", headerStyle: "labeled" },
      objective: "To contribute to the overall growth of your organization by applying my skills, knowledge, honesty & hard-working.",
      academic: ["High School Passed from U.P Board in 2020", "Intermediate Passed from U.P Board. in 2022"],
      other: ["Course On Computer Concepts Diploma (CCC)"],
      experience: ["Fresher"],
      details: { dob: "", father: "", gender: "Male", marital: "Unmarried", nationality: "Indian", languages: "Hindi & English", hobbies: "Reading, Editing" },
      declaration: "I hereby declare that all the information mentioned above is true to the best of my knowledge.",
      footer: { date: "", place: "", signName: "" }
    };

    let appState = { view: 'home', cvData: null, currentPage: 1, animDirection: 'next', previewZoom: 0.46, pickerType: '', pickerOptions: [] };

    // Custom Toast function
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('app-toast');
      document.getElementById('app-toast-msg').innerText = msg;
      toast.style.top = '2rem';
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.style.top = '-100%'; }, 2500);
    }

    function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; } }
    
    function saveSilently() {
      if(!appState.cvData) return;
      appState.cvData.lastModified = Date.now();
      const history = getHistory();
      const idx = history.findIndex(x => x.id === appState.cvData.id);
      if (idx >= 0) history[idx] = appState.cvData; else history.push(appState.cvData);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderPrintNode();
    }

    function saveAndRender() { saveSilently(); renderApp(); }
    function updatePers(k, v) { appState.cvData.personal[k] = v; saveSilently(); }
    function updateDet(k, v) { appState.cvData.details[k] = v; saveSilently(); }
    function updateArr(key, idx, val) { appState.cvData[key][idx] = val; saveSilently(); }

    function setView(view, anim = 'fade') {
      appState.view = view;
      if(view === 'editor' && !appState.cvData) {
        appState.cvData = JSON.parse(JSON.stringify(defaultCVData));
        appState.cvData.id = 'cv_' + Date.now();
        appState.currentPage = 1;
      }
      renderApp();
    }

    function editCV(id) {
      const history = getHistory();
      const cv = history.find(x => x.id === id);
      if(cv) { appState.cvData = JSON.parse(JSON.stringify(cv)); appState.currentPage = 1; setView('editor'); }
    }

    function resetCurrentCV() {
      const currentId = appState.cvData.id;
      appState.cvData = JSON.parse(JSON.stringify(defaultCVData));
      appState.cvData.id = currentId;
      saveAndRender();
      showToast("CV RESET TO DEFAULT");
    }

    function deleteFromHistory(id) {
      let history = getHistory(); history = history.filter(x => x.id !== id);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); renderApp();
      showToast("CV DELETED");
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if(appState.view === 'home') root.innerHTML = getHomeHTML();
      else if(appState.view === 'history') root.innerHTML = getHistoryHTML();
      else if(appState.view === 'editor') root.innerHTML = getEditorHTML();
      else if(appState.view === 'preview') root.innerHTML = getPreviewHTML();
      if(appState.view === 'editor' || appState.view === 'preview') renderPrintNode();
    }

    function getHomeHTML() {
      return `
        <div class="flex-1 flex flex-col items-center justify-center p-6 bg-[#08080e] anim-fade relative font-bold">
          <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/20 to-transparent pointer-events-none"></div>
          <div class="w-24 h-24 bg-indigo-500 rounded-full blur-[80px] absolute top-1/3 opacity-30 pointer-events-none"></div>
          <div class="relative z-10 w-full max-w-sm space-y-10">
            <div class="text-center space-y-2">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white shadow-xl shadow-indigo-500/20 mx-auto mb-6">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
              </div>
              <h1 class="text-3xl font-black text-white tracking-tight uppercase">TECH ASAR CV</h1>
              <p class="text-sm text-zinc-400 uppercase font-bold">PROFESSIONAL CV BUILDER</p>
            </div>
            <div class="space-y-4">
              <button onclick="appState.cvData=null; setView('editor')" class="w-full py-4 rounded-full bg-indigo-600 text-white font-bold text-lg shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 active:scale-95 transition-all flex items-center justify-center gap-2 uppercase">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                CREATE NEW CV
              </button>
              <button onclick="setView('history')" class="w-full py-4 rounded-full bg-[#181826] border border-zinc-700 text-white font-bold text-lg shadow-lg hover:bg-zinc-800 active:scale-95 transition-all flex items-center justify-center gap-2 uppercase">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                CV HISTORY
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function getHistoryHTML() {
      const history = getHistory();
      let listHTML = `<div class="text-center text-zinc-500 mt-10 text-sm font-bold uppercase">NO CVS FOUND. CREATE ONE!</div>`;
      if(history.length > 0) {
        listHTML = history.sort((a,b) => b.lastModified - a.lastModified).map(cv => {
          const date = new Date(cv.lastModified).toLocaleDateString('en-GB');
          const name = cv.personal.name || "UNTITLED CV";
          return `
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-4 flex items-center justify-between mb-3 shadow-sm">
              <div class="flex-1 min-w-0 pr-3">
                <h3 class="font-bold text-zinc-100 truncate uppercase">${name}</h3>
                <p class="text-xs text-zinc-500 mt-0.5 font-bold">${date}</p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="editCV('${cv.id}')" class="w-10 h-10 rounded-full bg-zinc-800/80 flex items-center justify-center text-indigo-400 active:scale-90 transition-all border border-zinc-700">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button onclick="appState.cvData = ${JSON.stringify(cv).replace(/"/g, '&quot;')}; renderPrintNode(); setTimeout(()=>window.print(),100);" class="w-10 h-10 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400 active:scale-90 transition-all border border-emerald-500/20">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
                </button>
                <button onclick="deleteFromHistory('${cv.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-red-400 active:scale-90 transition-all ml-1">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      return `
        <div class="flex-1 flex flex-col bg-[#08080e] anim-next">
          <header class="h-16 px-4 flex items-center justify-between z-30 shrink-0">
            <button onclick="setView('home')" class="px-4 py-2 flex items-center gap-2 bg-[#181826]/80 backdrop-blur-md rounded-full text-zinc-300 border border-zinc-700/60 active:scale-90 shadow-lg font-bold text-xs uppercase">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              BACK
            </button>
            <div class="px-5 py-2 bg-[#181826]/80 backdrop-blur-md rounded-full text-xs font-bold text-white border border-zinc-700/60 shadow-lg uppercase">
              CV HISTORY
            </div>
            <div class="w-20"></div>
          </header>
          <div class="flex-1 overflow-y-auto px-4 pb-10 pt-2">
            ${listHTML}
          </div>
        </div>
      `;
    }

    function getEditorHTML() {
      const page = appState.currentPage;
      const animClass = appState.animDirection === 'next' ? 'anim-next' : 'anim-prev';
      
      let stepContent = '';
      if(page === 1) stepContent = getStep1HTML();
      else if(page === 2) stepContent = getStepTextarea('objective', 'CAREER OBJECTIVE');
      else if(page === 3) stepContent = getStepArray('academic', 'ACADEMIC QUALIFICATION');
      else if(page === 4) stepContent = getStepArray('other', 'OTHER QUALIFICATION');
      else if(page === 5) stepContent = getStepArray('experience', 'WORKING EXPERIENCE');
      else if(page === 6) stepContent = getStep6HTML();
      else if(page === 7) stepContent = getStep7HTML();
      else if(page === 8) stepContent = getStep8HTML();

      return `
        <div class="flex-1 flex flex-col bg-[#08080e] relative">
          
          <!-- PILL SHAPE HEADER -->
          <header class="absolute top-4 left-4 right-4 flex items-center justify-between z-30 pointer-events-none">
            <button onclick="appState.cvData=null; setView('home')" class="pointer-events-auto px-4 py-2 flex items-center gap-1.5 bg-[#181826]/90 backdrop-blur-md rounded-full text-zinc-300 border border-zinc-700/60 active:scale-90 shadow-xl text-[11px] font-extrabold uppercase">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              BACK
            </button>
            <div class="pointer-events-auto px-5 py-2 bg-[#181826]/90 backdrop-blur-md rounded-full text-[11px] font-extrabold text-white tracking-widest border border-zinc-700/60 shadow-xl uppercase">
              STEP ${page}/8
            </div>
            <button onclick="resetCurrentCV()" class="pointer-events-auto px-4 py-2 flex items-center gap-1.5 bg-[#181826]/90 backdrop-blur-md rounded-full text-red-400 border border-zinc-700/60 active:scale-90 shadow-xl text-[11px] font-extrabold uppercase">
              RESET
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>
            </button>
          </header>

          <!-- IMPORTANT: Increased bottom padding (pb-36) to prevent bottom buttons hiding content -->
          <div class="flex-1 overflow-y-auto px-4 pt-20 pb-36">
            <div class="${animClass} ${page === 1 ? 'step-1-noscroll' : ''}">
              ${stepContent}
            </div>
          </div>

          <!-- IMPORTANT: Moved buttons up (bottom-10) to clear phone navigation bars -->
          <div class="absolute bottom-10 left-4 right-4 flex items-center justify-between gap-3 z-30 pointer-events-none">
            <button onclick="goPrev()" class="pointer-events-auto flex items-center gap-1.5 px-4 py-3.5 rounded-full bg-[#181826]/95 backdrop-blur-md border border-zinc-700 shadow-2xl text-zinc-200 text-xs font-bold active:scale-95 uppercase ${page === 1 ? 'opacity-0 pointer-events-none' : ''}">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>

    function openLocationPicker(e, type) {
      const p = appState.cvData.personal;
      let options = [];

      if(type === 'state') options = indianStates;
      else if (type === 'district') {
        if(!p.state) return showToast("PLEASE SELECT A STATE FIRST!");
        options = getDistricts(p.state);
      } else if (type === 'tehsil') {
        if(!p.district) return showToast("PLEASE SELECT A DISTRICT FIRST!");
        options = getTehsils(p.state, p.district);
      } else if (type === 'block') {
        if(!p.tehsil) return showToast("PLEASE SELECT A TEHSIL FIRST!");
        options = getBlocks(p.state, p.district, p.tehsil);
      }

      appState.pickerType = type;
      appState.pickerOptions = options;
      
      document.getElementById('picker-title').innerText = `SELECT ${type}`;
      document.getElementById('picker-search').value = '';
      
      renderPickerList(options);
      
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const modal = document.getElementById('picker-modal');
      const backdrop = document.getElementById('picker-backdrop');
      const box = document.getElementById('picker-box');
      
      box.style.setProperty('--tx', `${clickX - centerX}px`);
      box.style.setProperty('--ty', `${clickY - centerY}px`);
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      void modal.offsetWidth; 
      
      backdrop.classList.add('opacity-100');
      box.classList.remove('anim-pop-out-origin');
      box.classList.add('anim-pop-in-origin');
    }

    function renderPickerList(options, searchStr = '') {
      const listDiv = document.getElementById('picker-list');
      
      let html = options.map(opt => `
        <button onclick="selectLocationOption('${opt.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3.5 rounded-xl hover:bg-[#181826] active:bg-zinc-800 text-sm text-zinc-200 active:scale-[0.98] transition-all font-bold uppercase tracking-wide">
          ${opt}
        </button>
      `).join('');

      if (searchStr.trim() !== '') {
        const exactMatch = options.some(o => o.toLowerCase() === searchStr.toLowerCase());
        if (!exactMatch) {
          html = `
            <button onclick="selectLocationOption('${searchStr.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3.5 rounded-xl bg-indigo-600 border border-indigo-500 text-sm text-white active:scale-[0.98] transition-all mb-2 flex items-center gap-2 font-bold uppercase shadow-lg">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
              USE "${searchStr}"
            </button>
          ` + html;
        }
      }

      if(!html) html = `<div class="text-zinc-500 text-xs text-center py-6 font-bold uppercase tracking-widest">NOT FOUND.<br/>TYPE ABOVE TO ADD CUSTOM.</div>`;
      listDiv.innerHTML = html;
    }

    function filterPickerList(val) {
      const q = val.toLowerCase();
      const filtered = appState.pickerOptions.filter(o => o.toLowerCase().includes(q));
      renderPickerList(filtered, val);
    }

    function selectLocationOption(val) {
      const p = appState.cvData.personal;
      const type = appState.pickerType;
      p[type] = val;
      if(type === 'state') { p.district=''; p.tehsil=''; p.block=''; }
      if(type === 'district') { p.tehsil=''; p.block=''; }
      if(type === 'tehsil') { p.block=''; }
      saveSilently();
      closePicker(true);
    }

    function closePicker(refresh = false) {
      const backdrop = document.getElementById('picker-backdrop');
      const box = document.getElementById('picker-box');
      box.classList.remove('anim-pop-in-origin');
      box.classList.add('anim-pop-out-origin');
      backdrop.classList.remove('opacity-100');
      setTimeout(() => {
        const modal = document.getElementById('picker-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        box.classList.remove('anim-pop-out-origin');
        if(refresh) renderApp();
      }, 250);
    }

    function goNext() {
      if(appState.currentPage < 8) { appState.animDirection = 'next'; appState.currentPage++; renderApp(); }
      else { appState.animDirection = 'pop-in'; setView('preview'); }
    }
    function goPrev() {
      if(appState.currentPage > 1) { appState.animDirection = 'prev'; appState.currentPage--; renderApp(); }
    }

    function onPhotoSelected(e) {
      const file = e.target.files && e.target.files[0];

      const reader = new FileReader();
      reader.onload = (ev) => { appState.cvData.personal.photo = ev.target.result; saveAndRender(); };
      reader.readAsDataURL(file);
    }

            <button onclick="handleDirectPrint()" class="pointer-events-auto flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-emerald-600/95 backdrop-blur-md text-white text-[11px] font-extrabold shadow-xl active:scale-95 uppercase tracking-wide border border-emerald-500">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> PRINT
            </button>
          </header>
          <div id="preview-viewport" class="flex-1 overflow-auto p-4 pt-24 pb-10 flex flex-col items-center">
             <div class="relative bg-white shadow-2xl transition-all" style="width:${scaledW}px; height:${scaledH}px; min-height:${scaledH}px;">
                <div style="width:794px; min-height:1123px; transform: scale(${appState.previewZoom}); transform-origin: top left; position: absolute; top:0; left:0;">
                  ${getCVDocumentHTML('cv-screen-preview', false)}
                </div>
             </div>
          </div>
        </div>
      `;
    }

    function renderPrintNode() {
      if(!appState.cvData) return;
      const c = document.getElementById('cv-print-container');
      if(c) c.innerHTML = getCVDocumentHTML('cv-actual-print', true);
    }
    function handleDirectPrint() {
      renderPrintNode();
      setTimeout(() => window.print(), 100);
    }

    // PDF GENERATOR - "BLOCK" PROMINENTLY LISTED AFTER "TEHSIL"
    function getCVDocumentHTML(id, isPrintMode) {
      const cv = appState.cvData;
      if(!cv) return '';
      const p = cv.personal;
      const d = cv.details;
      const f = cv.footer;
      const font = cv.font === 'Times New Roman' ? '"Times New Roman", Times, serif' : cv.font;

      // Contact Data Setup
      const contactList = [
        { label: 'Name', val: p.name, bold: true, upper: true },
        { label: 'Address', val: p.villagePost },
        { label: 'Tehsil', val: p.tehsil },
        { label: 'Block', val: p.block }, 
        { label: 'District', val: p.district },
        { label: 'State', val: p.state },
        { label: 'Mobile No.', val: p.mobile },
        { label: 'Email Id', val: p.email }
      ].filter(x => x.val && x.val.trim());

      const contactRowsHTML = contactList.map((item, idx) => `
        <tr>
          <td style="font-weight:bold; font-size:${idx === 0 ? '12pt' : '11pt'}; vertical-align:top; padding:1.5px 0; color:#000; width:80px; text-transform:none;">${item.label}</td>
          <td style="font-weight:bold; font-size:${idx === 0 ? '12pt' : '11pt'}; text-align:center; vertical-align:top; padding:1.5px 0; color:#000; width:15px;">:</td>
          <td style="font-weight:${idx === 0 ? 'bold' : 'normal'}; font-size:${idx === 0 ? '12pt' : '11pt'}; text-transform:${item.upper ? 'uppercase' : 'none'}; vertical-align:top; padding:1.5px 0; color:#000;">${item.val}</td>
        </tr>
      `).join('');

      const personalDetailsHTML = [
        { l: 'Name', v: p.name, upper: true, bold: true },
        { l: 'Date of Birth', v: d.dob },
        { l: "Father's Name", v: d.father },
        { l: 'Gender', v: d.gender },
        { l: 'Marital Status', v: d.marital },
        { l: 'Nationality', v: d.nationality },
        { l: 'Language Known', v: d.languages },
        { l: 'Hobbies', v: d.hobbies }
      ].map(item => `
        <tr>
          <td style="padding:2px 0; vertical-align:top; color:#000; width:140px; font-weight:normal; text-transform:none;">${item.l}</td>
          <td style="padding:2px 0; text-align:center; font-weight:bold; vertical-align:top; color:#000; width:18px;">:</td>
          <td style="padding:2px 0; font-weight:${item.bold ? 'bold' : 'normal'}; text-transform:${item.upper ? 'uppercase' : 'none'}; vertical-align:top; color:#000;">${item.v || ''}</td>
        </tr>
      `).join('');

      const genList = (arr) => (arr||[]).filter(x => x.trim()).map(x => `<li style="padding-left:4px; line-height:1.35; color:#000; font-weight:normal; text-transform:none;">${x}</li>`).join('');
      
      const academicHTML = genList(cv.academic);
      const otherHTML = genList(cv.other);
      const expHTML = genList(cv.experience);

      const photoBoxHTML = p.photo ? 
        `<img src="${p.photo}" style="width:96px !important; height:124px !important; object-fit:cover !important; display:block !important; margin:0 auto;" />` : 
        `<div style="width:96px; height:124px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px dashed #71717a;"><span style="font-size:7.5pt; font-weight:bold; color:#000;">PHOTO</span></div>`;

      return `
        <div id="${id}" style="width:${isPrintMode ? '100%' : '794px'}; min-height:${isPrintMode ? '288mm' : '1123px'}; background-color:#ffffff; color:#000; padding:${isPrintMode ? '4mm' : '6mm'}; font-family:${font}; box-sizing:border-box; font-weight:normal;">
          <div style="width:100%; min-height:${isPrintMode ? '282mm' : '1085px'}; border:1.5px solid #000; padding:2.5px; box-sizing:border-box;">
            <div style="width:100%; min-height:calc(${isPrintMode ? '282mm' : '1085px'} - 7px); border:2.5px solid #000; padding:6mm 8mm; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between;">
              
              <div>
                <h1 class="font-algerian" style="text-align:center; font-size:22pt; font-weight:bold; text-decoration:underline; margin-bottom:8px; color:#000; text-transform:uppercase;">CURRICULUM VITAE</h1>
                <table style="width:100%; table-layout:fixed; border-collapse:collapse;">
                  <tr>
                    <td style="vertical-align:top; width:calc(100% - 116px);">
                      <table style="width:100%; font-size:11pt; color:#000;">${contactRowsHTML}</table>
                    </td>
                    <td style="width:110px; vertical-align:top; text-align:right;">
                      <div style="width:96px; height:124px; border:1.5px solid #000; overflow:hidden; margin-left:auto;">${photoBoxHTML}</div>
                    </td>
                  </tr>
                </table>
                <div style="width:100%; height:4px; border-top:1.2px solid #000; border-bottom:1.2px solid #000; margin:6px 0;"></div>
              </div>

              <div style="display:flex; flex-direction:column; flex:1; justify-content:space-evenly; margin:4px 0; gap:8px; font-size:11pt; color:#000;">
                ${cv.objective ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Carrier Objective:-</h2><ul style="list-style-type:disc; margin-left:24px;"><li style="padding-left:4px; text-align:justify; font-weight:normal; text-transform:none;">${cv.objective}</li></ul></div>` : ''}
                ${academicHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Academic Qualification:-</h2><ul style="list-style-type:disc; margin-left:24px;">${academicHTML}</ul></div>` : ''}
                ${otherHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Other Qualification:-</h2><ul style="list-style-type:disc; margin-left:24px;">${otherHTML}</ul></div>` : ''}
                ${expHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Working Experience:-</h2><ul style="list-style-type:disc; margin-left:24px;">${expHTML}</ul></div>` : ''}
                
                <div>
                  <h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Personal Detail:-</h2>
                  <table style="width:100%; font-size:11pt; margin-left:14px; color:#000;">${personalDetailsHTML}</table>
                </div>

                ${cv.declaration ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Declaration:-</h2><p style="text-align:justify; font-weight:normal; text-transform:none;">${cv.declaration}</p></div>` : ''}
              </div>

              <div style="padding-top:10px;">
                <table style="width:100%; font-size:11.5pt; font-weight:bold; color:#000;">
                  <tr>
                    <td style="vertical-align:bottom; text-transform:none;">Date: ${f.date}<br/>Place: ${f.place}</td>
                    <td style="vertical-align:bottom; text-align:right; text-transform:uppercase;">( ${f.signName || p.name} )</td>
                  </tr>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if(!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => setView('home'));
  </script>
</body>
</html>
