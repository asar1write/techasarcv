  <style>
    @font-face {
      font-family: 'Algerian';
      font-style: normal;
      font-weight: 400;
      src: local('Algerian'), url('https://fonts.cdnfonts.com/s/137771/vertopal.com_vertopal.com_ALGER.woff') format('woff');
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. HIDE ALL SCROLLBARS GLOBALLY */
    * {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar,
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }

    .font-algerian {
      font-family: 'Algerian', 'Times New Roman', serif !important;
    }

    /* 2. ULTRA-SMOOTH HARDWARE-ACCELERATED TRANSITIONS */
    @keyframes slideInRightSmooth {
      0% {
        opacity: 0;
        transform: translate3d(24px, 0, 0) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes slideInLeftSmooth {
      0% {
        opacity: 0;
        transform: translate3d(-24px, 0, 0) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes popInSmooth {
      0% {
        opacity: 0;
        transform: translate3d(0, 16px, 0) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .anim-next {
      animation: slideInRightSmooth 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    .anim-prev {
      animation: slideInLeftSmooth 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    .anim-pop {
      animation: popInSmooth 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    /* Standard A4 Screen Canvas */
    .cv-page-canvas {
      width: 794px;
      min-height: 1123px;
      box-sizing: border-box;
      background-color: #ffffff;
    }

    #cv-print-container {
      display: none;
    }

    /* 3. ROCK-SOLID PRINT ENGINE: 100% PRECISE A4 PORTRAIT */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0mm !important;
      }
      *, *::before, *::after {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        box-sizing: border-box !important;
      }
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
      }
      #app-screen-workspace,
      header,
      nav,
      button,
      .no-print {
        display: none !important;
      }
      #cv-print-container {
        display: block !important;
        position: static !important;
        width: 210mm !important;
        height: 297mm !important;
        min-height: 297mm !important;
        max-height: 297mm !important;
        margin: 0 auto !important;
        padding: 4mm !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        page-break-before: avoid !important;
        z-index: 999999 !important;
        visibility: visible !important;
      }
      #cv-print-container * {
        visibility: visible !important;
      }
    }
  </style>
</head>

    function processPassportPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Failed to read image"));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image"));
          img.onload = () => {
            const targetW = 413, targetH = 531;
            const targetAspect = targetW / targetH;
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            let sx = 0, sy = 0, sw = srcW, sh = srcH;
            if (srcW / srcH > targetAspect) {
              sw = srcH * targetAspect;
              sx = (srcW - sw) / 2;
            } else {
              sh = srcW / targetAspect;
              sy = Math.max(0, (srcH - sh) * 0.22);
            }
            const canvas = document.createElement('canvas');
            canvas.width = targetW; canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return resolve(ev.target.result);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, targetW, targetH);
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

      const personalDetails = [

        { l: 'Date of Birth', v: d.dob },
        { l: "Father's Name", v: d.father },

        { l: 'Marital Status', v: d.marital },
        { l: 'Nationality', v: d.nationality },

        { l: 'Hobbies', v: d.hobbies }

      const personalDetailsHTML = personalDetails.map(item => `

          <td style="padding:2px 0; text-align:center; font-weight:bold; vertical-align:top; color:#000; width:18px;">:</td>

      const expHTML = (cvData.experience || []).filter(x => x && x.trim()).map(x => `

      const photoBoxHTML = p.photo ? `

            <span style="font-size:6.5pt; color:#71717a;">35 × 45 mm</span>
          </div>
        </div>
      `;

      const outerWidth = isPrintMode ? '100%' : '794px';
      const outerMinH = isPrintMode ? '288mm' : '1123px';
      const innerMinH = isPrintMode ? '282mm' : '1085px';

      return `
        <div id="${id}" style="width:${outerWidth}; min-height:${outerMinH}; box-sizing:border-box; background-color:#ffffff; color:#000000; padding:${isPrintMode ? '4mm' : '6mm'}; font-family:${font};">
          <!-- Outer Border -->
          <div style="width:100%; min-height:${innerMinH}; border:1.5px solid #000000; padding:2.5px; box-sizing:border-box; background-color:#ffffff;">

              <!-- Top Header Section -->

                <table style="width:100%; table-layout:fixed; border-collapse:collapse; border:none; margin:0; padding:0;">

                <!-- Personal Detail Table -->

                  oninput="cvData.details.hobbies = this.value; saveState();"

                  class="w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 outline-none focus:border-indigo-500"
                />
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 7) {
        stepContentHTML = `
          <div class="space-y-3.5">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-2.5">
              <label class="block text-xs font-bold text-zinc-200">Declaration Statement</label>
              <textarea
                rows="3"
                oninput="cvData.declaration = this.value; saveState();"
                class="w-full min-h-[90px] bg-[#181826] border border-zinc-700/80 rounded-xl p-3 text-[15px] sm:text-sm text-zinc-100 outline-none focus:border-indigo-500 leading-relaxed"
              >${escapeHtml(cvData.declaration || '')}</textarea>
            </div>
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-3">
              <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-300">Sign-Off & Details</h3>
              <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Date</label>
                <div class="flex items-center gap-2">
                  <input
                    type="text"
                    id="input-footer-date"
                    value="${escapeHtml(cvData.footer.date || '')}"
                    oninput="cvData.footer.date = this.value; saveState();"
                    placeholder="DD/MM/YYYY"
                    class="flex-1 bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 outline-none focus:border-indigo-500"
                  />
                  <button
                    type="button"
                    onclick="setTodayFooterDate()"
                    class="px-3.5 py-2.5 rounded-xl bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-xs font-semibold active:scale-95 shrink-0"
                  >
                    Today
                  </button>
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Place</label>
                <input
                  type="text"
                  value="${escapeHtml(cvData.footer.place || '')}"
                  oninput="cvData.footer.place = this.value; saveState();"
                  placeholder="e.g. Puranpur"
                  class="w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 outline-none focus:border-indigo-500"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Signature Name</label>
                <input
                  type="text"
                  value="${escapeHtml(cvData.footer.signName || '')}"
                  oninput="cvData.footer.signName = this.value; saveState();"
                  placeholder="e.g. MO ASAR"
                  class="w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-2.5 text-[15px] sm:text-sm text-zinc-100 outline-none focus:border-indigo-500"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Document Font</label>
                <select
                  onchange="cvData.font = this.value; saveState();"
                  class="w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3 py-2.5 text-xs text-zinc-100 outline-none focus:border-indigo-500"
                >
                  <option value="Times New Roman" ${cvData.font === 'Times New Roman' ? 'selected' : ''}>Times New Roman (Cyber Cafe Standard)</option>
                  <option value="Arial" ${cvData.font === 'Arial' ? 'selected' : ''}>Arial (Modern Clean)</option>
                  <option value="Calibri" ${cvData.font === 'Calibri' ? 'selected' : ''}>Calibri (Office)</option>
                  <option value="Algerian" ${cvData.font === 'Algerian' ? 'selected' : ''}>Algerian (Heading Style)</option>
                </select>
              </div>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden">
          <!-- Clean Inline Section Badge (No 1, 2, 3 buttons, zero wasted space) -->
          <div class="px-4 py-2.5 bg-[#0a0a12] border-b border-zinc-800/60 flex items-center justify-between shrink-0">
            <span class="text-xs font-bold text-zinc-200 tracking-tight">
              Step ${currentPage}/7: <span class="text-indigo-400">${stepName}</span>
            </span>
            <span class="text-[11px] font-semibold text-zinc-400">${progress}%</span>
          </div>

          <!-- Form Scroll Area -->
          <div class="flex-1 overflow-y-auto px-3.5 py-3 pb-28">
            <div class="${animClass}">
              ${stepContentHTML}
            </div>
          </div>

          <!-- Bottom Navigation -->
          <div class="fixed bottom-0 left-0 right-0 z-30 bg-[#0c0c16]/95 backdrop-blur-md border-t border-zinc-800 px-4 py-2.5 flex items-center justify-between gap-2.5 pb-[max(10px,env(safe-area-inset-bottom))]">
            <button
              type="button"
              ${currentPage === 1 ? 'disabled' : ''}
              onclick="goPrevStep()"
              class="flex items-center gap-1 px-3.5 py-2 rounded-xl bg-[#181826] disabled:opacity-30 text-zinc-300 text-xs font-semibold border border-zinc-700/60 active:scale-95 shrink-0"
            >
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg>
              <span>Prev</span>
            </button>

            <button
              type="button"
              onclick="openPreview()"
              class="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700/80 text-xs font-bold active:scale-95 shadow-sm"
            >
              <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              <span>Preview CV</span>
            </button>

            <button
              type="button"
              onclick="goNextStep()"
              class="flex items-center gap-1 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold active:scale-95 shadow-md shadow-indigo-600/30 shrink-0"
            >
              <span>${currentPage === 7 ? 'Review' : 'Next'}</span>
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6" /></svg>
            </button>
          </div>
        </div>
      `;
    }

    function renderPreviewView(container) {
      const scaledW = Math.round(794 * previewZoom);
      const scaledH = Math.round(1123 * previewZoom);

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden bg-[#06060a] anim-pop">
          <!-- Top Bar -->
          <div class="bg-[#0e0e18] border-b border-zinc-800 px-3 py-2 flex items-center justify-between gap-2 z-20 shrink-0">
            <button
              type="button"
              onclick="closePreview()"
              class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-zinc-800 text-zinc-100 text-xs font-semibold border border-zinc-700 active:scale-95"
            >
              <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg>
              <span>Edit</span>
            </button>

            <div class="flex items-center gap-1 bg-[#141422] p-1 rounded-lg border border-zinc-800">
              <button type="button" onclick="zoomPreview(-0.1)" class="w-6 h-6 flex items-center justify-center text-zinc-400 active:scale-90">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg>
              </button>
              <span class="text-[11px] font-semibold text-zinc-300 min-w-9 text-center tabular-nums">
                ${Math.round(previewZoom * 100)}%
              </span>
              <button type="button" onclick="zoomPreview(0.1)" class="w-6 h-6 flex items-center justify-center text-zinc-400 active:scale-90">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg>
              </button>
              <button type="button" onclick="fitPreviewWidth()" class="px-2 py-0.5 rounded text-[10px] font-bold text-indigo-400 bg-indigo-500/10 active:scale-90">
                Fit
              </button>
            </div>

            <button
              type="button"
              onclick="handleDirectPrint()"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-100 text-xs font-semibold border border-zinc-700 active:scale-95 shadow-sm"
            >
              <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
              <span>Print</span>
            </button>
          </div>

          <!-- Viewport -->
          <div
            id="preview-viewport-container"
            class="flex-1 overflow-y-auto overflow-x-auto p-2 sm:p-6 pb-20 flex flex-col items-center relative"
            style="background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px), linear-gradient(to bottom, #090a10, #040407); background-size: 20px 20px, 100% 100%;"
          >
            <div
              class="relative my-auto shrink-0 bg-white transition-all duration-150"
              style="width: ${scaledW}px; height: ${scaledH}px; min-height: ${scaledH}px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 15px 35px -5px rgba(0, 0, 0, 0.85);"
            >
              <div
                style="width: 794px; min-height: 1123px; transform: scale(${previewZoom}); transform-origin: top left; position: absolute; top: 0; left: 0;"
              >
                ${getDocumentHTML('cv-screen-preview-node', false)}
              </div>
            </div>
          </div>

          <!-- Floating Action Bar (Only Edit & Direct Print) -->
          <div class="fixed bottom-3 left-4 right-4 z-30 flex items-center justify-between gap-3 bg-[#10101c]/95 backdrop-blur-lg px-3 py-2 rounded-2xl border border-zinc-800 shadow-2xl">
            <button
              type="button"
              onclick="closePreview()"
              class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-semibold active:scale-95"
            >
              <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
              <span>Edit Details</span>
            </button>

            <button
              type="button"
              onclick="handleDirectPrint()"
              class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold active:scale-95 shadow-lg shadow-emerald-600/30 transition-all"
            >
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
              <span>Print CV</span>
            </button>
          </div>
        </div>
      `;
    }

    function goNextStep() {
      if (currentPage < 7) {
        animDirection = 'next';
        currentPage++;
        renderApp();
      } else {
        openPreview();
      }
    }

    function goPrevStep() {
      if (currentPage > 1) {
        animDirection = 'prev';
        currentPage--;
        renderApp();
      }
    }

    function openPreview() {
      activeView = 'preview';
      fitPreviewWidth();
      renderApp();
    }

    function closePreview() {
      activeView = 'editor';
      renderApp();
    }

    function fitPreviewWidth() {
      const container = document.getElementById('preview-viewport-container');
      const w = container ? container.clientWidth - 16 : window.innerWidth - 16;
      previewZoom = Number(Math.max(0.35, Math.min(1.1, w / 794)).toFixed(2));
      if (activeView === 'preview') renderApp();
    }

    function zoomPreview(delta) {
      previewZoom = Number(Math.max(0.35, Math.min(1.4, previewZoom + delta)).toFixed(2));
      renderApp();
    }

    // 100% Reliable Print: Renders fresh print node and waits 80ms for layout settle
    function handleDirectPrint() {
      renderPrintNode();
      setTimeout(() => {
        window.print();
      }, 80);
    }

    async function onPhotoSelected(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const cropped = await processPassportPhoto(file);
        cvData.personal.photo = cropped;
        saveState();
        renderApp();
      } catch(err) {
        alert('Could not load image. Please select a valid photo.');
      }
    }

    function removePhoto() {
      cvData.personal.photo = '';
      saveState();
      renderApp();
    }

    function setObjectivePreset(val) {
      cvData.objective = val;
      saveState();
      renderApp();
    }

    function addArrayItem(key, val) {
      if (!cvData[key]) cvData[key] = [];
      cvData[key].push(val);
      saveState();
      renderApp();
    }

    function removeArrayItem(key, idx) {
      if (!cvData[key]) return;
      cvData[key].splice(idx, 1);
      saveState();
      renderApp();
    }

    function updateArrayItem(key, idx, val) {
      if (!cvData[key]) return;
      cvData[key][idx] = val;
      saveState();
    }

    function setTodayFooterDate() {
      const today = new Date();
      const d = String(today.getDate()).padStart(2, '0');
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const y = today.getFullYear();
      cvData.footer.date = `${d}/${m}/${y}`;
      const input = document.getElementById('input-footer-date');
      if (input) input.value = cvData.footer.date;
      saveState();
    }

    function openResetDialog() {
      const m = document.getElementById('reset-modal');
      if (m) {
        m.classList.remove('hidden');
        m.classList.add('flex');
      }
    }

    function closeResetDialog() {
      const m = document.getElementById('reset-modal');
      if (m) {
        m.classList.add('hidden');
        m.classList.remove('flex');
      }
    }

    function confirmReset() {
      cvData = JSON.parse(JSON.stringify(defaultCVData));
      currentPage = 1;
      activeView = 'editor';
      saveState();
      closeResetDialog();
      renderApp();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('resize', () => {
      if (activeView === 'preview') fitPreviewWidth();
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderApp();
    }
  </script>
</body>
</html>
