<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Strict viewport lock to prevent keyboard scroll and white flashes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <title>TECH ASAR CV BUILDER</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/algerian">

  <style>
    @font-face {
      font-family: 'Algerian';
      font-style: normal;
      font-weight: 400;
      src: local('Algerian'), url('https://fonts.cdnfonts.com/s/137771/vertopal.com_vertopal.com_ALGER.woff') format('woff');
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Total scroll lock */
    :root {
      --app-height: 100vh;
    }
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #08080e !important;
    }

    * {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar, ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }

    .font-algerian { font-family: 'Algerian', 'Times New Roman', serif !important; }

    #app-root, #picker-modal, #step-modal {
      text-transform: uppercase;
      height: var(--app-height);
      max-height: var(--app-height);
    }
    #app-root input, #app-root textarea, #app-root select, #app-root button,
    #picker-modal input, #picker-modal button, #step-modal button {
      font-weight: 700 !important;
      text-transform: uppercase;
    }
    #app-root input::placeholder, #app-root textarea::placeholder, #picker-modal input::placeholder {
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.7;
    }

    /* SMOOTH SPRING & TOAST ANIMATIONS */
    @keyframes slideInRightSmooth { 0% { opacity: 0; transform: translate3d(40px, 0, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    @keyframes slideInLeftSmooth { 0% { opacity: 0; transform: translate3d(-40px, 0, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    @keyframes popInOrigin { 0% { opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.15); } 100% { opacity: 1; transform: translate(0, 0) scale(1); } }
    @keyframes popOutOrigin { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.15); } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes slideInDownSmooth { 0% { opacity: 0; transform: translateY(-15px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes slideOutUpSmooth { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-20px) scale(0.95); } }
    @keyframes floatFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* Glass Water Drop Toast Animations */
    @keyframes toastDrop { 0% { transform: translateY(-60px) scale(0.8); opacity: 0; } 60% { transform: translateY(10px) scale(1.05); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes toastUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(0.8); opacity: 0; } }

    .anim-next { animation: slideInRightSmooth 0.35s cubic-bezier(0.25, 1, 0.35, 1) forwards; will-change: transform, opacity; }
    .anim-prev { animation: slideInLeftSmooth 0.35s cubic-bezier(0.25, 1, 0.35, 1) forwards; will-change: transform, opacity; }
    .anim-none { animation: none !important; }
    .anim-pop-in-origin { animation: popInOrigin 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; }
    .anim-pop-out-origin { animation: popOutOrigin 0.3s cubic-bezier(0.3, 0, 0.8, 0.2) forwards; will-change: transform, opacity; }
    .anim-fade { animation: fadeIn 0.3s ease-out forwards; }
    .anim-new-item { animation: slideInDownSmooth 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; transform-origin: top; }
    .anim-remove-item { animation: slideOutUpSmooth 0.28s cubic-bezier(0.4, 0, 1, 1) forwards; transform-origin: top; }
    .anim-float { animation: floatFloat 4s ease-in-out infinite; }
    
    .toast-enter { animation: toastDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .toast-exit { animation: toastUp 0.3s cubic-bezier(0.36, 0, 0.66, -0.56) forwards; }

    .step-1-noscroll { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 0.5rem; }

    /* Print Setup */
    #cv-print-container { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0mm !important; }
      html, body {
        position: static; overflow: visible;
        width: 210mm !important; height: 297mm !important; margin: 0 !important;
        padding: 0 !important; background: #ffffff !important; color: #000000 !important;
      }
      #app-root, .no-print, #picker-modal, #step-modal, #toast-container { display: none !important; }
      #cv-print-container {
        display: block !important; position: static !important;
        width: 210mm !important; height: 297mm !important;
        padding: 4mm !important; background: #ffffff !important;
      }
      #cv-print-container * { text-transform: none; }
    }
  </style>
</head>

        </svg>

    const upDistricts = Object.keys(upTehsils);
    function getDistricts(state) { return state === "Uttar Pradesh" ? upDistricts : []; }
    function getTehsils(state, dist) { return state === "Uttar Pradesh" && upTehsils[dist] ? upTehsils[dist] : []; }

    function getFontFamilyCss(fontName) {
      if(fontName === 'Algerian') return "'Algerian', 'Times New Roman', serif";
      if(fontName === 'Arial') return "Arial, sans-serif";
      if(fontName === 'Calibri') return "Calibri, 'Open Sans', sans-serif";
      if(fontName === 'Nirmala UI') return "'Nirmala UI', 'Segoe UI', sans-serif";
      return "'Times New Roman', Times, serif";
    }

    const defaultCVData = {
      id: null, lastModified: null, font: "Times New Roman",
      personal: { photo: "", name: "", villagePost: "", state: "", district: "", tehsil: "", mobile: "", email: "", headerStyle: "labeled" },
      objective: "To contribute to the overall growth of your organization by applying my skills, knowledge, honesty & hard-working.",
      academic: ["High School Passed from U.P Board in 2020", "Intermediate Passed from U.P Board. in 2022"],
      other: ["Course On Computer Concepts Diploma (CCC)"],
      experience: ["Fresher"],

      footer: { date: "", place: "", signName: "" },
      style: { title: "CURRICULUM VITAE", font: "Times New Roman", casing: "uppercase", weight: "bold" }
    };

    let appState = { view: 'home', cvData: null, currentPage: 1, animDirection: 'fade', previewZoom: 0.46, pickerType: '', pickerOptions: [], lastAddedKey: null };
    let lastPickerOrigin = { tx: 0, ty: 0 }; 
    let lastEditorOrigin = { tx: 0, ty: 0 };

    function autoResize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight) + 'px'; }
    function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; } }
    
    function saveSilently() {
      if(!appState.cvData) return;
      appState.cvData.lastModified = Date.now();
      const history = getHistory();
      const idx = history.findIndex(x => x.id === appState.cvData.id);
      if (idx >= 0) history[idx] = appState.cvData; else history.push(appState.cvData);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderPrintNode();
    }

    function saveAndRender() { appState.animDirection = 'none'; saveSilently(); renderApp(); }

    function applySuggestion(type, key, text) {
      const decodedText = decodeURIComponent(text);
      if (type === 'array') { addSmoothArrayItem(key, decodedText); } 
      else if (type === 'details_append') {
        const cur = appState.cvData.details[key];
        appState.cvData.details[key] = cur ? cur + ', ' + decodedText : decodedText;
        saveAndRender();
      } else if (type === 'text') {
        appState.cvData[key] = decodedText;
        saveAndRender();
      }
    }

    function buildPills(type, key, suggestions) {
      if(!suggestions || !suggestions.length) return '';
      return `<div class="grid grid-cols-3 gap-1.5 mt-2 w-full">` + 
          suggestions.map(s => {
            const label = typeof s === 'object' ? s.label : s;
            const value = typeof s === 'object' ? s.value : s;
            const encodedValue = encodeURIComponent(value).replace(/'/g, "\\'");
            return `<button onclick="applySuggestion('${type}', '${key}', '${encodedValue}')" class="px-1 py-2 border border-zinc-700 bg-[#11111c] rounded-xl text-[10px] font-bold text-zinc-300 active:bg-zinc-800 transition-colors uppercase flex items-center justify-center text-center leading-tight shadow-sm min-h-[38px] drop-shadow-md truncate">+ ${escapeHtml(label)}</button>`;
          }).join('') + 
      `</div>`;
    }

    function updatePers(k, v) { appState.cvData.personal[k] = v; saveSilently(); }
    function updateDet(k, v) { appState.cvData.details[k] = v; saveSilently(); }
    function updateArr(key, idx, val) { appState.cvData[key][idx] = val; saveSilently(); }

    function captureOrigin(e) {
      if(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        lastEditorOrigin = { tx: `${(rect.left + rect.width/2) - window.innerWidth/2}px`, ty: `${(rect.top + rect.height/2) - window.innerHeight/2}px` };
      }
    }

    function openEditorFromHome(e) {
      captureOrigin(e);
      appState.view = 'editor';
      if(!appState.cvData) {
        appState.cvData = JSON.parse(JSON.stringify(defaultCVData));
        appState.cvData.id = 'cv_' + Date.now();
        appState.currentPage = 1;
      }
      appState.animDirection = 'pop-in'; 
      renderApp();
    }

    function closeEditorToHome() {
      const editorEl = document.getElementById('editor-root-container');
      if(editorEl) {
        editorEl.style.setProperty('--tx', lastEditorOrigin.tx);
        editorEl.style.setProperty('--ty', lastEditorOrigin.ty);
        editorEl.classList.remove('anim-pop-in-origin', 'anim-next', 'anim-prev', 'anim-none');
        editorEl.classList.add('anim-pop-out-origin');
        setTimeout(() => { appState.view = 'home'; appState.animDirection = 'fade'; renderApp(); }, 280);
      } else {
        appState.view = 'home'; appState.animDirection = 'fade'; renderApp();
      }
    }

    function openHistoryFromHome(e) {
      captureOrigin(e);
      appState.view = 'history';
      appState.animDirection = 'pop-in';
      renderApp();
    }
    
    function closeHistoryToHome() {
      const el = document.getElementById('history-root-container');
      if (el) {
        el.style.setProperty('--tx', lastEditorOrigin.tx);
        el.style.setProperty('--ty', lastEditorOrigin.ty);
        el.classList.remove('anim-pop-in-origin', 'anim-none');
        el.classList.add('anim-pop-out-origin');
        setTimeout(() => { appState.view = 'home'; appState.animDirection = 'fade'; renderApp(); }, 280);
      } else {
        appState.view = 'home'; appState.animDirection = 'fade'; renderApp();
      }
    }

    function setView(view, anim = appState.animDirection) {
      appState.view = view;
      appState.animDirection = anim; 
      renderApp();
    }

    function editCV(id, e) {
      captureOrigin(e);
      const history = getHistory();
      const cv = history.find(x => x.id === id);
      if(cv) { 
        appState.cvData = JSON.parse(JSON.stringify(cv)); 
        if(!appState.cvData.style) appState.cvData.style = { title: "CURRICULUM VITAE", font: appState.cvData.font || "Times New Roman", casing: "uppercase", weight: "bold" };
        appState.currentPage = 1; 
        appState.animDirection = 'pop-in'; 
        setView('editor', 'pop-in'); 
      }
    }

    function resetCurrentCV() {
      const currentId = appState.cvData.id;
      appState.cvData = JSON.parse(JSON.stringify(defaultCVData));
      appState.cvData.id = currentId;
      saveAndRender();
    }

    function triggerDeleteHistory(id) {
      const el = document.getElementById(`history-item-${id}`);
      if (el) {
        el.style.animation = 'slideOutUpSmooth 0.3s cubic-bezier(0.4, 0, 1, 1) forwards';
        setTimeout(() => { deleteFromHistory(id); }, 290);
      } else {
        deleteFromHistory(id);
      }
    }

    function deleteFromHistory(id) {
      let history = getHistory(); history = history.filter(x => x.id !== id);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); 
      appState.animDirection = 'none';
      renderApp();
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if(appState.view === 'home') root.innerHTML = getHomeHTML();
      else if(appState.view === 'history') root.innerHTML = getHistoryHTML();
      else if(appState.view === 'editor') root.innerHTML = getEditorHTML();
      else if(appState.view === 'preview') root.innerHTML = getPreviewHTML();
      if(appState.view === 'editor' || appState.view === 'preview') renderPrintNode();

      const textareas = root.querySelectorAll('textarea.auto-expand');
      for(let i = 0; i < textareas.length; i++) {
        textareas[i].style.height = 'auto';
        textareas[i].style.height = textareas[i].scrollHeight + 'px';
      }
    }

    let prevPressTimer;
    let isPrevLongPress = false;
    let prevEventTrigger;

    function startPrevPress(e) {
      isPrevLongPress = false;
      prevEventTrigger = e;
      prevPressTimer = setTimeout(() => { isPrevLongPress = true; openStepSelector(prevEventTrigger); }, 500);
    }
    
    function cancelPrevPress() { clearTimeout(prevPressTimer); }
    function handlePrevClick() { if(!isPrevLongPress) goPrev(); }

    function openStepSelector(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const modal = document.getElementById('step-modal');
      const backdrop = document.getElementById('step-backdrop');
      const box = document.getElementById('step-box');
      
      box.style.setProperty('--tx', `${clickX - centerX}px`);
      box.style.setProperty('--ty', `${clickY - centerY}px`);
      
      let html = '';
      for(let i=1; i<=8; i++) {
         html += `<button onclick="goToStep(${i})" class="w-full text-left px-5 py-3 rounded-xl ${appState.currentPage === i ? 'bg-indigo-600 text-white border-indigo-500' : 'hover:bg-[#181826] text-zinc-200 border-zinc-700'} active:scale-[0.98] transition-all font-bold uppercase tracking-wide mb-2 border shadow-sm">STEP ${i}</button>`;
      }
      document.getElementById('step-list').innerHTML = html;
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      void modal.offsetWidth; 
      backdrop.classList.add('opacity-100');
      box.classList.remove('anim-pop-out-origin');
      box.classList.add('anim-pop-in-origin');
    }

    function closeStepSelector() {
      const backdrop = document.getElementById('step-backdrop');
      const box = document.getElementById('step-box');
      box.classList.remove('anim-pop-in-origin');
      box.classList.add('anim-pop-out-origin');
      backdrop.classList.remove('opacity-100');
      setTimeout(() => {
        const modal = document.getElementById('step-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        box.classList.remove('anim-pop-out-origin');
      }, 250);
    }

    function goToStep(step) {
      if (step === appState.currentPage) { closeStepSelector(); return; }
      appState.animDirection = step > appState.currentPage ? 'next' : 'prev';
      appState.currentPage = step;
      closeStepSelector();
      setTimeout(() => { renderApp(); }, 250);
    }

    function openLocationPicker(e, type) {
      const p = appState.cvData.personal;
      let options = [];

      if(type === 'state') options = indianStates;
      else if (type === 'district') {
        if(!p.state) return showToast("PLEASE SELECT A STATE FIRST!");
        options = getDistricts(p.state);
      } else if (type === 'tehsil') {
        if(!p.district) return showToast("PLEASE SELECT A DISTRICT FIRST!");
        options = getTehsils(p.state, p.district);
      } else if (type === 'nationality') options = nationalities;
      else if (type === 'language') options = languageList;
      else if (type === 'gender') options = ["MALE", "FEMALE"];
      else if (type === 'marital') options = ["UNMARRIED", "MARRIED"];
      else if (type === 'cvTitle') options = ["RESUME", "CURRICULUM VITAE"];
      else if (type === 'cvFont') options = ["Algerian", "Times New Roman", "Arial", "Calibri", "Nirmala UI"];
      else if (type === 'cvCase') options = ["CAPITAL CASE", "PROPER CASE"];
      else if (type === 'cvWeight') options = ["BOLD", "NORMAL"];

      appState.pickerType = type;
      appState.pickerOptions = options;
      
      let titleLabel = type.replace('cv', 'CV ');
      document.getElementById('picker-title').innerText = `SELECT ${titleLabel}`;
      document.getElementById('picker-search').value = '';
      
      renderPickerList(options);
      
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      lastPickerOrigin.tx = `${clickX - centerX}px`;
      lastPickerOrigin.ty = `${clickY - centerY}px`;
      
      const modal = document.getElementById('picker-modal');
      const backdrop = document.getElementById('picker-backdrop');
      const box = document.getElementById('picker-box');
      
      box.style.setProperty('--tx', lastPickerOrigin.tx);
      box.style.setProperty('--ty', lastPickerOrigin.ty);
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      void modal.offsetWidth; 
      backdrop.classList.add('opacity-100');
      box.classList.remove('anim-pop-out-origin');
      box.classList.add('anim-pop-in-origin');
    }

    function renderPickerList(options, searchStr = '') {
      const listDiv = document.getElementById('picker-list');
      
      let html = options.map(opt => `
        <button onclick="selectLocationOption('${opt.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3.5 rounded-xl hover:bg-[#181826] active:bg-zinc-800 text-sm text-zinc-200 active:scale-[0.98] transition-all font-bold uppercase tracking-wide">
          ${opt}
        </button>
      `).join('');

      if (searchStr.trim() !== '') {
        const exactMatch = options.some(o => o.toLowerCase() === searchStr.toLowerCase());
        if (!exactMatch) {
          html = `
            <button onclick="selectLocationOption('${searchStr.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3.5 rounded-xl bg-transparent border border-indigo-500 text-sm text-indigo-400 active:scale-[0.98] transition-all mb-2 flex items-center gap-2 font-bold uppercase shadow-lg">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
              USE "${searchStr}"
            </button>
          ` + html;
        }
      }

      if(!html) html = `<div class="text-zinc-500 text-xs text-center py-6 font-bold uppercase tracking-widest leading-relaxed">NOT FOUND.<br/>TYPE ABOVE TO ADD CUSTOM.</div>`;
      listDiv.innerHTML = html;
    }

    function filterPickerList(val) {
      const q = val.toLowerCase();
      const filtered = appState.pickerOptions.filter(o => o.toLowerCase().includes(q));
      renderPickerList(filtered, val);
    }

    function selectLocationOption(val) {
      const type = appState.pickerType;
      
      if (type === 'state' || type === 'district' || type === 'tehsil') {
        appState.cvData.personal[type] = val;
        if(type === 'state') { appState.cvData.personal.district=''; appState.cvData.personal.tehsil=''; }
        if(type === 'district') { appState.cvData.personal.tehsil=''; }
      } 
      else if (type === 'nationality' || type === 'gender' || type === 'marital') appState.cvData.details[type] = val;
      else if (type === 'language') appState.cvData.details.languages = val;
      else if (type === 'cvTitle') appState.cvData.style.title = val;
      else if (type === 'cvFont') appState.cvData.style.font = val;
      else if (type === 'cvCase') appState.cvData.style.casing = (val === 'PROPER CASE' ? 'capitalize' : 'uppercase');
      else if (type === 'cvWeight') appState.cvData.style.weight = (val === 'NORMAL' ? 'normal' : 'bold');
      
      saveSilently();
      
      const setVal = (id, value, placeholder) => {
        const el = document.getElementById(id);
        if(el) {
          el.innerText = value || placeholder;
          el.parentElement.className = el.parentElement.className.replace(/text-zinc-100|text-zinc-500/g, '') + (value ? ' text-zinc-100' : ' text-zinc-500');
        }
      };
      
      if (type === 'nationality') setVal('display-nationality', val, 'SELECT NATIONALITY');
      else if (type === 'language') setVal('display-language', val, 'SELECT LANGUAGE');
      else if (type === 'gender') setVal('display-gender', val, 'GENDER');
      else if (type === 'marital') setVal('display-marital', val, 'MARITAL');
      else if (['cvTitle', 'cvFont', 'cvCase', 'cvWeight'].includes(type)) {
         let dispVal = val;
         if(type === 'cvCase') dispVal = (val === 'capitalize' ? 'PROPER CASE' : 'CAPITAL CASE');
         if(type === 'cvWeight') dispVal = (val === 'normal' ? 'NORMAL' : 'BOLD');
         setVal(`display-${type}`, dispVal, type);
      }
      else {
        setVal('display-state', appState.cvData.personal.state, 'SELECT STATE');
        setVal('display-district', appState.cvData.personal.district, 'SELECT DISTRICT');
        setVal('display-tehsil', appState.cvData.personal.tehsil, 'SELECT TEHSIL');
      }
      
      closePicker();
    }

    function closePicker() {
      const backdrop = document.getElementById('picker-backdrop');
      const box = document.getElementById('picker-box');
      
      box.style.setProperty('--tx', lastPickerOrigin.tx);
      box.style.setProperty('--ty', lastPickerOrigin.ty);
      box.classList.remove('anim-pop-in-origin');
      box.classList.add('anim-pop-out-origin');
      backdrop.classList.remove('opacity-100');
      
      setTimeout(() => {
        const modal = document.getElementById('picker-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        box.classList.remove('anim-pop-out-origin');
      }, 280);
    }

    function goNext(e) {
      if(appState.currentPage < 8) { 
        appState.animDirection = 'next'; appState.currentPage++; renderApp(); 
      }
      else { 
        goPreview(e);
      }
    }

    function goPreview(e) {
      captureOrigin(e);
      setView('preview', 'pop-in');
    }

    function goPrev() {
      if(appState.currentPage > 1) { appState.animDirection = 'prev'; appState.currentPage--; renderApp(); }
    }

    function onPhotoSelected(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { 
        appState.cvData.personal.photo = ev.target.result; 
        appState.animDirection = 'none'; 
        saveSilently(); 
        renderApp();
      };
      reader.readAsDataURL(file);
    }

    function closePreviewAnim() {
      const previewRoot = document.getElementById('preview-root-container');
      if (previewRoot) {
        previewRoot.style.setProperty('--tx', lastEditorOrigin.tx);
        previewRoot.style.setProperty('--ty', lastEditorOrigin.ty);
        previewRoot.classList.remove('anim-pop-in-origin');
        previewRoot.classList.add('anim-pop-out-origin');
        setTimeout(() => setView('editor', 'none'), 250);
      } else {
        setView('editor', 'none');
      }
    }

    // Modern Preview layout: Pill header at top, action bar at bottom
    function getPreviewHTML() {
      const scaledW = Math.round(794 * appState.previewZoom);
      const scaledH = Math.round(1123 * appState.previewZoom);
      
      return `
        <div id="preview-root-container" class="flex-1 flex flex-col bg-[#08080e] relative h-full overflow-hidden ${appState.animDirection==='pop-in'?'anim-pop-in-origin':''}" style="--tx:${lastEditorOrigin.tx}; --ty:${lastEditorOrigin.ty};">
          
          <div class="absolute top-4 left-1/2 transform -translate-x-1/2 px-5 py-1.5 bg-zinc-800/90 backdrop-blur-md text-white text-[10px] font-black rounded-full z-40 border border-zinc-700 shadow-xl tracking-widest uppercase">
            PREVIEW
          </div>

          <div id="preview-viewport" class="flex-1 overflow-auto p-4 pt-16 pb-6 flex flex-col items-center">
             <div class="relative bg-white shadow-2xl transition-all" style="width:${scaledW}px; height:${scaledH}px; min-height:${scaledH}px;">
                <div style="width:794px; min-height:1123px; transform: scale(${appState.previewZoom}); transform-origin: top left; position: absolute; top:0; left:0;">
                  ${getCVDocumentHTML('cv-screen-preview', false)}
                </div>
             </div>
          </div>

          <header class="flex items-center justify-between px-4 py-3 z-30 shrink-0 bg-[#08080e]/90 backdrop-blur-md border-t border-zinc-800">
            <button onclick="closePreviewAnim()" class="px-5 py-2.5 flex items-center gap-1.5 bg-transparent rounded-full text-white text-[11px] font-extrabold border border-zinc-700 active:scale-90 uppercase tracking-wide transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg> EDIT
            </button>
            <div class="flex items-center gap-2 bg-[#11111c] p-1.5 rounded-full border border-zinc-700 shadow-md">
              <button onclick="appState.previewZoom=Math.max(0.3, appState.previewZoom-0.1); appState.animDirection='none'; renderApp();" class="w-8 h-8 flex items-center justify-center text-zinc-300 active:scale-90"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg></button>
              <span class="text-[11px] font-extrabold text-zinc-100 min-w-[32px] text-center tracking-wider">${Math.round(appState.previewZoom*100)}%</span>
              <button onclick="appState.previewZoom=Math.min(1.5, appState.previewZoom+0.1); appState.animDirection='none'; renderApp();" class="w-8 h-8 flex items-center justify-center text-zinc-300 active:scale-90"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg></button>
            </div>
            <button onclick="handleDirectPrint()" class="px-5 py-2.5 flex items-center gap-1.5 bg-emerald-500/10 rounded-full text-emerald-400 text-[11px] font-extrabold active:scale-90 uppercase tracking-wide border border-emerald-500/50 transition-all shadow-md">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> PRINT
            </button>
          </header>
        </div>
      `;
    }

    function renderPrintNode() {
      if(!appState.cvData) return;
      const c = document.getElementById('cv-print-container');
      if(c) c.innerHTML = getCVDocumentHTML('cv-actual-print', true);
    }
    function handleDirectPrint() {
      renderPrintNode();
      setTimeout(() => window.print(), 100);
    }

    // Dynamic Style processing strictly handled here
    function getCVDocumentHTML(id, isPrintMode) {
      const cv = appState.cvData;
      if(!cv) return '';
      const p = cv.personal;
      const d = cv.details;
      const f = cv.footer;
      
      const cvStyle = cv.style || { title: "CURRICULUM VITAE", font: "Times New Roman", casing: "uppercase", weight: "bold" };
      const font = getFontFamilyCss(cvStyle.font);
      const textTransform = cvStyle.casing; // "uppercase" or "capitalize"
      const textWeight = cvStyle.weight; // "bold" or "normal"

      let printDob = d.dob || '';
      if(printDob === '//') printDob = '';

      const contactList = [
        { label: 'Name', val: p.name, bold: true },
        { label: 'Address', val: p.villagePost },
        { label: 'Tehsil', val: p.tehsil },
        { label: 'District', val: p.district },
        { label: 'State', val: p.state },
        { label: 'Mobile No.', val: p.mobile },
        { label: 'Email Id', val: p.email }
      ].filter(x => x.val && x.val.trim());

      const contactRowsHTML = contactList.map((item, idx) => `
        <tr>
          <td style="font-weight:bold; font-size:${idx === 0 ? '12pt' : '11pt'}; vertical-align:top; padding:1.5px 0; color:#000; width:80px; text-transform:none;">${item.label}</td>
          <td style="font-weight:bold; font-size:${idx === 0 ? '12pt' : '11pt'}; text-align:center; vertical-align:top; padding:1.5px 0; color:#000; width:15px;">:</td>
          <td style="font-weight:${idx === 0 ? textWeight : (textWeight === 'bold' ? 'bold' : 'normal')}; font-size:${idx === 0 ? '12pt' : '11pt'}; text-transform:${textTransform}; vertical-align:top; padding:1.5px 0; color:#000;">${item.val}</td>
        </tr>
      `).join('');

      const personalDetailsHTML = [
        { l: 'Name', v: p.name, bold: true },
        { l: 'Date of Birth', v: printDob },
        { l: "Father's Name", v: d.father },
        { l: 'Gender', v: d.gender },
        { l: 'Marital Status', v: d.marital },
        { l: 'Nationality', v: d.nationality },
        { l: 'Language Known', v: d.languages },
        { l: 'Hobbies', v: d.hobbies }
      ].map(item => `
        <tr>
          <td style="padding:2px 0; vertical-align:top; color:#000; width:140px; font-weight:normal; text-transform:none;">${item.l}</td>
          <td style="padding:2px 0; text-align:center; font-weight:bold; vertical-align:top; color:#000; width:18px;">:</td>
          <td style="padding:2px 0; font-weight:${item.bold ? textWeight : (textWeight === 'bold' ? 'bold' : 'normal')}; text-transform:${textTransform}; vertical-align:top; color:#000;">${item.v || ''}</td>
        </tr>
      `).join('');

      const genList = (arr) => (arr||[]).filter(x => x.trim()).map(x => `<li style="padding-left:4px; line-height:1.35; color:#000; font-weight:${textWeight === 'bold' ? 'bold' : 'normal'}; text-transform:${textTransform};">${x}</li>`).join('');
      
      const academicHTML = genList(cv.academic);
      const otherHTML = genList(cv.other);
      const expHTML = genList(cv.experience);

      const photoBoxHTML = p.photo ? 
        `<img src="${p.photo}" style="width:96px !important; height:124px !important; object-fit:cover !important; display:block !important; margin:0 auto;" />` : 
        `<div style="width:96px; height:124px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px dashed #71717a;"><span style="font-size:7.5pt; font-weight:bold; color:#000; text-transform:none;">PHOTO</span></div>`;

      return `
        <div id="${id}" style="width:${isPrintMode ? '100%' : '794px'}; min-height:${isPrintMode ? '288mm' : '1123px'}; background-color:#ffffff; color:#000; padding:${isPrintMode ? '4mm' : '6mm'}; font-family:${font}; box-sizing:border-box; font-weight:normal; text-transform:none;">
          <div style="width:100%; min-height:${isPrintMode ? '282mm' : '1085px'}; border:1.5px solid #000; padding:2.5px; box-sizing:border-box;">
            <div style="width:100%; min-height:calc(${isPrintMode ? '282mm' : '1085px'} - 7px); border:2.5px solid #000; padding:6mm 8mm; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between;">
              
              <div>
                <h1 class="font-algerian" style="text-align:center; font-size:22pt; font-weight:bold; text-decoration:underline; margin-bottom:8px; color:#000; text-transform:uppercase;">${cvStyle.title}</h1>
                <table style="width:100%; table-layout:fixed; border-collapse:collapse;">
                  <tr>
                    <td style="vertical-align:top; width:calc(100% - 116px);">
                      <table style="width:100%; font-size:11pt; color:#000;">${contactRowsHTML}</table>
                    </td>
                    <td style="width:110px; vertical-align:top; text-align:right;">
                      <div style="width:96px; height:124px; border:1.5px solid #000; overflow:hidden; margin-left:auto;">${photoBoxHTML}</div>
                    </td>
                  </tr>
                </table>
                <div style="width:100%; height:4px; border-top:1.2px solid #000; border-bottom:1.2px solid #000; margin:6px 0;"></div>
              </div>

              <div style="display:flex; flex-direction:column; flex:1; justify-content:space-evenly; margin:4px 0; gap:8px; font-size:11pt; color:#000;">
                ${cv.objective ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Carrier Objective:-</h2><ul style="list-style-type:disc; margin-left:24px;"><li style="padding-left:4px; text-align:justify; font-weight:${textWeight === 'bold' ? 'bold' : 'normal'}; text-transform:${textTransform};">${cv.objective}</li></ul></div>` : ''}
                ${academicHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Academic Qualification:-</h2><ul style="list-style-type:disc; margin-left:24px;">${academicHTML}</ul></div>` : ''}
                ${otherHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Other Qualification:-</h2><ul style="list-style-type:disc; margin-left:24px;">${otherHTML}</ul></div>` : ''}
                ${expHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Working Experience:-</h2><ul style="list-style-type:disc; margin-left:24px;">${expHTML}</ul></div>` : ''}
                
                <div>
                  <h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Personal Detail:-</h2>
                  <table style="width:100%; font-size:11pt; margin-left:14px; color:#000;">${personalDetailsHTML}</table>
                </div>

                ${cv.declaration ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Declaration:-</h2><p style="text-align:justify; font-weight:${textWeight === 'bold' ? 'bold' : 'normal'}; text-transform:${textTransform};">${cv.declaration}</p></div>` : ''}
              </div>

              <div style="padding-top:10px;">
                <table style="width:100%; font-size:11.5pt; font-weight:bold; color:#000;">
                  <tr>
                    <td style="vertical-align:bottom; text-transform:none;">Date: ${f.date}<br/>Place: ${f.place}</td>
                    <td style="vertical-align:bottom; text-align:right; font-weight:${textWeight === 'bold' ? 'bold' : 'normal'}; text-transform:${textTransform};">( ${f.signName || p.name} )</td>
                  </tr>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if(!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => setView('home'));
  </script>
</body>
</html>
