    window.handleDateInputChange = function(inputEl, fieldPath) {

        let val = inputEl.value.replace(/\D/g, ''); 
        
        if(inputEl.dataset.type === 'dd' || inputEl.dataset.type === 'mm') val = val.substring(0, 2);
        if(inputEl.dataset.type === 'yyyy') val = val.substring(0, 4);
        
        inputEl.value = val;

        if(inputEl.dataset.type === 'dd' && val.length === 2) parent.querySelector('.mm-input').focus();
        else if(inputEl.dataset.type === 'mm' && val.length === 2) parent.querySelector('.yyyy-input').focus();

        const d = parent.querySelector('.dd-input').value;
        const m = parent.querySelector('.mm-input').value;
        const y = parent.querySelector('.yyyy-input').value;
        
        if (d && m && y) setNested(cvData, fieldPath, d + '/' + m + '/' + y);

    function processPassportPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onerror = () => reject(new Error("Failed"));
        reader.onload = (ev) => {
          const img = new Image(); img.onerror = () => reject(new Error("Invalid"));
          img.onload = () => {
            const targetW = 413, targetH = 531; const targetAspect = targetW / targetH;
            const srcW = img.naturalWidth || img.width; const srcH = img.naturalHeight || img.height;
            let sx = 0, sy = 0, sw = srcW, sh = srcH;
            if (srcW / srcH > targetAspect) { sw = srcH * targetAspect; sx = (srcW - sw) / 2; } 
            else { sh = srcW / targetAspect; sy = Math.max(0, (srcH - sh) * 0.22); }
            const canvas = document.createElement('canvas'); canvas.width = targetW; canvas.height = targetH;
            const ctx = canvas.getContext('2d'); if (!ctx) return resolve(ev.target.result);
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, targetW, targetH);
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function renderHistoryList() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = `<div class="flex flex-col items-center py-12"><div class="w-8 h-8 border-[3px] border-zinc-800 border-t-indigo-500 rounded-full animate-spin mb-4"></div><div class="text-zinc-500 text-xs font-bold uppercase">FETCHING HISTORY...</div></div>`;
      if (!currentUser || !window.db) return;
      try {
          const querySnapshot = await window.getDocs(window.collection(window.db, `users/${currentUser.uid}/cvs`));
          let hist = []; querySnapshot.forEach((doc) => { hist.push(doc.data()); }); hist.sort((a,b) => b.timestamp - a.timestamp);
          if (hist.length === 0) { container.innerHTML = '<div class="text-zinc-500 text-sm text-center py-8 font-bold uppercase">NO CVS FOUND.</div>'; return; }
          container.innerHTML = hist.map(h => `

              <div class="flex flex-col flex-1 min-w-0 cursor-pointer" onclick="loadCVFromHistory(event, '${h.id}')"><span class="text-zinc-100 font-bold text-sm truncate uppercase">${escapeHtml(h.name)}</span><span class="text-zinc-500 text-[11px] mt-0.5 font-bold uppercase">${h.date || 'SAVED RECENTLY'}</span></div>

                <button type="button" onclick="printFromHistory(event, '${h.id}')" class="flex items-center gap-1.5 bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs font-bold active:scale-95 uppercase w-[80px] justify-center"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg><span>PRINT</span></button>
                <button type="button" onclick="deleteFromHistory(event, '${h.id}')" class="p-2 bg-zinc-800/80 rounded-lg text-zinc-400 hover:text-red-400 active:scale-95"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>

            </div>`).join('');
      } catch(e) { container.innerHTML = '<div class="text-red-400 text-sm text-center py-8 font-bold uppercase">ERROR LOADING HISTORY.</div>'; }

    async function loadCVFromHistory(e, id) {
      if(e) e.stopPropagation(); if(!currentUser || !window.db) return;
      try {
          const docSnap = await window.getDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
          if(docSnap.exists()){
             cvData = JSON.parse(JSON.stringify(docSnap.data().data)); currentCvId = id; localStorage.setItem('techasar_current_cv_id', currentCvId); saveState();
             closeHistory(); appStarted = true; enteringEditor = true; isNavigating = true; currentPage = 1; activeView = 'editor'; renderApp();
          }
      } catch(e) {}
    }
    async function printFromHistory(e, id) {
      if(e) e.stopPropagation(); if(!currentUser || !window.db) return;
      const btn = e.currentTarget; const ogHTML = btn.innerHTML; btn.innerHTML = `<div class="w-3.5 h-3.5 border-[2px] border-white/30 border-t-white rounded-full animate-spin"></div>`;
      try {
          const docSnap = await window.getDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
          if(docSnap.exists()){
             const tempOldData = cvData; cvData = JSON.parse(JSON.stringify(docSnap.data().data));
             requestAnimationFrame(() => { triggerPrint(() => { cvData = tempOldData; if(activeView === 'preview') renderApp(); }); });
          }
      } catch(err) { showUIAlert("ERROR", "Failed to load CV for printing.", false); }
      btn.innerHTML = ogHTML;
    }
    function deleteFromHistory(e, id) {
        if(e) e.stopPropagation();
        showUIAlert("DELETE CV?", "ARE YOU SURE YOU WANT TO DELETE THIS CV FROM HISTORY?", true, async (res) => {
            if(res) {
                try { await window.deleteDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id)); if (currentCvId === id) { cvData = JSON.parse(JSON.stringify(defaultCVData)); currentCvId = null; localStorage.removeItem('techasar_current_cv_id'); saveState(); } renderHistoryList(); } catch(e) {}
            }
        });
    }

    function autoResizeTextarea(element) { element.style.height = 'auto'; element.style.height = (element.scrollHeight) + 'px'; }
    
    // SMOOTH PAYTM STYLE THEME TOGGLE LOGIC
    window.toggleTheme = function(e) {
       const btn = e.currentTarget;
       const rect = btn.getBoundingClientRect();
       const x = rect.left + rect.width / 2;
       const y = rect.top + rect.height / 2;
       
       const isLight = document.body.classList.contains('light-theme');
       document.body.classList.toggle('light-theme'); // Trigger content transition immediately
       
       const ripple = document.createElement('div');
       ripple.style.position = 'fixed';
       ripple.style.borderRadius = '50%';
       ripple.style.zIndex = '0';
       ripple.style.pointerEvents = 'none';
       ripple.style.backgroundColor = isLight ? '#08080e' : '#f0f2f5'; // the theme going to
       
       const size = Math.max(window.innerWidth, window.innerHeight) * 2.5;
       ripple.style.width = size + 'px';
       ripple.style.height = size + 'px';
       ripple.style.left = (x - size/2) + 'px';
       ripple.style.top = (y - size/2) + 'px';
       ripple.style.transform = 'scale(0)';
       ripple.style.transition = 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
       
       document.body.appendChild(ripple);
       
       // Force reflow and start ripple
       ripple.getBoundingClientRect();
       ripple.style.transform = 'scale(1)';
       
       const svg = btn.querySelector('svg');
       if(!isLight) { 
           svg.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'; 
       } else { 
           svg.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'; 
       }
       
       setTimeout(() => { ripple.remove(); }, 650);
    }

            <span class="w-5 h-5 rounded bg-zinc-800 text-zinc-400 text-[11px] font-bold flex items-center justify-center shrink-0 mt-0.5 uppercase">${idx + 1}</span>
            <textarea rows="1" oninput="updateArrayItem('experience', ${idx}, this.value); autoResizeTextarea(this);" class="capitalize flex-1 min-w-0 bg-transparent border-none text-[14px] sm:text-xs text-zinc-100 font-bold outline-none px-1 resize-none overflow-hidden" style="min-height: 24px;">${escapeHtml(item)}</textarea>
            <button type="button" onclick="removeArrayItem('experience', ${idx})" class="p-1 text-zinc-500 hover:text-red-400 active:scale-90 shrink-0 mt-0.5"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
          </div>
        `).join('');

        stepContentHTML = `
          <div class="space-y-3.5 pb-8">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-3 transition-colors">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-300">WORKING EXPERIENCE</h3>
                <button type="button" onclick="addArrayItem('experience', '')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold uppercase active:scale-95 shrink-0 transition-transform"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg><span>ADD</span></button>
              </div>
              <div class="space-y-2">${expItems}</div>
              <div class="pt-2 border-t border-zinc-800 space-y-1.5">
                <span class="text-[11px] font-bold text-zinc-400 block uppercase">1-TAP ADD:</span>
                <div class="flex flex-wrap gap-1.5">
                  <button type="button" onclick="addArrayItem('experience', '1 YEAR WORKING EXPERIENCE IN DATA ENTRY')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ DATA ENTRY</button>
                  <button type="button" onclick="addArrayItem('experience', 'FRESHER')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ FRESHER</button>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 6) {
        stepContentHTML = `
          <div class="space-y-3.5 pb-8">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-3.5 transition-colors">
              <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-300">PERSONAL DETAILS TABLE</h3>
              <div>
                <label class="block text-[11px] font-bold text-zinc-400 mb-1.5 uppercase tracking-widest">DATE OF BIRTH</label>
                ${generateCustomDateInput(cvData.details.dob, 'details.dob')}
              </div>
              <div>
                <input type="text" placeholder="FATHER'S NAME" value="${escapeHtml(cvData.details.father)}" oninput="cvData.details.father = this.value; saveState();" class="capitalize w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-3.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500 placeholder:text-zinc-500 transition-colors" />
              </div>
              <div class="grid grid-cols-2 gap-2.5">
                ${createCustomDropdown('details.gender', [{label: 'MALE', val: 'MALE'}, {label: 'FEMALE', val: 'FEMALE'}, {label: 'OTHER', val: 'OTHER'}], 'SELECT GENDER')}
                ${createCustomDropdown('details.marital', [{label: 'UNMARRIED', val: 'UNMARRIED'}, {label: 'MARRIED', val: 'MARRIED'}], 'SELECT STATUS')}
              </div>
              <div>
                ${createCustomDropdown('details.nationality', [{label: 'INDIAN', val: 'INDIAN'}, {label: 'OTHER', val: 'OTHER'}], 'SELECT NATIONALITY')}
                <div id="custom-nationality-wrapper" style="display: ${cvData.details.nationality === 'OTHER' ? 'block' : 'none'};" class="mt-2 w-full elegant-entry">
                   <input type="text" placeholder="ENTER NATIONALITY" oninput="cvData.details.customNationality = this.value; saveState();" class="capitalize w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-3.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500 placeholder:text-zinc-500 transition-colors" value="${escapeHtml(cvData.details.customNationality || '')}">
                </div>
              </div>
              <div>
                <input id="lang-input" type="text" value="${escapeHtml(cvData.details.languages)}" oninput="cvData.details.languages = this.value; saveState();" placeholder="LANGUAGE KNOWN (e.g. HINDI & ENGLISH)" class="capitalize w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-3.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500 placeholder:text-zinc-500 transition-colors" />
                <div class="flex flex-wrap gap-1.5 mt-2">
                  <button type="button" onclick="setLanguage('HINDI')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ HINDI</button>
                  <button type="button" onclick="setLanguage('ENGLISH')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ ENGLISH</button>
                  <button type="button" onclick="setLanguage('HINDI & ENGLISH')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ HINDI & ENGLISH</button>
                </div>
              </div>
              <div>
                <input id="hobbies-input" type="text" value="${escapeHtml(cvData.details.hobbies)}" oninput="cvData.details.hobbies = this.value; saveState();" placeholder="HOBBIES (e.g. EDITING, MUSIC)" class="capitalize w-full bg-[#181826] border border-zinc-700/80 rounded-xl px-3.5 py-3.5 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500 placeholder:text-zinc-500 transition-colors" />
                <div class="flex flex-wrap gap-1.5 mt-2">
                  <button type="button" onclick="appendHobby('READING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ READING</button>
                  <button type="button" onclick="appendHobby('MUSIC')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ MUSIC</button>
                  <button type="button" onclick="appendHobby('GAMING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-lg bg-[#181826] border border-zinc-700 text-zinc-300 active:scale-95 transition-colors">+ GAMING</button>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 7) {
        stepContentHTML = `
          <div class="space-y-3.5 pb-8">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-2.5 transition-colors">
              <label class="block text-xs font-bold text-zinc-200 uppercase tracking-widest">DECLARATION STATEMENT</label>
              <textarea id="declaration-input" rows="4" oninput="cvData.declaration = this.value; saveState(); autoResizeTextarea(this);" placeholder="WRITE YOUR DECLARATION HERE..." class="capitalize w-full min-h-[110px] bg-[#181826] border border-zinc-700/80 rounded-xl p-3 text-[15px] sm:text-sm text-zinc-100 font-bold outline-none focus:border-indigo-500 leading-relaxed resize-none transition-colors">${escapeHtml(cvData.declaration)}</textarea>
              <div class="pt-2 border-t border-zinc-800">
                <span class="text-[11px] font-bold text-zinc-400 block mb-1.5 uppercase">QUICK TEMPLATE:</span>
                <button type="button" onclick="setDeclarationPreset('I HEREBY DECLARE THAT ALL THE INFORMATION MENTIONED ABOVE IS TRUE TO THE BEST OF MY KNOWLEDGE. IF YOU GIVE ME A CHANCE, I ASSURE MY HARD WORK, DEDICATION AND SINCERITY')" class="w-full text-left text-[11.5px] font-bold bg-[#181826] hover:bg-[#1f1f32] p-2.5 rounded-xl border border-zinc-700/70 text-zinc-300 uppercase active:scale-[0.99] transition-all">"I HEREBY DECLARE THAT ALL THE INFORMATION..."</button>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 8) {
        stepContentHTML = `
          <div class="space-y-3.5 pb-8">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-4 shadow-sm relative overflow-hidden group transition-colors cursor-pointer" onclick="openSignatureModal()">
              <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <div class="flex items-center justify-between relative z-10">
                 <div class="flex flex-col">
                    <span class="text-[11px] text-zinc-400 font-bold uppercase tracking-widest mb-1.5">SIGN-OFF SUMMARY</span>
                    <span class="text-[16px] text-zinc-100 font-bold capitalize">${cvData.footer.signName || 'NO SIGNATURE ADDED'}</span>
                    ${cvData.footer.place ? `<span class="text-[13px] text-zinc-500 font-bold capitalize mt-0.5">${cvData.footer.place} ${cvData.footer.date ? `| ${cvData.footer.date}` : ''}</span>` : '<span class="text-[12px] text-indigo-400 font-bold uppercase mt-0.5">CLICK + TO ADD DETAILS</span>'}
                 </div>
                 <button type="button" class="w-12 h-12 bg-indigo-600 hover:bg-indigo-500 rounded-2xl flex items-center justify-center text-white active:scale-95 shadow-lg shadow-indigo-600/30 transition-transform pointer-events-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                 </button>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 9) {
        stepContentHTML = `
          <div class="space-y-3.5 pb-8">
            <div class="bg-[#11111c] border border-zinc-800 rounded-2xl p-3.5 space-y-4 transition-colors">
              <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2 mb-3">DOCUMENT SETTINGS</h3>
                <div class="space-y-3">
                  ${createCustomDropdown('documentTitle', [{label: 'CURRICULUM VITAE', val: 'CURRICULUM VITAE'}, {label: 'RESUME', val: 'RESUME'}], 'DOCUMENT TITLE')}
                  ${createCustomDropdown('font', [{label: 'TIMES NEW ROMAN', val: 'Times New Roman'}, {label: 'ARIAL', val: 'Arial'}, {label: 'CALIBRI', val: 'Calibri'}, {label: 'ALGERIAN', val: 'Algerian'}], 'DOCUMENT FONT')}
                  ${createCustomDropdown('fontWeight', [{label: 'BOLD TEXT', val: 'bold'}, {label: 'NORMAL TEXT', val: 'normal'}], 'TEXT WEIGHT')}
                  ${createCustomDropdown('textCase', [{label: 'UPPERCASE (ALL CAPITAL)', val: 'uppercase'}, {label: 'PROPER CASE (FIRST LETTER CAPITAL)', val: 'capitalize'}], 'TEXT CASE')}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      const slideWrapper = document.getElementById('slide-wrapper');
      const newSlide = document.createElement('div');
      newSlide.className = `slide-content ${enterAnimClass}`;
      newSlide.innerHTML = stepContentHTML;

      const oldSlide = slideWrapper.querySelector('.slide-content');
      
      if (oldSlide && isNavigating) {
          oldSlide.classList.remove('slide-enter-next', 'slide-enter-prev', 'elegant-entry');
          oldSlide.classList.add(animDirection === 'next' ? 'slide-exit-next' : 'slide-exit-prev');
          setTimeout(() => { if (oldSlide.parentNode) oldSlide.remove(); }, 380); // Ensure removal
      } else if (oldSlide) {
          oldSlide.remove();
      }
      
      slideWrapper.appendChild(newSlide);
      requestAnimationFrame(() => { newSlide.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el)); });
    }

    function renderPreviewView(container) {
      // Manual Zoom feature removed. CV is fully auto-fitted based on window width.
      const scaledW = Math.round(794 * previewZoom);
      const scaledH = Math.round(1123 * previewZoom);

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden bg-[#06060a] elegant-entry transition-colors">
          <div class="bg-[#0e0e18] border-b border-zinc-800 px-3 py-2 flex items-center justify-between gap-2 z-20 shrink-0 shadow-sm transition-colors">
            <button type="button" onclick="closePreview()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-100 text-xs font-bold uppercase border border-zinc-700 active:scale-95 transition-all">
              <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg>
              <span>BACK TO EDIT</span>
            </button>
            <button type="button" onclick="handleDirectPrint()" class="flex-1 flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold uppercase active:scale-95 shadow-lg shadow-emerald-600/30 transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
              <span>PRINT CV</span>
            </button>
          </div>
          <div id="preview-viewport-container" class="flex-1 overflow-y-auto overflow-x-auto p-2 sm:p-6 pb-20 flex flex-col items-center justify-center relative" style="background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.2px, transparent 1.2px); background-size: 20px 20px;">
            <div class="relative my-auto shrink-0 bg-white" style="width: ${scaledW}px; height: ${scaledH}px; min-height: ${scaledH}px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 15px 35px -5px rgba(0, 0, 0, 0.85);">
              <div style="width: 794px; min-height: 1123px; transform: scale(${previewZoom}); transform-origin: top left; position: absolute; top: 0; left: 0;">
                ${getDocumentHTML('cv-screen-preview-node', false)}
              </div>
            </div>
          </div>
        </div>
      `;
      setTimeout(() => { autoFitCV('cv-screen-preview-node'); }, 50);
    }

    function goNextStep() {
      if (currentPage < TOTAL_STEPS) {
        animDirection = 'next'; currentPage++; isNavigating = true; renderApp();
        requestAnimationFrame(() => { const scrollArea = document.getElementById('editor-scroll-area'); if(scrollArea) scrollArea.scrollTop = 0; });
      } else { openPreview(); }
    }
    
    function goPrevStep() {
      if (currentPage > 1) {
        animDirection = 'prev'; currentPage--; isNavigating = true; renderApp();
        requestAnimationFrame(() => { const scrollArea = document.getElementById('editor-scroll-area'); if(scrollArea) scrollArea.scrollTop = 0; });
      }
    }

    function openPreview() { activeView = 'preview'; fitPreviewWidth(); renderApp(); }
    function closePreview() { activeView = 'editor'; isNavigating = true; renderApp(); }

    function fitPreviewWidth() {
      const container = document.getElementById('preview-viewport-container');
      const w = container ? container.clientWidth - 16 : window.innerWidth - 16;
      previewZoom = Number(Math.max(0.35, Math.min(1.1, w / 794)).toFixed(2));
      if (activeView === 'preview') renderApp();
    }

    function handleDirectPrint() { triggerPrint(); }
    function openResetDialog() { const m = document.getElementById('reset-modal'); if (m) { m.classList.remove('hidden'); m.classList.add('flex'); } }
    function closeResetDialog() { const m = document.getElementById('reset-modal'); if (m) { m.classList.add('hidden'); m.classList.remove('flex'); } }
    
    function confirmReset() { 
        cvData = JSON.parse(JSON.stringify(defaultCVData)); 
        appStarted = false; 
        currentPage = 1; 
        activeView = 'editor'; 
        currentCvId = null; 
        localStorage.removeItem('techasar_current_cv_id'); 
        saveState(); 
        closeResetDialog(); 
        const container = document.getElementById('main-view-container'); 
        if(container) container.innerHTML = ''; 
        renderApp(); 
    }

    window.openSignatureModal = function() {
        document.getElementById('modal-date-container').innerHTML = generateCustomDateInput(cvData.footer.date, 'footer.date');
        document.getElementById('modal-place-input').value = cvData.footer.place || '';
        document.getElementById('modal-sign-input').value = cvData.footer.signName || '';
        
        const m = document.getElementById('signature-modal');
        const b = document.getElementById('signature-box');
        m.classList.remove('hidden'); 
        m.classList.add('flex');
        
        requestAnimationFrame(() => { 
            m.classList.remove('opacity-0'); 
            b.classList.remove('scale-75', 'opacity-0'); 
            b.classList.add('scale-100', 'opacity-100'); 
        });
    }

    window.closeSignatureModal = function() {
        const m = document.getElementById('signature-modal');
        const b = document.getElementById('signature-box');
        
        m.classList.add('opacity-0'); 
        b.classList.remove('scale-100', 'opacity-100'); 
        b.classList.add('scale-75', 'opacity-0');
        
        setTimeout(() => { 
            m.classList.remove('flex'); 
            m.classList.add('hidden'); 
        }, 300);
    }

    window.saveSignatureDetails = function() {
        cvData.footer.place = document.getElementById('modal-place-input').value;
        cvData.footer.signName = document.getElementById('modal-sign-input').value;
        saveState(); 
        closeSignatureModal();
        renderApp(); 
    }

    window.addEventListener('resize', () => { if (activeView === 'preview') fitPreviewWidth(); });
    document.addEventListener('DOMContentLoaded', () => { renderApp(); });
  </script>
</body>
</html>
