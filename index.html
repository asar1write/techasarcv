        const parts = path.split('.'); let current = obj;
        for (let i = 0; i < parts.length - 1; i++) { if (!current[parts[i]]) current[parts[i]] = {}; current = current[parts[i]]; }
        current[parts[parts.length - 1]] = value;

    function showUIAlert(title, msg, isConfirm = false, callback = null) {
        const tEl = document.getElementById('custom-alert-title');
        const mEl = document.getElementById('custom-alert-msg');
        if (tEl) tEl.innerText = title;
        if (mEl) mEl.innerText = msg;

        const modal = document.getElementById('custom-alert-modal');

    function filterGlobalDropdown(val) {
        const query = val.toUpperCase();
        const items = document.querySelectorAll('.dropdown-item');
        let hasVisible = false;
        items.forEach(el => {
            const txt = el.innerText.toUpperCase();
            if (txt.includes(query)) {
                el.style.display = 'flex';
                hasVisible = true;
            } else {
                el.style.display = 'none';
            }
        });
        
        let noRes = document.getElementById('no-results-msg');
        if (!hasVisible) {
            if (!noRes) {
                noRes = document.createElement('div');
                noRes.id = 'no-results-msg';
                noRes.className = 'text-zinc-500 text-xs text-center py-6 font-bold uppercase';
                noRes.innerText = 'NO MATCHES FOUND';
                document.getElementById('global-dropdown-list').appendChild(noRes);
            }
        } else {
            if (noRes) noRes.remove();
        }
    }

    function openGlobalDropdown(e, fieldPath, optionsStr, placeholder) {
        const rect = e.currentTarget.getBoundingClientRect();
        dropdownOriginX = (rect.left + rect.width / 2) - (window.innerWidth / 2);
        dropdownOriginY = (rect.top + rect.height / 2) - (window.innerHeight / 2);

        const options = JSON.parse(decodeURIComponent(optionsStr));
        const list = document.getElementById('global-dropdown-list');
        const currentVal = getNested(cvData, fieldPath);
        
        document.getElementById('global-dropdown-title').innerText = placeholder;
        
        const searchInput = document.getElementById('global-dropdown-search');
        if (searchInput) searchInput.value = '';

        list.innerHTML = options.map(opt => `
            <div onclick="selectGlobalDropdown('${fieldPath}', '${opt.val}', '${opt.label}')" class="dropdown-item px-4 py-3 rounded-xl text-[13px] font-bold uppercase cursor-pointer transition-all flex items-center justify-between ${currentVal === opt.val ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'hover:bg-zinc-800/80 text-zinc-300 bg-zinc-900/30'}">
                <span>${opt.label}</span>
                ${currentVal === opt.val ? `<svg class="w-4 h-4 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>` : ''}
            </div>
        `).join('');

        const modal = document.getElementById('global-dropdown-modal');
        const box = document.getElementById('global-dropdown-box');
        
        modal.style.height = window.innerHeight + 'px';
        document.body.style.overflow = 'hidden';
        
        box.style.transition = 'none';
        modal.style.transition = 'none';
        box.style.transform = `translate(${dropdownOriginX}px, ${dropdownOriginY}px) scale(0)`;
        box.style.opacity = '0';
        modal.style.opacity = '0';

        modal.classList.remove('hidden');
        modal.classList.add('flex', 'items-center', 'justify-center'); 
        
        requestAnimationFrame(() => {
            box.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease';
            modal.style.transition = 'opacity 0.35s ease';
            
            box.style.transform = `translate(0px, 0px) scale(1)`;
            box.style.opacity = '1';
            modal.style.opacity = '1';
        });
    }

    function closeGlobalDropdown(e, force = false) {
        if (!force && e && e.target.id !== 'global-dropdown-modal') return; 
        
        const modal = document.getElementById('global-dropdown-modal');
        const box = document.getElementById('global-dropdown-box');
        
        box.style.transform = `translate(${dropdownOriginX}px, ${dropdownOriginY}px) scale(0)`;
        box.style.opacity = '0';
        modal.style.opacity = '0';
        
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'items-center', 'justify-center');
            modal.style.height = '';
            document.body.style.overflow = '';
        }, 320); 
    }

    function selectGlobalDropdown(fieldPath, val, label) {
        setNested(cvData, fieldPath, val);
        let needsReRender = false;
        
        if (fieldPath === 'personal.state') {
            cvData.personal.district = '';
            cvData.personal.tehsil = '';
            needsReRender = true;
        } else if (fieldPath === 'personal.district') {
            cvData.personal.tehsil = '';
            needsReRender = true;
        } else if (fieldPath === 'personal.tehsil' || fieldPath === 'details.nationality') {
            needsReRender = true;
        }
        
        saveState(); 
        closeGlobalDropdown(null, true);

        if (needsReRender && activeView === 'editor') {
            isNavigating = false;
            const scrollArea = document.getElementById('editor-scroll-area');
            const exactScroll = scrollArea ? scrollArea.scrollTop : 0;
            
            setTimeout(() => { 
                renderApp(); 
                const newScroll = document.getElementById('editor-scroll-area');
                if (newScroll) {
                    newScroll.style.scrollBehavior = 'auto';
                    newScroll.scrollTop = exactScroll;
                    setTimeout(() => { newScroll.style.scrollBehavior = 'smooth'; }, 50);
                }
            }, 320); 
        } else {
            const btnId = 'dd-btn-' + fieldPath.replace('.', '-');
            const btn = document.getElementById(btnId);
            if (btn) btn.innerText = label;
        }
    }

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cvData));
        if (currentCvId) localStorage.setItem('techasar_current_cv_id', currentCvId);

        if (currentUser && currentCvId && window.db) {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    const title = cvData.personal.name.trim().toUpperCase() || "UNTITLED CV";
                    const historyItem = { 
                        id: currentCvId, name: title, data: cvData, 
                        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                        timestamp: Date.now()
                    };
                    const cvRef = window.doc(window.db, `users/${currentUser.uid}/cvs`, currentCvId);
                    await window.setDoc(cvRef, historyItem);
                } catch(e) {}

    function processPassportPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Failed to read image"));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image"));
          img.onload = () => {
            const targetW = 413, targetH = 531;
            const targetAspect = targetW / targetH;
            const srcW = img.naturalWidth || img.width;
            const srcH = img.naturalHeight || img.height;
            let sx = 0, sy = 0, sw = srcW, sh = srcH;
            if (srcW / srcH > targetAspect) { sw = srcH * targetAspect; sx = (srcW - sw) / 2; } 
            else { sh = srcW / targetAspect; sy = Math.max(0, (srcH - sh) * 0.22); }
            const canvas = document.createElement('canvas');
            canvas.width = targetW; canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return resolve(ev.target.result);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, targetW, targetH);
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
            resolve(canvas.toDataURL('image/jpeg', 0.92));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatText(str, tCase) {
      if (!str) return '';
      let cleanStr = escapeHtml(str);
      if (tCase === 'capitalize') {
          return cleanStr.toLowerCase().replace(/(^\w|\s\w)/g, m => m.toUpperCase());
      }
      return cleanStr.toUpperCase();
    }

    function renderPrintNode() {
      const container = document.getElementById('cv-print-container');
      if (container) { container.innerHTML = getDocumentHTML('cv-actual-print-node', true); }
    }

    function renderApp() {
      const container = document.getElementById('main-view-container');
      if (!container) return;

      // Always clear any lingering exit animations that could cause a black screen
      container.classList.remove('elegant-exit');

      const scrollArea = document.getElementById('editor-scroll-area');
      const currentScroll = scrollArea ? scrollArea.scrollTop : 0;

      if (!appStarted) {
        renderWelcomeScreen(container);
        return;
      }

      if (activeView === 'preview') {
        renderPreviewView(container);
      } else {
        renderEditorView(container);
      }
      
      if (!isNavigating && !enteringEditor) {
        requestAnimationFrame(() => {
          const newScroll = document.getElementById('editor-scroll-area');
          if (newScroll) newScroll.scrollTop = currentScroll;
        });
      }
      isNavigating = false;
    }

    function goToHome() {
      const container = document.getElementById('main-view-container');
      if (container) container.classList.add('elegant-exit');
      setTimeout(() => {
        appStarted = false;
        enteringEditor = false;
        isNavigating = true;
        renderApp();
      }, 250);
    }

    async function renderHistoryList() {

        return;
      }

      try {
          const querySnapshot = await window.getDocs(window.collection(window.db, `users/${currentUser.uid}/cvs`));
          let hist = [];
          querySnapshot.forEach((doc) => { hist.push(doc.data()); });

            container.innerHTML = '<div class="text-zinc-500 text-sm text-center py-8 font-bold uppercase">NO CVS FOUND IN HISTORY.</div>';
            return;
          }
          
          container.innerHTML = hist.map(h => `

              <div class="flex flex-col flex-1 min-w-0 cursor-pointer py-1" onclick="loadCVFromHistory(event, '${h.id}')">

                </button>

    async function loadCVFromHistory(e, id) {
      if (e) e.stopPropagation();
      if (!currentUser || !window.db) return;
      try {
          const docSnap = await window.getDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
          if (docSnap.exists()){
             cvData = JSON.parse(JSON.stringify(docSnap.data().data));
             currentCvId = id;
             localStorage.setItem('techasar_current_cv_id', currentCvId);
             saveState();
             closeHistory();
             appStarted = true;
             enteringEditor = true;
             isNavigating = true;
             currentPage = 1;
             activeView = 'editor';
             renderApp();
          }
      } catch(e) {}
    }

    async function printFromHistory(e, id) {
      if (e) e.stopPropagation();
      if (!currentUser || !window.db) return;
      
      const btn = e.currentTarget;
      const ogHTML = btn.innerHTML;
      btn.innerHTML = `<div class="w-3.5 h-3.5 border-[2px] border-white/30 border-t-white rounded-full animate-spin"></div>`;
      
      try {
          const docSnap = await window.getDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
          if (docSnap.exists()){
             const tempOldData = cvData;
             cvData = JSON.parse(JSON.stringify(docSnap.data().data));
             
             cvData.personal = cvData.personal || {};
             cvData.details = cvData.details || {};
             cvData.footer = cvData.footer || {};
             
             requestAnimationFrame(() => {
                 triggerPrint(() => {
                    cvData = tempOldData;
                    if (activeView === 'preview') renderApp();
                 });
             });
          }
      } catch(err) {
          showUIAlert("ERROR", "Failed to load CV for printing.", false);
      }
      btn.innerHTML = ogHTML;
    }

    function deleteFromHistory(e, id) {
        if (e) e.stopPropagation();
        showUIAlert("DELETE CV?", "ARE YOU SURE YOU WANT TO DELETE THIS CV FROM HISTORY?", true, async (res) => {
            if (res) {
                try {
                    await window.deleteDoc(window.doc(window.db, `users/${currentUser.uid}/cvs`, id));
                    if (currentCvId === id) {
                      cvData = JSON.parse(JSON.stringify(defaultCVData));
                      currentCvId = null;
                      localStorage.removeItem('techasar_current_cv_id');
                      saveState();
                    }
                    renderHistoryList();
                } catch(e) {}
            }
        });
    }

                <button type="button" onclick="appendHobby('EDITING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-xl bg-[#131320] border border-zinc-800 text-zinc-300 hover:border-zinc-700 active:scale-95 transition-all">+ EDITING</button>
                <button type="button" onclick="appendHobby('READING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-xl bg-[#131320] border border-zinc-800 text-zinc-300 hover:border-zinc-700 active:scale-95 transition-all">+ READING</button>
                <button type="button" onclick="appendHobby('TRAVELING')" class="text-[11px] font-bold uppercase px-2.5 py-1.5 rounded-xl bg-[#131320] border border-zinc-800 text-zinc-300 hover:border-zinc-700 active:scale-95 transition-all">+ TRAVELING</button>
              </div>
            </div>
          </div>
        `;
      } else if (currentPage === 7) {
        stepContentHTML = `
          <div class="space-y-3">
            <div class="w-full bg-[#131320] border border-zinc-800/90 focus-within:border-indigo-500/80 focus-within:ring-1 focus-within:ring-indigo-500/30 rounded-2xl p-3.5 transition-all group">
              <span class="block text-[10px] font-bold text-zinc-400 tracking-wider uppercase mb-1.5 group-focus-within:text-indigo-400 transition-colors pointer-events-none">DECLARATION STATEMENT</span>
              <textarea id="declaration-input" rows="4" oninput="cvData.declaration = this.value; saveState(); autoResizeTextarea(this);" placeholder="WRITE YOUR DECLARATION HERE..." class="uppercase w-full min-h-[105px] bg-transparent border-none text-[14px] sm:text-sm text-zinc-100 font-bold outline-none leading-relaxed resize-none p-0 placeholder:text-zinc-600">${escapeHtml(cvData.declaration)}</textarea>
            </div>
            <div class="pt-1">
              <span class="text-[10px] font-bold text-zinc-400 tracking-wider block mb-1.5 uppercase px-1">QUICK TEMPLATE</span>
              <button type="button" onclick="setDeclarationPreset('I HEREBY DECLARE THAT ALL THE INFORMATION MENTIONED ABOVE IS TRUE TO THE BEST OF MY KNOWLEDGE. IF YOU GIVE ME A CHANCE, I ASSURE MY HARD WORK, DEDICATION AND SINCERITY')" class="w-full text-left text-[11.5px] font-bold bg-[#131320] hover:bg-[#18182a] p-3 rounded-2xl border border-zinc-800/80 text-zinc-300 uppercase active:scale-[0.99] transition-all">"I HEREBY DECLARE THAT ALL THE INFORMATION..."</button>
            </div>
          </div>
        `;
      } else if (currentPage === 8) {
        let dateInputVal = '';
        if (cvData.footer.date && cvData.footer.date.includes('/')) {
            const parts = cvData.footer.date.split('/');
            if (parts.length === 3) dateInputVal = `${parts[2]}-${parts}-${parts[0]}`;
        } else { dateInputVal = cvData.footer.date || ''; }

        stepContentHTML = `
          <div class="space-y-3">
            <div class="w-full bg-[#131320] border border-zinc-800/90 focus-within:border-indigo-500/80 focus-within:ring-1 focus-within:ring-indigo-500/30 rounded-2xl px-3.5 py-2 transition-all group">
              <span class="block text-[10px] font-bold text-zinc-400 tracking-wider uppercase mb-0.5 group-focus-within:text-indigo-400 transition-colors pointer-events-none">DATE</span>
              <div class="date-wrapper">
                <input type="date" value="${dateInputVal}" oninput="const d = this.value; if(d){ const parts = d.split('-'); cvData.footer.date = parts[2]+'/'+parts+'/'+parts[0]; } else { cvData.footer.date = ''; } saveState();" class="uppercase w-full bg-transparent border-none text-[15px] sm:text-sm text-zinc-100 font-bold outline-none p-0" />
              </div>
            </div>

            ${createTextInput('PLACE', cvData.footer.place, 'cvData.footer.place = this.value; saveState();')}
            ${createTextInput('SIGNATURE NAME', cvData.footer.signName, 'cvData.footer.signName = this.value; saveState();')}
          </div>
        `;
      } else if (currentPage === 9) {
        stepContentHTML = `
          <div class="space-y-3">
            ${createCustomDropdown('documentTitle', [{label: 'CURRICULUM VITAE', val: 'CURRICULUM VITAE'}, {label: 'RESUME', val: 'RESUME'}], 'DOCUMENT TITLE', 'SELECT TITLE')}
            ${createCustomDropdown('font', [{label: 'TIMES NEW ROMAN', val: 'Times New Roman'}, {label: 'ARIAL', val: 'Arial'}, {label: 'CALIBRI', val: 'Calibri'}, {label: 'ALGERIAN', val: 'Algerian'}], 'DOCUMENT FONT', 'SELECT FONT')}
            ${createCustomDropdown('fontWeight', [{label: 'BOLD TEXT', val: 'bold'}, {label: 'NORMAL TEXT', val: 'normal'}], 'TEXT WEIGHT', 'SELECT TEXT WEIGHT')}
            ${createCustomDropdown('textCase', [{label: 'UPPERCASE (ALL CAPITAL)', val: 'uppercase'}, {label: 'PROPER CASE (FIRST LETTER CAPITAL)', val: 'capitalize'}], 'TEXT CASE', 'SELECT TEXT CASE')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden relative">
          <!-- Clean Transparent Header (No Background Card, Only Icon Toggles) -->
          <div class="h-14 px-4 flex items-center justify-between shrink-0 sticky top-0 z-30 bg-transparent">
            <button type="button" onclick="goToHome()" title="HOME" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-400 hover:text-white bg-zinc-900/40 hover:bg-zinc-800/60 border border-zinc-800/60 backdrop-blur-sm active:scale-90 transition-all">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <div class="px-3.5 py-1 rounded-full bg-zinc-900/50 border border-zinc-800/80 backdrop-blur-sm shadow-sm">
              <span class="text-xs font-black text-zinc-200 tracking-wider">STEP ${currentPage}/${TOTAL_STEPS}</span>
            </div>
            <button type="button" onclick="openResetDialog()" title="RESET CV" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-400 hover:text-red-400 bg-zinc-900/40 hover:bg-zinc-800/60 border border-zinc-800/60 backdrop-blur-sm active:scale-90 transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>
            </button>
          </div>
          
          <div id="editor-scroll-area" class="flex-1 overflow-y-auto px-4 py-3 pb-28 w-full overflow-x-hidden relative scroll-smooth bg-[#08080e]">
            <div class="${animClass} w-full max-w-lg mx-auto">${stepContentHTML}</div>
          </div>

          <!-- Clean Floating Bottom Icon Bar (No Background Card, Only Icon Toggles) -->
          <div class="absolute bottom-4 left-0 right-0 z-30 pointer-events-none flex justify-center items-center pb-[max(0px,env(safe-area-inset-bottom))]">
            <div class="pointer-events-auto flex items-center justify-between px-6 max-w-xs w-full">
              <button type="button" ${currentPage === 1 ? 'disabled' : ''} onclick="goPrevStep()" title="PREVIOUS STEP" class="w-12 h-12 rounded-full flex items-center justify-center bg-[#141422]/90 border border-zinc-700/80 text-zinc-300 hover:text-white disabled:opacity-20 disabled:pointer-events-none active:scale-90 transition-all shadow-xl backdrop-blur-md">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6" /></svg>
              </button>
              <button type="button" onclick="openPreview()" title="PREVIEW CV" class="w-14 h-14 rounded-full flex items-center justify-center bg-[#18182a]/95 border border-zinc-600/90 text-emerald-400 hover:text-emerald-300 active:scale-90 transition-all shadow-2xl shadow-emerald-500/10 backdrop-blur-md">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              </button>
              <button type="button" onclick="goNextStep()" title="${currentPage === TOTAL_STEPS ? 'REVIEW CV' : 'NEXT STEP'}" class="w-12 h-12 rounded-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white active:scale-90 transition-all shadow-xl shadow-indigo-600/40 backdrop-blur-md">
                ${currentPage === TOTAL_STEPS 
                  ? '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12" /></svg>'
                  : '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6" /></svg>'
                }
              </button>
            </div>
          </div>
        </div>
      `;

      requestAnimationFrame(() => { container.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el)); });
    }

    function renderPreviewView(container) {
      container.classList.remove('elegant-exit');

      const scaledW = Math.round(794 * previewZoom);
      const scaledH = Math.round(1123 * previewZoom);

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden bg-[#06060a] elegant-entry relative">
          <!-- Transparent Header in Preview (No Background Card) -->
          <div class="h-14 px-4 flex items-center justify-between shrink-0 bg-transparent z-20">
            <button type="button" onclick="closePreview()" title="BACK TO EDIT" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-300 hover:text-white bg-zinc-900/60 border border-zinc-800 backdrop-blur-md active:scale-90 transition-all">
              <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg>
            </button>
            <div class="flex items-center gap-1.5 bg-zinc-900/60 border border-zinc-800/80 backdrop-blur-md px-2 py-1 rounded-full">
              <button type="button" onclick="zoomPreview(-0.1)" class="w-7 h-7 flex items-center justify-center text-zinc-400 active:scale-90"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg></button>
              <span class="text-[11px] font-bold text-zinc-300 min-w-8 text-center tabular-nums">${Math.round(previewZoom * 100)}%</span>
              <button type="button" onclick="zoomPreview(0.1)" class="w-7 h-7 flex items-center justify-center text-zinc-400 active:scale-90"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="8" y1="11" x2="14" y2="11" /></svg></button>
              <button type="button" onclick="fitPreviewWidth()" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase text-indigo-400 bg-indigo-500/15 active:scale-90">FIT</button>
            </div>
            <button type="button" onclick="handleDirectPrint()" title="PRINT CV" class="w-10 h-10 flex items-center justify-center rounded-full text-emerald-400 bg-emerald-500/15 border border-emerald-500/30 backdrop-blur-md active:scale-90 transition-all">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
            </button>
          </div>

          <div id="preview-viewport-container" class="flex-1 overflow-y-auto overflow-x-auto p-2 sm:p-6 pb-24 flex flex-col items-center relative" style="background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px), linear-gradient(to bottom, #090a10, #040407); background-size: 20px 20px, 100% 100%;">
            <div class="relative my-auto shrink-0 bg-white zoom-transition" style="width: ${scaledW}px; height: ${scaledH}px; min-height: ${scaledH}px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 15px 35px -5px rgba(0, 0, 0, 0.85);">
              <div style="width: 794px; min-height: 1123px; transform: scale(${previewZoom}); transform-origin: top left; position: absolute; top: 0; left: 0;" class="zoom-transition">
                ${getDocumentHTML('cv-screen-preview-node', false)}
              </div>
            </div>
          </div>

          <!-- Clean Floating Bottom Icon Bar in Preview (No Background Card) -->
          <div class="absolute bottom-4 left-0 right-0 z-30 pointer-events-none flex justify-center items-center pb-[max(0px,env(safe-area-inset-bottom))]">
            <div class="pointer-events-auto flex items-center justify-between px-6 max-w-xs w-full">
              <button type="button" onclick="closePreview()" title="EDIT DETAILS" class="w-12 h-12 rounded-full flex items-center justify-center bg-[#141422]/90 border border-zinc-700/80 text-zinc-300 hover:text-white active:scale-90 transition-all shadow-xl backdrop-blur-md">
                <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
              </button>
              <button type="button" onclick="handleDirectPrint()" title="PRINT CV" class="w-14 h-14 rounded-full flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 text-white active:scale-90 transition-all shadow-2xl shadow-emerald-600/40 backdrop-blur-md">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function goNextStep() {
      if (currentPage < TOTAL_STEPS) {
        animDirection = 'next';
        currentPage++;
        isNavigating = true;
        renderApp();
      } else {
        openPreview();
      }
    }

    function goPrevStep() {
      if (currentPage > 1) {
        animDirection = 'prev';
        currentPage--;
        isNavigating = true;
        renderApp();
      }
    }

    function openPreview() {
      activeView = 'preview';
      fitPreviewWidth();
      renderApp();
    }

    function closePreview() {
      activeView = 'editor';
      isNavigating = true;
      renderApp();
    }

    function fitPreviewWidth() {
      const container = document.getElementById('preview-viewport-container');
      const w = container ? container.clientWidth - 16 : window.innerWidth - 16;
      previewZoom = Number(Math.max(0.35, Math.min(1.1, w / 794)).toFixed(2));
      if (activeView === 'preview') renderApp();
    }

    function zoomPreview(delta) {
      previewZoom = Number(Math.max(0.35, Math.min(1.4, previewZoom + delta)).toFixed(2));
      renderApp();
    }

    function handleDirectPrint() {
      triggerPrint();
    }

    function openResetDialog() {
      const m = document.getElementById('reset-modal');
      if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
    }

    function closeResetDialog() {
      const m = document.getElementById('reset-modal');
      if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
    }

    function confirmReset() {
      cvData = JSON.parse(JSON.stringify(defaultCVData));
      appStarted = false; 
      currentPage = 1;
      activeView = 'editor';
      currentCvId = null;
      localStorage.removeItem('techasar_current_cv_id');
      saveState();
      closeResetDialog();
      renderApp();
    }

    window.addEventListener('resize', () => { if (activeView === 'preview') fitPreviewWidth(); });

    // Safe, instant initialization (Prevents blank/black screen on loaded DOM)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => { renderApp(); });
    } else {
      renderApp();
    }

    // Safety fallback timer to guarantee initial view is painted
    setTimeout(() => {
      const container = document.getElementById('main-view-container');
      if (container && (!container.innerHTML || container.innerHTML.trim() === '')) {
        renderApp();
      }
    }, 80);
  </script>
</body>
</html>
