<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Algerian & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    @font-face {
      font-family: 'Algerian';
      font-style: normal;
      font-weight: 400;
      src: local('Algerian'), url('https://fonts.cdnfonts.com/s/137771/vertopal.com_vertopal.com_ALGER.woff') format('woff');
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Page Lock: Prevent page shifting up when keyboard opens */
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    * {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar,
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }

    .font-algerian {
      font-family: 'Algerian', 'Times New Roman', serif !important;
    }

    /* GLOBAL APP UI STYLES (Capital and Bold) */
    #app-root, #picker-modal, #step-modal, #app-toast {
      text-transform: uppercase;
    }
    #app-root input, #app-root textarea, #app-root select, #app-root button,
    #picker-modal input, #picker-modal button, #step-modal button {
      font-weight: 700 !important;
      text-transform: uppercase;
    }
    #app-root input::placeholder, #app-root textarea::placeholder, #picker-modal input::placeholder {
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.7;
    }

    /* ULTRA-SMOOTH SPRING ANIMATIONS */
    @keyframes slideInRightSmooth {
      0% { opacity: 0; transform: translate3d(35px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes slideInLeftSmooth {
      0% { opacity: 0; transform: translate3d(-35px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes popInOrigin {
      0% { opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.3); }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes popOutOrigin {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.3); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .anim-next { animation: slideInRightSmooth 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; }
    .anim-prev { animation: slideInLeftSmooth 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; }
    .anim-none { animation: none !important; }
    .anim-pop-in-origin { animation: popInOrigin 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: transform, opacity; }
    .anim-pop-out-origin { animation: popOutOrigin 0.25s cubic-bezier(0.3, 0, 0.8, 0.2) forwards; will-change: transform, opacity; }
    .anim-fade { animation: fadeIn 0.25s ease-out forwards; }

    /* Compact No-Scroll layout specifically for Step 1 */
    .step-1-noscroll {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
    }

    /* Print Setup */
    #cv-print-container { display: none; }
    @media print {
      @page { size: A4 portrait; margin: 0mm !important; }
      html, body {
        position: static; overflow: visible;
        width: 210mm !important; height: 297mm !important; margin: 0 !important;
        padding: 0 !important; background: #ffffff !important; color: #000000 !important;
      }
      #app-root, .no-print, #picker-modal, #step-modal, #app-toast { display: none !important; }
      #cv-print-container {
        display: block !important; position: static !important;
        width: 210mm !important; height: 297mm !important;
        padding: 4mm !important; background: #ffffff !important;
      }
      #cv-print-container * { text-transform: none; }
    }
  </style>
</head>

    function getDistricts(state) {
      if (state === "Uttar Pradesh") return upDistricts;
      return []; 
    }
    function getTehsils(state, dist) {
      if (state === "Uttar Pradesh" && upTehsils[dist]) return upTehsils[dist];
      return [];
    }

      id: null, lastModified: null, font: "Times New Roman",
      personal: { photo: "", name: "", villagePost: "", state: "", district: "", tehsil: "", mobile: "", email: "", headerStyle: "labeled" },

      experience: ["Fresher"],

      footer: { date: "", place: "", signName: "" }
    };

    let appState = { view: 'home', cvData: null, currentPage: 1, animDirection: 'next', previewZoom: 0.46, pickerType: '', pickerOptions: [] };

    let toastTimeout;
    // iOS Style Smooth Toast Animation
    function showToast(msg) {
      const toast = document.getElementById('app-toast');
      document.getElementById('app-toast-msg').innerText = msg;
      toast.style.transform = 'translate(-50%, 20px)';
      toast.style.opacity = '1';
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { 
        toast.style.transform = 'translate(-50%, -150%)';
        toast.style.opacity = '0';
      }, 2500);
    }

    // Auto-Resize Textarea Handler
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    }

    function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; } }
    
    function saveSilently() {
      if(!appState.cvData) return;
      appState.cvData.lastModified = Date.now();
      const history = getHistory();
      const idx = history.findIndex(x => x.id === appState.cvData.id);
      if (idx >= 0) history[idx] = appState.cvData; else history.push(appState.cvData);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderPrintNode();
    }

    function saveAndRender() { 
      appState.animDirection = 'none'; 
      saveSilently(); 
      renderApp(); 
    }

    function updatePers(k, v) { appState.cvData.personal[k] = v; saveSilently(); }
    function updateDet(k, v) { appState.cvData.details[k] = v; saveSilently(); }
    function updateArr(key, idx, val) { appState.cvData[key][idx] = val; saveSilently(); }

    function setView(view, anim = 'fade') {
      appState.view = view;
      if(view === 'editor' && !appState.cvData) {
        appState.cvData = JSON.parse(JSON.stringify(defaultCVData));
        appState.cvData.id = 'cv_' + Date.now();
        appState.currentPage = 1;
        appState.animDirection = 'next';
      }
      renderApp();
    }

    function editCV(id) {
      const history = getHistory();
      const cv = history.find(x => x.id === id);
      if(cv) { appState.cvData = JSON.parse(JSON.stringify(cv)); appState.currentPage = 1; appState.animDirection = 'next'; setView('editor'); }
    }

    function resetCurrentCV() {
      const currentId = appState.cvData.id;
      appState.cvData = JSON.parse(JSON.stringify(defaultCVData));
      appState.cvData.id = currentId;
      saveAndRender();
      showToast("CV RESET TO DEFAULT");
    }

    function deleteFromHistory(id) {
      let history = getHistory(); history = history.filter(x => x.id !== id);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); renderApp();
      showToast("CV DELETED");
    }

      const root = document.getElementById('app-root');
      if(appState.view === 'home') root.innerHTML = getHomeHTML();
      else if(appState.view === 'history') root.innerHTML = getHistoryHTML();
      else if(appState.view === 'editor') root.innerHTML = getEditorHTML();
      else if(appState.view === 'preview') root.innerHTML = getPreviewHTML();
      if(appState.view === 'editor' || appState.view === 'preview') renderPrintNode();

      // Ensure all textareas format their height correctly on step load
      setTimeout(() => { document.querySelectorAll('textarea').forEach(el => autoResize(el)); }, 20);

    function getHomeHTML() {
      return `

                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

              </div>
              <h1 class="text-3xl font-black text-white tracking-tight uppercase">TECH ASAR CV</h1>
              <p class="text-sm text-zinc-400 uppercase font-bold">PROFESSIONAL CV BUILDER</p>
            </div>

              <button onclick="appState.cvData=null; setView('editor')" class="w-full py-4 rounded-full bg-indigo-600 text-white font-bold text-lg shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 active:scale-95 transition-all flex items-center justify-center gap-2 uppercase">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                CREATE NEW CV
              </button>
              <button onclick="setView('history')" class="w-full py-4 rounded-full border border-zinc-700 text-white font-bold text-lg hover:bg-zinc-800 active:scale-95 transition-all flex items-center justify-center gap-2 uppercase bg-transparent">

          const date = new Date(cv.lastModified).toLocaleDateString('en-GB');
          const name = cv.personal.name || "UNTITLED CV";
          return `
            <div class="bg-transparent border border-zinc-800 rounded-2xl p-4 flex items-center justify-between mb-3 shadow-sm">
              <div class="flex-1 min-w-0 pr-3">

                <p class="text-xs text-zinc-500 mt-0.5 font-bold">${date}</p>

              <div class="flex items-center gap-2 shrink-0">

                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg>
                </button>
                <button onclick="deleteFromHistory('${cv.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-red-400 active:scale-90 transition-all ml-1">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      return `
        <div class="flex-1 flex flex-col bg-[#08080e] anim-next h-full overflow-hidden">
          <header class="flex items-center justify-between px-4 pt-4 pb-2 z-30 shrink-0 bg-transparent">
            <button onclick="setView('home')" class="px-4 py-2 flex items-center gap-2 bg-transparent rounded-full text-zinc-300 border border-zinc-700 active:scale-90 font-bold text-xs uppercase">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              BACK
            </button>
            <div class="px-5 py-2 bg-transparent rounded-full text-xs font-bold text-white border border-zinc-700 uppercase">
              CV HISTORY

            <div class="w-20"></div>
          </header>
          <div class="flex-1 overflow-y-auto px-4 pb-10 pt-2">
            ${listHTML}

        </div>

    function getEditorHTML() {
      const page = appState.currentPage;
      const animClass = appState.animDirection === 'next' ? 'anim-next' : 
                        appState.animDirection === 'prev' ? 'anim-prev' : 'anim-none';
      
      let stepContent = '';
      if(page === 1) stepContent = getStep1HTML();
      else if(page === 2) stepContent = getStepTextarea('objective', 'CAREER OBJECTIVE');
      else if(page === 3) stepContent = getStepArray('academic', 'ACADEMIC QUALIFICATION');
      else if(page === 4) stepContent = getStepArray('other', 'OTHER QUALIFICATION');
      else if(page === 5) stepContent = getStepArray('experience', 'WORKING EXPERIENCE');
      else if(page === 6) stepContent = getStep6HTML();
      else if(page === 7) stepContent = getStep7HTML();
      else if(page === 8) stepContent = getStep8HTML();

      return `
        <div class="flex-1 flex flex-col bg-[#08080e] h-full overflow-hidden">
          
          <header class="flex items-center justify-between px-4 pt-5 pb-3 z-30 shrink-0 bg-transparent">
            <button onclick="appState.cvData=null; setView('home')" class="px-4 py-2 flex items-center gap-1.5 bg-transparent rounded-full text-zinc-300 border border-zinc-700 active:scale-90 text-[11px] font-extrabold uppercase transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              BACK
            </button>
            <div class="px-5 py-2 bg-transparent rounded-full text-[11px] font-extrabold text-white tracking-widest border border-zinc-700 uppercase">
              STEP ${page}/8
            </div>
            <button onclick="resetCurrentCV()" class="px-4 py-2 flex items-center gap-1.5 bg-transparent rounded-full text-red-400 border border-zinc-700 active:scale-90 text-[11px] font-extrabold uppercase transition-all">
              RESET
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>
            </button>
          </header>

          <div class="flex-1 overflow-y-auto px-4 py-1 flex flex-col">
            <div class="${animClass} flex-1 ${page === 1 ? 'step-1-noscroll' : ''}">
              ${stepContent}
            </div>
          </div>

          <div class="flex items-center justify-between gap-3 px-4 pt-3 pb-6 z-30 shrink-0 bg-transparent">
            <button onmousedown="startPrevPress(event)" onmouseup="cancelPrevPress()" onmouseleave="cancelPrevPress()" ontouchstart="startPrevPress(event)" ontouchend="cancelPrevPress()" onclick="handlePrevClick()" class="flex items-center gap-1.5 px-5 py-3.5 rounded-full bg-transparent border border-zinc-700 text-zinc-200 text-xs font-bold active:scale-95 uppercase transition-all ${page === 1 ? 'opacity-0 pointer-events-none' : ''}">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              PREV
            </button>
            <button onclick="appState.animDirection='pop-in'; setView('preview')" class="flex-1 flex justify-center items-center gap-2 py-3.5 rounded-full bg-transparent border border-zinc-600 text-zinc-100 text-xs font-bold active:scale-95 uppercase transition-all">
              <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              PREVIEW
            </button>
            <button onclick="goNext()" class="flex items-center gap-1.5 px-5 py-3.5 rounded-full bg-indigo-600 border border-indigo-500 text-white text-xs font-bold active:scale-95 uppercase transition-all">
              ${page === 8 ? 'DONE' : 'NEXT'}
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    function getStep1HTML() {
      const p = appState.cvData.personal;
      return `
        <div class="flex flex-col gap-3 w-full">

          </div>

          <input type="text" value="${escapeHtml(p.name)}" oninput="updatePers('name', this.value)" placeholder="FULL NAME *" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-500 font-bold uppercase" />
          <input type="tel" value="${escapeHtml(p.mobile)}" oninput="updatePers('mobile', this.value)" placeholder="MOBILE NUMBER *" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-500 font-bold uppercase" />
          <input type="email" value="${escapeHtml(p.email)}" oninput="updatePers('email', this.value)" placeholder="EMAIL ADDRESS" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-500 font-bold uppercase" />
          <input type="text" value="${escapeHtml(p.villagePost)}" oninput="updatePers('villagePost', this.value)" placeholder="ADDRESS (MOHALLA / VILLAGE & POST)" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-500 font-bold uppercase" />

          <div onclick="openLocationPicker(event, 'state')" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 flex items-center justify-between cursor-pointer font-bold uppercase ${p.state ? 'text-zinc-100' : 'text-zinc-500'}">
            <span id="display-state" class="truncate">${p.state || 'SELECT STATE'}</span> <svg class="w-4 h-4 shrink-0 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
          <div onclick="openLocationPicker(event, 'district')" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 flex items-center justify-between cursor-pointer font-bold uppercase ${p.district ? 'text-zinc-100' : 'text-zinc-500'}">
            <span id="display-district" class="truncate">${p.district || 'SELECT DISTRICT'}</span> <svg class="w-4 h-4 shrink-0 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
          <div onclick="openLocationPicker(event, 'tehsil')" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 flex items-center justify-between cursor-pointer font-bold uppercase ${p.tehsil ? 'text-zinc-100' : 'text-zinc-500'}">
            <span id="display-tehsil" class="truncate">${p.tehsil || 'SELECT TEHSIL'}</span> <svg class="w-4 h-4 shrink-0 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      `;
    }

    function getStepTextarea(key, title) {
      return `
        <div class="flex flex-col gap-3 w-full">
          <h3 class="text-[13px] font-bold uppercase tracking-wider text-zinc-300 ml-1">${title}</h3>
          <!-- Auto-resizing textarea to prevent hiding or cut off text -->
          <textarea rows="1" oninput="autoResize(this); appState.cvData['${key}']=this.value; saveSilently();" placeholder="ENTER ${title}..." class="w-full bg-transparent border border-zinc-700 rounded-xl p-4 text-sm text-zinc-100 outline-none focus:border-indigo-500 font-bold uppercase leading-relaxed resize-none overflow-hidden" style="min-height: 52px;">${escapeHtml(appState.cvData[key])}</textarea>
        </div>
      `;
    }

    function getStepArray(key, title) {
      const arr = appState.cvData[key] || [];
      const items = arr.map((val, i) => `
        <div class="flex items-center gap-2 bg-transparent p-2.5 rounded-xl border border-zinc-700">
          <span class="w-6 h-6 rounded border border-zinc-600 text-zinc-400 text-xs font-bold flex items-center justify-center shrink-0">${i+1}</span>
          <!-- Auto-resizing textarea mimicking a single line to prevent text cut off -->
          <textarea rows="1" oninput="autoResize(this); updateArr('${key}', ${i}, this.value)" class="flex-1 bg-transparent border-none text-sm text-zinc-100 outline-none px-1.5 font-bold uppercase resize-none overflow-hidden" style="min-height: 24px;">${escapeHtml(val)}</textarea>
          <button onclick="appState.cvData['${key}'].splice(${i},1); saveAndRender();" class="p-2 text-zinc-500 hover:text-red-400"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
        </div>

          <div class="flex items-center justify-between ml-1 mb-1">
            <h3 class="text-[13px] font-bold uppercase tracking-wider text-zinc-300">${title}</h3>

              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> ADD

          <div class="flex flex-col gap-3">${items}</div>

          <textarea rows="1" oninput="autoResize(this); updateDet('father', this.value)" placeholder="FATHER'S NAME" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-500 font-bold uppercase resize-none overflow-hidden">${escapeHtml(d.father)}</textarea>
          <div class="grid grid-cols-2 gap-3">

          <div onclick="openLocationPicker(event, 'nationality')" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 flex items-center justify-between cursor-pointer font-bold uppercase ${d.nationality ? 'text-zinc-100' : 'text-zinc-500'}">
            <span id="display-nationality" class="truncate">${d.nationality || 'SELECT NATIONALITY'}</span> <svg class="w-4 h-4 shrink-0 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>

          <textarea rows="1" oninput="autoResize(this); updateDet('hobbies', this.value)" placeholder="HOBBIES" class="w-full bg-transparent border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none focus:border-indigo-500 placeholder-zinc-500 font-bold uppercase resize-none overflow-hidden">${escapeHtml(d.hobbies)}</textarea>
        </div>
      `;
    }

      const cv = appState.cvData;
      return `
        <div class="flex flex-col gap-6 w-full">

    // Prev Button Long Press Logic
    let prevPressTimer;
    let isPrevLongPress = false;
    let prevEventTrigger;

    function startPrevPress(e) {
      isPrevLongPress = false;
      prevEventTrigger = e;
      prevPressTimer = setTimeout(() => {
        isPrevLongPress = true;
        openStepSelector(prevEventTrigger);
      }, 500);
    }
    
    function cancelPrevPress() {
      clearTimeout(prevPressTimer);
    }

    function handlePrevClick() {
      if(!isPrevLongPress) goPrev();
    }

    // Step Selector Popup (Long press PREV)
    function openStepSelector(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const modal = document.getElementById('step-modal');
      const backdrop = document.getElementById('step-backdrop');
      const box = document.getElementById('step-box');
      
      box.style.setProperty('--tx', `${clickX - centerX}px`);
      box.style.setProperty('--ty', `${clickY - centerY}px`);
      
      let html = '';
      for(let i=1; i<=8; i++) {
         html += `<button onclick="goToStep(${i})" class="w-full text-left px-5 py-3 rounded-xl ${appState.currentPage === i ? 'bg-indigo-600 text-white border-indigo-500' : 'hover:bg-[#181826] text-zinc-200 border-zinc-700'} active:scale-[0.98] transition-all font-bold uppercase tracking-wide mb-2 border shadow-sm">STEP ${i}</button>`;
      }
      document.getElementById('step-list').innerHTML = html;
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      void modal.offsetWidth; 
      
      backdrop.classList.add('opacity-100');
      box.classList.remove('anim-pop-out-origin');
      box.classList.add('anim-pop-in-origin');
    }

    function closeStepSelector() {
      const backdrop = document.getElementById('step-backdrop');
      const box = document.getElementById('step-box');
      box.classList.remove('anim-pop-in-origin');
      box.classList.add('anim-pop-out-origin');
      backdrop.classList.remove('opacity-100');
      setTimeout(() => {
        const modal = document.getElementById('step-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        box.classList.remove('anim-pop-out-origin');
      }, 250);
    }

    function goToStep(step) {
      if (step === appState.currentPage) {
        closeStepSelector();
        return;
      }
      appState.animDirection = step > appState.currentPage ? 'next' : 'prev';
      appState.currentPage = step;
      closeStepSelector();
      setTimeout(() => { renderApp(); }, 250);
    }

    function openLocationPicker(e, type) {
      const p = appState.cvData.personal;
      const d = appState.cvData.details;
      let options = [];

      if(type === 'state') options = indianStates;
      else if (type === 'district') {
        if(!p.state) return showToast("PLEASE SELECT A STATE FIRST!");
        options = getDistricts(p.state);
      } else if (type === 'tehsil') {
        if(!p.district) return showToast("PLEASE SELECT A DISTRICT FIRST!");
        options = getTehsils(p.state, p.district);
      } else if (type === 'nationality') {
        options = nationalities;
      }

      appState.pickerType = type;
      appState.pickerOptions = options;
      
      document.getElementById('picker-title').innerText = `SELECT ${type}`;
      document.getElementById('picker-search').value = '';
      
      renderPickerList(options);
      
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      
      const modal = document.getElementById('picker-modal');
      const backdrop = document.getElementById('picker-backdrop');
      const box = document.getElementById('picker-box');
      
      box.style.setProperty('--tx', `${clickX - centerX}px`);
      box.style.setProperty('--ty', `${clickY - centerY}px`);
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      
      void modal.offsetWidth; 
      
      backdrop.classList.add('opacity-100');
      box.classList.remove('anim-pop-out-origin');
      box.classList.add('anim-pop-in-origin');
    }

    function renderPickerList(options, searchStr = '') {
      const listDiv = document.getElementById('picker-list');
      
      let html = options.map(opt => `
        <button onclick="selectLocationOption('${opt.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3.5 rounded-xl hover:bg-[#181826] active:bg-zinc-800 text-sm text-zinc-200 active:scale-[0.98] transition-all font-bold uppercase tracking-wide">
          ${opt}
        </button>
      `).join('');

      if (searchStr.trim() !== '') {
        const exactMatch = options.some(o => o.toLowerCase() === searchStr.toLowerCase());
        if (!exactMatch) {
          html = `
            <button onclick="selectLocationOption('${searchStr.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3.5 rounded-xl bg-transparent border border-indigo-500 text-sm text-indigo-400 active:scale-[0.98] transition-all mb-2 flex items-center gap-2 font-bold uppercase shadow-lg">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
              USE "${searchStr}"
            </button>
          ` + html;
        }
      }

      if(!html) html = `<div class="text-zinc-500 text-xs text-center py-6 font-bold uppercase tracking-widest leading-relaxed">NOT FOUND.<br/>TYPE ABOVE TO ADD CUSTOM.</div>`;
      listDiv.innerHTML = html;
    }

    function filterPickerList(val) {
      const q = val.toLowerCase();
      const filtered = appState.pickerOptions.filter(o => o.toLowerCase().includes(q));
      renderPickerList(filtered, val);
    }

    function selectLocationOption(val) {
      const type = appState.pickerType;
      
      if (type === 'state' || type === 'district' || type === 'tehsil') {
        appState.cvData.personal[type] = val;
        if(type === 'state') { appState.cvData.personal.district=''; appState.cvData.personal.tehsil=''; }
        if(type === 'district') { appState.cvData.personal.tehsil=''; }
      } else if (type === 'nationality') {
        appState.cvData.details[type] = val;
      }
      
      saveSilently();
      
      const setVal = (id, val, placeholder) => {
        const el = document.getElementById(id);
        if(el) {
          el.innerText = val || placeholder;
          el.parentElement.className = el.parentElement.className.replace(/text-zinc-100|text-zinc-500/g, '') + (val ? ' text-zinc-100' : ' text-zinc-500');
        }
      };
      
      if (type === 'nationality') {
        setVal('display-nationality', val, 'SELECT NATIONALITY');
      } else {
        setVal('display-state', appState.cvData.personal.state, 'SELECT STATE');
        setVal('display-district', appState.cvData.personal.district, 'SELECT DISTRICT');
        setVal('display-tehsil', appState.cvData.personal.tehsil, 'SELECT TEHSIL');
      }
      
      closePicker(false);
    }

    function closePicker() {
      const backdrop = document.getElementById('picker-backdrop');
      const box = document.getElementById('picker-box');
      box.classList.remove('anim-pop-in-origin');
      box.classList.add('anim-pop-out-origin');
      backdrop.classList.remove('opacity-100');
      setTimeout(() => {
        const modal = document.getElementById('picker-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        box.classList.remove('anim-pop-out-origin');
      }, 250);
    }

    function goNext() {
      if(appState.currentPage < 8) { appState.animDirection = 'next'; appState.currentPage++; renderApp(); }
      else { appState.animDirection = 'pop-in'; setView('preview'); }
    }
    function goPrev() {
      if(appState.currentPage > 1) { appState.animDirection = 'prev'; appState.currentPage--; renderApp(); }
    }

    function onPhotoSelected(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { appState.cvData.personal.photo = ev.target.result; appState.animDirection='none'; saveAndRender(); };
      reader.readAsDataURL(file);
    }

    function closePreviewAnim() {
      const previewRoot = document.getElementById('preview-root-container');
      if (previewRoot) {
        previewRoot.classList.remove('anim-pop-in-origin');
        previewRoot.classList.add('anim-pop-out-origin');
        setTimeout(() => {
          appState.animDirection = 'none';
          setView('editor', 'none');
        }, 250);
      } else {
        appState.animDirection = 'none';
        setView('editor', 'none');
      }
    }

    function getPreviewHTML() {
      const scaledW = Math.round(794 * appState.previewZoom);
      const scaledH = Math.round(1123 * appState.previewZoom);
      
      return `
        <div id="preview-root-container" class="flex-1 flex flex-col bg-[#08080e] relative h-full overflow-hidden ${appState.animDirection==='pop-in'?'anim-pop-in-origin':''}" style="--tx:0px; --ty:100px;">
          <header class="flex items-center justify-between px-4 pt-4 pb-2 z-30 shrink-0 bg-transparent">
            <button onclick="closePreviewAnim()" class="px-4 py-2 flex items-center gap-1.5 bg-transparent rounded-full text-white text-[11px] font-extrabold border border-zinc-700 active:scale-90 uppercase tracking-wide transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg> EDIT
            </button>
            <div class="flex items-center gap-2 bg-transparent p-1.5 rounded-full border border-zinc-700">
              <button onclick="appState.previewZoom=Math.max(0.3, appState.previewZoom-0.1); appState.animDirection='none'; renderApp();" class="w-7 h-7 flex items-center justify-center text-zinc-300 active:scale-90"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg></button>
              <span class="text-[11px] font-extrabold text-zinc-100 min-w-[32px] text-center tracking-wider">${Math.round(appState.previewZoom*100)}%</span>
              <button onclick="appState.previewZoom=Math.min(1.5, appState.previewZoom+0.1); appState.animDirection='none'; renderApp();" class="w-7 h-7 flex items-center justify-center text-zinc-300 active:scale-90"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg></button>
            </div>
            <button onclick="handleDirectPrint()" class="px-4 py-2 flex items-center gap-1.5 bg-transparent rounded-full text-emerald-400 text-[11px] font-extrabold active:scale-90 uppercase tracking-wide border border-emerald-500 transition-all">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> PRINT
            </button>
          </header>
          <div id="preview-viewport" class="flex-1 overflow-auto p-4 pb-10 flex flex-col items-center">
             <div class="relative bg-white shadow-2xl transition-all" style="width:${scaledW}px; height:${scaledH}px; min-height:${scaledH}px;">
                <div style="width:794px; min-height:1123px; transform: scale(${appState.previewZoom}); transform-origin: top left; position: absolute; top:0; left:0;">
                  ${getCVDocumentHTML('cv-screen-preview', false)}
                </div>
             </div>
          </div>
        </div>
      `;
    }

    function renderPrintNode() {
      if(!appState.cvData) return;
      const c = document.getElementById('cv-print-container');
      if(c) c.innerHTML = getCVDocumentHTML('cv-actual-print', true);
    }
    function handleDirectPrint() {
      renderPrintNode();
      setTimeout(() => window.print(), 100);
    }

    function getCVDocumentHTML(id, isPrintMode) {
      const cv = appState.cvData;
      if(!cv) return '';
      const p = cv.personal;
      const d = cv.details;
      const f = cv.footer;
      const font = cv.font === 'Times New Roman' ? '"Times New Roman", Times, serif' : cv.font;

      const contactList = [
        { label: 'Name', val: p.name, bold: true, upper: true },
        { label: 'Address', val: p.villagePost },
        { label: 'Tehsil', val: p.tehsil },
        { label: 'District', val: p.district },
        { label: 'State', val: p.state },
        { label: 'Mobile No.', val: p.mobile },
        { label: 'Email Id', val: p.email }
      ].filter(x => x.val && x.val.trim());

      const contactRowsHTML = contactList.map((item, idx) => `
        <tr>
          <td style="font-weight:bold; font-size:${idx === 0 ? '12pt' : '11pt'}; vertical-align:top; padding:1.5px 0; color:#000; width:80px; text-transform:none;">${item.label}</td>
          <td style="font-weight:bold; font-size:${idx === 0 ? '12pt' : '11pt'}; text-align:center; vertical-align:top; padding:1.5px 0; color:#000; width:15px;">:</td>
          <td style="font-weight:${idx === 0 ? 'bold' : 'normal'}; font-size:${idx === 0 ? '12pt' : '11pt'}; text-transform:${item.upper ? 'uppercase' : 'none'}; vertical-align:top; padding:1.5px 0; color:#000;">${item.val}</td>
        </tr>
      `).join('');

      const personalDetailsHTML = [
        { l: 'Name', v: p.name, upper: true, bold: true },
        { l: 'Date of Birth', v: d.dob },
        { l: "Father's Name", v: d.father },
        { l: 'Gender', v: d.gender },
        { l: 'Marital Status', v: d.marital },
        { l: 'Nationality', v: d.nationality },
        { l: 'Language Known', v: d.languages },
        { l: 'Hobbies', v: d.hobbies }
      ].map(item => `
        <tr>
          <td style="padding:2px 0; vertical-align:top; color:#000; width:140px; font-weight:normal; text-transform:none;">${item.l}</td>
          <td style="padding:2px 0; text-align:center; font-weight:bold; vertical-align:top; color:#000; width:18px;">:</td>
          <td style="padding:2px 0; font-weight:${item.bold ? 'bold' : 'normal'}; text-transform:${item.upper ? 'uppercase' : 'none'}; vertical-align:top; color:#000;">${item.v || ''}</td>
        </tr>
      `).join('');

      const genList = (arr) => (arr||[]).filter(x => x.trim()).map(x => `<li style="padding-left:4px; line-height:1.35; color:#000; font-weight:normal; text-transform:none;">${x}</li>`).join('');
      
      const academicHTML = genList(cv.academic);
      const otherHTML = genList(cv.other);
      const expHTML = genList(cv.experience);

      const photoBoxHTML = p.photo ? 
        `<img src="${p.photo}" style="width:96px !important; height:124px !important; object-fit:cover !important; display:block !important; margin:0 auto;" />` : 
        `<div style="width:96px; height:124px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px dashed #71717a;"><span style="font-size:7.5pt; font-weight:bold; color:#000;">PHOTO</span></div>`;

      return `
        <div id="${id}" style="width:${isPrintMode ? '100%' : '794px'}; min-height:${isPrintMode ? '288mm' : '1123px'}; background-color:#ffffff; color:#000; padding:${isPrintMode ? '4mm' : '6mm'}; font-family:${font}; box-sizing:border-box; font-weight:normal;">
          <div style="width:100%; min-height:${isPrintMode ? '282mm' : '1085px'}; border:1.5px solid #000; padding:2.5px; box-sizing:border-box;">
            <div style="width:100%; min-height:calc(${isPrintMode ? '282mm' : '1085px'} - 7px); border:2.5px solid #000; padding:6mm 8mm; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between;">
              
              <div>
                <h1 class="font-algerian" style="text-align:center; font-size:22pt; font-weight:bold; text-decoration:underline; margin-bottom:8px; color:#000; text-transform:uppercase;">CURRICULUM VITAE</h1>
                <table style="width:100%; table-layout:fixed; border-collapse:collapse;">
                  <tr>
                    <td style="vertical-align:top; width:calc(100% - 116px);">
                      <table style="width:100%; font-size:11pt; color:#000;">${contactRowsHTML}</table>
                    </td>
                    <td style="width:110px; vertical-align:top; text-align:right;">
                      <div style="width:96px; height:124px; border:1.5px solid #000; overflow:hidden; margin-left:auto;">${photoBoxHTML}</div>
                    </td>
                  </tr>
                </table>
                <div style="width:100%; height:4px; border-top:1.2px solid #000; border-bottom:1.2px solid #000; margin:6px 0;"></div>
              </div>

              <div style="display:flex; flex-direction:column; flex:1; justify-content:space-evenly; margin:4px 0; gap:8px; font-size:11pt; color:#000;">
                ${cv.objective ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Carrier Objective:-</h2><ul style="list-style-type:disc; margin-left:24px;"><li style="padding-left:4px; text-align:justify; font-weight:normal; text-transform:none;">${cv.objective}</li></ul></div>` : ''}
                ${academicHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Academic Qualification:-</h2><ul style="list-style-type:disc; margin-left:24px;">${academicHTML}</ul></div>` : ''}
                ${otherHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Other Qualification:-</h2><ul style="list-style-type:disc; margin-left:24px;">${otherHTML}</ul></div>` : ''}
                ${expHTML ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Working Experience:-</h2><ul style="list-style-type:disc; margin-left:24px;">${expHTML}</ul></div>` : ''}
                
                <div>
                  <h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Personal Detail:-</h2>
                  <table style="width:100%; font-size:11pt; margin-left:14px; color:#000;">${personalDetailsHTML}</table>
                </div>

                ${cv.declaration ? `<div><h2 style="font-size:11.5pt; font-weight:bold; text-decoration:underline; margin-bottom:2px; text-transform:none;">Declaration:-</h2><p style="text-align:justify; font-weight:normal; text-transform:none;">${cv.declaration}</p></div>` : ''}
              </div>

              <div style="padding-top:10px;">
                <table style="width:100%; font-size:11.5pt; font-weight:bold; color:#000;">
                  <tr>
                    <td style="vertical-align:bottom; text-transform:none;">Date: ${f.date}<br/>Place: ${f.place}</td>
                    <td style="vertical-align:bottom; text-align:right; text-transform:uppercase;">( ${f.signName || p.name} )</td>
                  </tr>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if(!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => setView('home'));
  </script>
</body>
</html>
