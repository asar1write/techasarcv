  <style>
    /* PREVENT APP CREATOR 24 WHITE/BLACK SCREEN FLASH */
    html, body {
      background-color: #08080e !important;
      color: #f4f4f5;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevent bounce scroll */
    }

    @font-face {
      font-family: 'Algerian';
      font-style: normal;
      font-weight: 400;
      src: local('Algerian'), url('https://fonts.cdnfonts.com/s/137771/vertopal.com_vertopal.com_ALGER.woff') format('woff');
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* HIDE ALL SCROLLBARS GLOBALLY */
    * {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }
    *::-webkit-scrollbar,
    ::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }

    .font-algerian {
      font-family: 'Algerian', 'Times New Roman', serif !important;
    }

    /* HARDWARE-ACCELERATED ULTRA-SMOOTH ANIMATIONS */
    @keyframes smoothSlideRight {
      0% { opacity: 0; transform: translate3d(20px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes smoothSlideLeft {
      0% { opacity: 0; transform: translate3d(-20px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes elegantFadeIn {
      0% { opacity: 0; transform: translate3d(0, 10px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes elegantFadeOut {
      0% { opacity: 1; transform: translate3d(0, 0, 0); }
      100% { opacity: 0; transform: translate3d(0, -10px, 0); }
    }

    .smooth-item-entry {
      animation: smoothItemExpand 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      will-change: transform, opacity, max-height;
    }

    @keyframes smoothItemExpand {
      0% { opacity: 0; transform: translate3d(0, -12px, 0) scale(0.96); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); max-height: 140px; margin-bottom: 8px; }
    }

    .anim-next { animation: smoothSlideRight 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .anim-prev { animation: smoothSlideLeft 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .elegant-entry { animation: elegantFadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .elegant-exit { pointer-events: none; animation: elegantFadeOut 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards !important; }

    /* Custom Scrollbar for dropdown */
    .custom-scrollbar::-webkit-scrollbar { width: 4px !important; display: block !important; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

    /* Ambient Blobs */
    @keyframes blobFloat1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }
    @keyframes blobFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-20px, 20px) scale(0.95); } }
    .blob-1 { animation: blobFloat1 12s ease-in-out infinite; }
    .blob-2 { animation: blobFloat2 15s ease-in-out infinite; }

    @keyframes fadeUpEntry { 0% { opacity: 0; transform: translate3d(0, 12px, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
    .stagger-entry { opacity: 0; animation: fadeUpEntry 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .d-0 { animation-delay: 0ms; } .d-1 { animation-delay: 50ms; } .d-2 { animation-delay: 100ms; } .d-3 { animation-delay: 150ms; }

    .cv-page-canvas { width: 794px; min-height: 1123px; box-sizing: border-box; background-color: #ffffff; text-transform: none !important; }
    #cv-print-container { display: none; }

    body.is-printing { background-color: #ffffff !important; color: #000000 !important; overflow: hidden !important; }
    body.is-printing > *:not(#cv-print-container) { display: none !important; }
    body.is-printing #cv-print-container { display: block !important; position: static !important; width: 100% !important; visibility: visible !important; }

    @media print {
      @page { size: A4 portrait; margin: 0 !important; }
      *, *::before, *::after { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box !important; }
      html, body { width: 210mm !important; height: 297mm !important; margin: 0 !important; padding: 0 !important; background: #ffffff !important; color: #000000 !important; overflow: hidden !important; text-transform: none !important; }
      body > *:not(#cv-print-container) { display: none !important; }
      #cv-print-container { display: block !important; position: absolute !important; top: 0 !important; left: 0 !important; width: 210mm !important; height: 297mm !important; max-height: 297mm !important; margin: 0 !important; padding: 0 !important; background: #ffffff !important; color: #000000 !important; box-sizing: border-box !important; overflow: hidden !important; page-break-after: avoid !important; page-break-inside: avoid !important; page-break-before: avoid !important; z-index: 999999 !important; visibility: visible !important; text-transform: none !important; }
      #cv-print-container * { visibility: visible !important; }
    }
  </style>

    // PERFECT SMOOTH XY ANIMATION ENGINE (Fixes "Jhatke")
    function launchModalFromOrigin(triggerEl, modalId, boxId) {
      const modal = document.getElementById(modalId); const box = document.getElementById(boxId); if (!modal || !box) return;
      let rect = triggerEl ? triggerEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
      lastTriggerRect = rect;
      
      const triggerCenterX = rect.left + (rect.width / 2);
      const triggerCenterY = rect.top + (rect.height / 2);

      // Pre-position without triggering layout reflow jerk
      box.style.transition = 'none';
      box.style.left = `${triggerCenterX}px`; box.style.top = `${triggerCenterY}px`;
      box.style.transform = `translate(-50%, -50%) scale(0.05)`;
      box.style.opacity = '0'; box.style.borderRadius = '40px';

      modal.classList.remove('hidden'); modal.classList.add('block'); 
      void box.offsetWidth; // Force Reflow

      box.style.transition = 'transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease, border-radius 0.35s ease';
      const screenCenterX = window.innerWidth / 2; const screenCenterY = window.innerHeight / 2;
      
      modal.classList.remove('opacity-0'); modal.classList.add('opacity-100');
      box.style.left = `${screenCenterX}px`; box.style.top = `${screenCenterY}px`;
      box.style.transform = `translate(-50%, -50%) scale(1)`; box.style.opacity = '1'; box.style.borderRadius = '24px';
    }

    function collapseModalToOrigin(modalId, boxId, onFinished = null) {
      const modal = document.getElementById(modalId); const box = document.getElementById(boxId); if (!modal || !box) return;
      let targetX = window.innerWidth / 2; let targetY = window.innerHeight / 2;
      if (lastTriggerRect) { targetX = lastTriggerRect.left + (lastTriggerRect.width / 2); targetY = lastTriggerRect.top + (lastTriggerRect.height / 2); }

      box.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
      modal.classList.remove('opacity-100'); modal.classList.add('opacity-0');
      box.style.left = `${targetX}px`; box.style.top = `${targetY}px`;
      box.style.transform = `translate(-50%, -50%) scale(0.05)`; box.style.opacity = '0'; box.style.borderRadius = '40px';

      setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('block'); if (onFinished) onFinished(); }, 300);
    }

    function parseDateParts(dateStr) {

      else if (dateStr.includes('-')) { const p = dateStr.split('-'); if (p[0] && p[0].length === 4) return { dd: p[2] || '', mm: p[1] || '', yyyy: p[0] || '' }; else return { dd: p[0] || '', mm: p[1] || '', yyyy: p[2] || '' }; }
      return { dd: '', mm: '', yyyy: '' };

            ${createCustomDropdown('textCase', [{label: 'UPPERCASE (ALL CAPITAL)', val: 'uppercase'}, {label: 'PROPER CASE (Mo Asar)', val: 'capitalize'}], 'TEXT CASE', 'SELECT TEXT CASE')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden relative">
          <div class="h-14 px-4 flex items-center justify-between shrink-0 sticky top-0 z-30 bg-transparent">
            <button type="button" onclick="goToHome()" title="HOME" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-400 hover:text-white bg-[#141424]/80 hover:bg-white/[0.1] border border-white/10 backdrop-blur-xl active:scale-90 transition-all shadow-lg"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
            <div class="px-4 py-1.5 rounded-full bg-[#141424]/80 border border-white/10 backdrop-blur-xl shadow-lg"><span class="text-xs font-black text-zinc-200 tracking-wider">STEP ${currentPage}/${TOTAL_STEPS}</span></div>
            <button type="button" onclick="openResetDialog()" title="RESET CV" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-400 hover:text-red-400 bg-[#141424]/80 hover:bg-red-500/20 border border-white/10 backdrop-blur-xl active:scale-90 transition-all shadow-lg"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg></button>
          </div>
          <div id="editor-scroll-area" class="flex-1 overflow-y-auto px-4 py-3 pb-28 w-full overflow-x-hidden relative scroll-smooth bg-[#08080e]">
            <div class="${animClass} w-full max-w-lg mx-auto">${stepContentHTML}</div>
          </div>
          <div class="absolute bottom-4 left-0 right-0 z-30 pointer-events-none flex justify-center items-center pb-[max(0px,env(safe-area-inset-bottom))]">
            <div class="pointer-events-auto flex items-center justify-between px-6 max-w-xs w-full">
              <button type="button" ${currentPage === 1 ? 'disabled' : ''} onclick="goPrevStep()" title="PREVIOUS STEP" class="w-12 h-12 rounded-full flex items-center justify-center bg-[#141424]/90 border border-white/10 text-zinc-300 hover:text-white disabled:opacity-20 disabled:pointer-events-none active:scale-90 transition-all shadow-xl backdrop-blur-xl"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6" /></svg></button>
              <button type="button" onclick="openPreview()" title="PREVIEW CV" class="w-14 h-14 rounded-full flex items-center justify-center bg-[#18182a]/95 border border-emerald-500/30 text-emerald-400 hover:text-emerald-300 active:scale-90 transition-all shadow-2xl shadow-emerald-500/20 backdrop-blur-xl"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg></button>
              <button type="button" onclick="goNextStep()" title="${currentPage === TOTAL_STEPS ? 'REVIEW CV' : 'NEXT STEP'}" class="w-12 h-12 rounded-full flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white active:scale-90 transition-all shadow-xl shadow-indigo-600/40 backdrop-blur-xl">
                ${currentPage === TOTAL_STEPS ? '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12" /></svg>' : '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6" /></svg>'}
              </button>
            </div>
          </div>
        </div>
      `;
      requestAnimationFrame(() => { container.querySelectorAll('textarea').forEach(el => autoResizeTextarea(el)); });
    }

    function renderPreviewView(container) {
      container.classList.remove('elegant-exit'); fitPreviewWidth();
      const scaledW = Math.round(794 * previewZoom); const scaledH = Math.round(1123 * previewZoom);
      container.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden bg-[#06060a] elegant-entry relative">
          <div class="h-14 px-4 flex items-center justify-between shrink-0 bg-transparent z-20">
            <button type="button" onclick="closePreview()" title="BACK TO EDIT" class="w-10 h-10 flex items-center justify-center rounded-full text-zinc-300 hover:text-white bg-[#141424]/80 border border-white/10 backdrop-blur-xl active:scale-90 transition-all shadow-lg"><svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" /></svg></button>
            <div class="px-4 py-1.5 rounded-full bg-[#141424]/80 border border-white/10 backdrop-blur-xl shadow-lg"><span class="text-xs font-black text-zinc-200 tracking-wider">A4 PREVIEW</span></div>
            <button type="button" onclick="handleDirectPrint()" title="PRINT CV" class="w-10 h-10 flex items-center justify-center rounded-full text-emerald-400 bg-emerald-500/15 border border-emerald-500/30 backdrop-blur-xl active:scale-90 transition-all shadow-lg"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg></button>
          </div>
          <div id="preview-viewport-container" class="flex-1 overflow-y-auto overflow-x-auto p-2 sm:p-6 pb-24 flex flex-col items-center relative" style="background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.2px), linear-gradient(to bottom, #090a10, #040407); background-size: 20px 20px, 100% 100%;">
            <div class="relative my-auto shrink-0 bg-white" style="width: ${scaledW}px; height: ${scaledH}px; min-height: ${scaledH}px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 15px 35px -5px rgba(0, 0, 0, 0.85);">
              <div style="width: 794px; min-height: 1123px; transform: scale(${previewZoom}); transform-origin: top left; position: absolute; top: 0; left: 0;">${getDocumentHTML('cv-screen-preview-node', false)}</div>
            </div>
          </div>
          <div class="absolute bottom-4 left-0 right-0 z-30 pointer-events-none flex justify-center items-center pb-[max(0px,env(safe-area-inset-bottom))]">
            <div class="pointer-events-auto flex items-center justify-between px-6 max-w-xs w-full">
              <button type="button" onclick="closePreview()" title="EDIT DETAILS" class="w-12 h-12 rounded-full flex items-center justify-center bg-[#141424]/90 border border-white/10 text-zinc-300 hover:text-white active:scale-90 transition-all shadow-xl backdrop-blur-xl"><svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg></button>
              <button type="button" onclick="handleDirectPrint()" title="PRINT CV" class="w-14 h-14 rounded-full flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 text-white active:scale-90 transition-all shadow-2xl shadow-emerald-600/40 backdrop-blur-xl"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></svg></button>
            </div>
          </div>
        </div>
      `;
    }

    function goNextStep() { if (currentPage < TOTAL_STEPS) { animDirection = 'next'; currentPage++; isNavigating = true; renderApp(); } else { openPreview(); } }
    function goPrevStep() { if (currentPage > 1) { animDirection = 'prev'; currentPage--; isNavigating = true; renderApp(); } }
    function openPreview() { activeView = 'preview'; fitPreviewWidth(); renderApp(); }
    function closePreview() { activeView = 'editor'; isNavigating = true; renderApp(); }
    function fitPreviewWidth() { const container = document.getElementById('preview-viewport-container'); const w = container ? container.clientWidth - 24 : window.innerWidth - 24; previewZoom = Number(Math.max(0.32, Math.min(1.0, w / 794)).toFixed(2)); }
    function handleDirectPrint() { triggerPrint(); }
    function openResetDialog() { const m = document.getElementById('reset-modal'); if (m) { m.classList.remove('hidden'); m.classList.add('flex'); } }
    function closeResetDialog() { const m = document.getElementById('reset-modal'); if (m) { m.classList.add('hidden'); m.classList.remove('flex'); } }
    function confirmReset() { cvData = JSON.parse(JSON.stringify(defaultCVData)); appStarted = false; currentPage = 1; activeView = 'editor'; currentCvId = null; localStorage.removeItem('techasar_current_cv_id'); saveState(); closeResetDialog(); renderApp(); }
    window.addEventListener('resize', () => { if (activeView === 'preview') { fitPreviewWidth(); renderApp(); } });
  </script>
</body>
</html>
